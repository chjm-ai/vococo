[project]
name = "vococo"
version = "0.1.0"
description = "A single-user personal AI assistant — always-on, multi-entry (Web / CLI / Voice), shared session & memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vococo contributors" }]
keywords = ["claude", "ai-agent", "personal-assistant", "claude-agent-sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "claude-agent-sdk==0.2.129",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
    "aiohttp>=3.9",
    "socksio>=1.0",
    "pywebpush>=1.14",
    "pyyaml>=6.0",
    "claude-monitor>=4.0.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chjm-ai/vococo"
Repository = "https://github.com/chjm-ai/vococo"
Issues = "https://github.com/chjm-ai/vococo/issues"

[project.scripts]
vococo = "vococo.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vococo*"]

[tool.setuptools.package-data]
"vococo.voice" = [
    "static/*.html",
    "static/*.js",
]
"vococo.gateway.adapters" = [
    "web_static/*.html",
    "web_static/*.json",
    "web_static/*.js",
    "web_static/*.css",
    "web_static/*.png",
]
