[project]
name = "claude-hermes"
version = "0.1.0"
description = "基于 Claude 订阅的个人 AI 助理(personal Hermes)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.110",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claude-hermes = "claude_hermes.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_hermes*"]
