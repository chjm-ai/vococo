[project]
name = "claude-hermes"
version = "0.1.0"
description = "A single-user personal AI assistant on your Claude subscription — always-on, multi-entry (Web / Telegram / CLI), shared session & memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "claude-hermes contributors" }]
keywords = ["claude", "ai-agent", "personal-assistant", "claude-agent-sdk", "telegram-bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "claude-agent-sdk==0.2.110",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
    "aiohttp>=3.9",
    "socksio>=1.0",
    "pywebpush>=1.14",
    "pyyaml>=6.0",
    "edge-tts>=6.1.0",
    "onnxruntime==1.23.2",
    "librosa>=0.11.0",
    "numba==0.62.1",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chjm-ai/Wazir"
Repository = "https://github.com/chjm-ai/Wazir"
Issues = "https://github.com/chjm-ai/Wazir/issues"

[project.scripts]
claude-hermes = "claude_hermes.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_hermes*"]

[tool.setuptools.package-data]
"claude_hermes.voice" = [
    "static/*.html",
    "static/*.js",
    "models/*.onnx",
]
"claude_hermes.gateway.adapters" = [
    "web_static/*.html",
    "web_static/*.json",
    "web_static/*.js",
    "web_static/*.css",
    "web_static/*.png",
]
