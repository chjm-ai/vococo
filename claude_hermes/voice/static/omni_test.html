<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni-Realtime 连线测试</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px;background:#111;color:#eee;margin:0}
  h3{margin:0 0 12px}
  button{font-size:16px;padding:10px 16px;margin:4px 4px 4px 0;border-radius:8px;border:none;background:#2a2a2a;color:#eee}
  button:active{background:#3a3a3a}
  #log{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#000;padding:8px;border-radius:6px;
       height:60vh;overflow:auto;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<h3>Qwen-Omni-Realtime WebRTC 连线测试</h3>
<div>
  <button id="start">① 开始连接</button>
  <button id="say">② 发一句文字测试</button>
  <button id="stop">③ 断开</button>
</div>
<div id="log"></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script>
// 独立的最小验证页——只测"WebRTC 连得上 + DataChannel 收发事件 + 音频轨道能放"这三件事,
// 不接入主通话界面(web_static/index.html 的 #callView),不影响现在能用的语音功能。
// 见 2026-07-10 与 Wesley 的讨论:阶段二前端接入前先用这页在真机上跑通最小闭环。
const logEl = document.getElementById("log");
function log(...args) {
  const line = args.map(a => (typeof a === "string" ? a : JSON.stringify(a))).join(" ");
  logEl.textContent += line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

const token = localStorage.getItem("hermes_token") || "";
let pc = null, dc = null, micStream = null;

async function start() {
  log("=== 开始连接 ===");
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    log("获取麦克风失败:", e.message || e);
    return;
  }
  log("麦克风已获取");

  pc = new RTCPeerConnection();
  micStream.getTracks().forEach(t => pc.addTrack(t, micStream));

  pc.ontrack = ev => {
    log("*** 收到远端音轨:", ev.track.kind, "***");
    document.getElementById("remoteAudio").srcObject = ev.streams[0];
  };
  pc.onconnectionstatechange = () => log("connectionState:", pc.connectionState);
  pc.oniceconnectionstatechange = () => log("iceConnectionState:", pc.iceConnectionState);

  dc = pc.createDataChannel("events");
  dc.onopen = () => log("*** 客户端 DataChannel 已打开(能发事件了) ***");
  dc.onclose = () => log("客户端 DataChannel 已关闭");
  dc.onerror = e => log("客户端 DataChannel 错误:", e.message || e);
  dc.onmessage = ev => log("[服务端事件·client-dc]", ev.data.slice(0, 300));

  pc.ondatachannel = ev => {
    log("*** 收到服务端 DataChannel,label =", ev.channel.label, "***");
    ev.channel.onmessage = msg => log("[服务端事件·server-dc]", msg.data.slice(0, 300));
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(resolve => {
    if (pc.iceGatheringState === "complete") return resolve();
    pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") resolve(); };
  });
  log("offer 已生成,发信令请求给后端代理...");

  let resp;
  try {
    resp = await fetch("/voice/omni/webrtc", {
      method: "POST",
      headers: { "Content-Type": "application/sdp", "X-Auth-Token": token },
      body: pc.localDescription.sdp,
    });
  } catch (e) {
    log("信令请求失败(网络):", e.message || e);
    return;
  }
  if (!resp.ok) {
    log("信令交换失败:", resp.status, await resp.text());
    return;
  }
  const answerSdp = await resp.text();
  log("拿到 answer,设置远端描述...");
  await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
  log("=== 建连流程走完,等状态变化(connectionState 应该变 connected) ===");
}

function say() {
  if (!dc || dc.readyState !== "open") {
    log("DataChannel 还没打开,发不了(先点①,等 connectionState=connected 且看到 client-dc 打开)");
    return;
  }
  dc.send(JSON.stringify({
    event_id: "e1", type: "session.update",
    session: { modalities: ["text", "audio"], instructions: "你是语音助手,简短回答。", turn_detection: null },
  }));
  setTimeout(() => {
    dc.send(JSON.stringify({
      event_id: "e2", type: "conversation.item.create",
      item: { type: "message", role: "user", content: [{ type: "input_text", text: "你好,请用一句话自我介绍" }] },
    }));
    dc.send(JSON.stringify({ event_id: "e3", type: "response.create" }));
    log("已发送文字测试消息,等回应(应该能听到语音回复)");
  }, 300);
}

function stop() {
  if (dc) dc.close();
  if (pc) pc.close();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  log("=== 已断开 ===");
}

document.getElementById("start").onclick = start;
document.getElementById("say").onclick = say;
document.getElementById("stop").onclick = stop;
</script>
</body>
</html>
