<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#181716">
<title>Wazir</title>
<!-- PWA:装到主屏 + Web Push 系统通知 -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/svg+xml" href="/wazir-mark.svg?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<!-- 防闪烁:渲染前先套用上次选择的主题 -->
<script>(function(){try{var t=localStorage.getItem("hermes_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<script>
// 已有缓存口令时,别让口令页先画出来再被 JS 摘掉(那一闪很难看)——
// 在 #login/#app 解析之前就用 document.write 插一段样式,首帧直接是隐藏态。
// 给它一个 id,万一口令其实已失效(401),tryEnter() 里会把这段样式摘掉、退回登录页。
try{
  if(localStorage.getItem("hermes_token")){
    document.write('<style id="bootSkip">#login{display:none}#app{display:flex!important}</style>');
  }
}catch(e){}
</script>

<div id="login">
  <div class="card">
    <div class="logo">
      <svg viewBox="150 20 100 220" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor" transform="translate(0,-10)">
          <path d="M150 232 q0 -11 14 -13 q22 -3 36 -3 q14 0 36 3 q14 2 14 13 q0 9 -14 11 q-22 3 -36 3 q-14 0 -36 -3 q-14 -2 -14 -11 z"/>
          <path d="M170 214 q-3 -6 0 -12 q10 -3 30 -3 q20 0 30 3 q3 6 0 12 q-30 5 -30 5 q0 0 -30 -5 z"/>
          <path d="M200 108 C 218 108 230 120 230 138 C 230 156 220 168 214 182 C 209 194 207 202 208 210 L 192 210 C 193 202 191 194 186 182 C 180 168 170 156 170 138 C 170 120 182 108 200 108 Z"/>
          <ellipse cx="200" cy="108" rx="30" ry="7.5"/>
          <ellipse cx="200" cy="98" rx="21" ry="5"/>
          <path d="M170 94 C 165 87 165 77 168 70 C 173 78 181 82 188 81 C 189 70 193 61 200 54 C 207 61 211 70 212 81 C 219 82 227 78 232 70 C 235 77 235 87 230 94 C 220 89 210 87 200 87 C 190 87 180 89 170 94 Z"/>
          <circle cx="200" cy="46" r="7.5"/>
          <circle cx="200" cy="74" r="4" fill="#c9a227"/>
        </g>
      </svg>
    </div>
    <h1>Wazir</h1>
    <p>输入访问口令</p>
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password">
    <button id="loginBtn">进入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" hidden>
  <div id="backdrop"></div>
  <div id="projModal" hidden>
    <div class="pmbox">
      <div class="pmhead">新建项目 · 选一个文件夹当工作目录</div>
      <div class="pmpathrow">
        <input id="pmPath" placeholder="/Users/…(可点下方进入,也可直接粘贴路径)"/>
        <button class="pmgo" id="pmGo">前往</button>
      </div>
      <div id="pmList"></div>
      <div class="pmfoot">
        <button id="pmCancel">取消</button>
        <button class="pmok" id="pmCreate">✓ 选此目录为项目</button>
      </div>
    </div>
  </div>

  <!-- 定时任务详情/编辑弹窗:一次只做「新建一条」或「编辑一条」,不兼列表——列表在
       侧栏「定时任务」分组里看,启停/删除在该任务的「⋯」菜单里操作(见 openConvMenu) -->
  <div id="cronModal" hidden>
    <div class="pmbox">
      <div class="pmhead"><span id="cronModalTitle">＋ 新建定时任务</span></div>
      <div id="cronForm">
        <input id="cfName" placeholder="任务名称,如「晨间简报」"/>
        <textarea id="cfPrompt" placeholder="到点时要执行的指令,如「查一下今天的日历和待办,简短汇总」"></textarea>
        <div class="cfrow">
          <select id="cfPreset">
            <option value="custom">自定义 cron 表达式…</option>
            <option value="0 8 * * *">每天早 8 点</option>
            <option value="0 12 * * *">每天中午 12 点</option>
            <option value="0 21 * * *">每天晚 9 点</option>
            <option value="0 9 * * 1">每周一早 9 点</option>
            <option value="0 21 * * 0">每周日晚 9 点</option>
            <option value="0 * * * *">每小时</option>
          </select>
          <input id="cfCron" placeholder="0 8 * * *"/>
        </div>
        <input id="cfTelegram" placeholder="可选:同时推送到 Telegram 的 chat_id"/>
        <div class="pmfoot">
          <button id="cfCancel">取消</button>
          <button class="pmok" id="cfSave">✓ 创建</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 会话搜索弹窗(⌘F / 侧栏放大镜):标题优先+正文,含归档;删除的会话已物理删除搜不到 -->
  <div id="searchModal" hidden>
    <div class="smbox">
      <div class="smhead" id="smHead"><input id="smInput" placeholder="搜索会话标题与内容…"></div>
      <div id="smList"></div>
    </div>
  </div>

  <!-- 图片大图查看器 -->
  <div id="imgViewer" hidden>
    <button class="ivbtn ivclose" id="ivClose" title="关闭">✕</button>
    <button class="ivbtn ivprev" id="ivPrev" title="上一张">‹</button>
    <img id="ivImg" alt="">
    <button class="ivbtn ivnext" id="ivNext" title="下一张">›</button>
    <div class="ivcount" id="ivCount"></div>
  </div>

  <!-- 跨会话审批/确认全屏弹窗 -->
  <div id="choiceModal" hidden>
    <div class="cmbox">
      <div class="cmhead">
        <span class="cmbadge"><span class="cmdot"></span>需要你的确认</span>
        <div class="cmtitle" id="choiceModalTitle">会话标题</div>
      </div>
      <div class="cmbody">
        <div class="cmprompt" id="choiceModalPrompt"></div>
        <div class="cmopts" id="choiceModalOpts"></div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗:MCP / 技能 / 记忆 / 人设 -->
  <div id="setModal" hidden>
    <div class="setbox">
      <div class="sethead">
        <span class="settitle">设置</span>
        <button class="setclose" id="setClose" title="关闭">✕</button>
      </div>
      <div class="setbody">
        <div class="settabs" id="setTabs">
          <button class="settab active" data-tab="mcp">MCP</button>
          <button class="settab" data-tab="models">模型</button>
          <button class="settab" data-tab="skill">技能</button>
          <button class="settab" data-tab="memory">记忆</button>
          <button class="settab" data-tab="agents">人设</button>
          <button class="settab" data-tab="notify">通知</button>
          <button class="settab" data-tab="appearance">外观</button>
        </div>
        <div class="setpane" id="setPane"></div>
      </div>
    </div>
  </div>
  <aside id="sidebar">
    <div class="shead">
      <div class="brand">Wazir</div>
      <button id="searchBtn" class="sfoicon" title="搜索会话 (⌘F)"></button>
      <button id="collapseBtn" title="收起侧边栏"></button>
    </div>
    <button id="newBtn"><span class="np">＋</span>新对话</button>
    <button id="cronEntryBtn"><span class="np">⏰</span>定时任务</button>
    <div id="convList"></div>
    <div class="sfoot" id="sfoot"><span class="savatar">U</span><span class="sfoottxt" id="sfoottxt">User</span>
      <div id="convFilterBox">
        <button id="convFilterBtn" class="sfoicon" title="筛选会话"></button>
        <div id="convFilterPop" hidden></div>
      </div>
      <button id="settingsBtn" class="sfoicon" title="设置"></button>
    </div>
  </aside>
  <main id="chatMain" hidden>
    <header class="bar">
      <div class="barwrap">
        <button class="icon" id="hamb"></button>
        <div class="title">
          <span id="convTitle">主会话</span>
          <span class="tsub">
            <span id="gitBox">
              <button class="tgit" id="convGit" type="button" title="项目 Git 状态" hidden></button>
              <div id="gitPop" hidden></div>
            </span>
          </span>
        </div>
        <div id="ctxBox">
          <button class="hswitch" id="convCronToggle" type="button" title="启用/停用" hidden></button>
          <button class="hmore" id="convCronEditBtn" type="button" title="编辑任务" hidden></button>
          <button class="hmore" id="convCronMore" type="button" title="更多" hidden>⋯</button>
          <button id="barMeta" type="button" title="上下文占用 · 点击看明细" hidden>
            <svg class="ctxring" viewBox="0 0 20 20"><circle class="track" cx="10" cy="10" r="8"/><circle class="fill" id="ctxRing" cx="10" cy="10" r="8"/></svg>
            <span id="ctxPct">0%</span>
          </button>
          <div id="ctxPop" hidden></div>
        </div>
      </div>
    </header>
    <div id="messages">
      <div class="wrap" id="wrap"></div>
      <div id="convLoading">
        <div class="skel ai"></div>
        <div class="skel me"></div>
        <div class="skel ai2"></div>
      </div>
      <div id="empty">
        <div class="elogo">
          <svg viewBox="150 20 100 220" xmlns="http://www.w3.org/2000/svg">
            <g fill="currentColor" transform="translate(0,-10)">
              <path d="M150 232 q0 -11 14 -13 q22 -3 36 -3 q14 0 36 3 q14 2 14 13 q0 9 -14 11 q-22 3 -36 3 q-14 0 -36 -3 q-14 -2 -14 -11 z"/>
              <path d="M170 214 q-3 -6 0 -12 q10 -3 30 -3 q20 0 30 3 q3 6 0 12 q-30 5 -30 5 q0 0 -30 -5 z"/>
              <path d="M200 108 C 218 108 230 120 230 138 C 230 156 220 168 214 182 C 209 194 207 202 208 210 L 192 210 C 193 202 191 194 186 182 C 180 168 170 156 170 138 C 170 120 182 108 200 108 Z"/>
              <ellipse cx="200" cy="108" rx="30" ry="7.5"/>
              <ellipse cx="200" cy="98" rx="21" ry="5"/>
              <path d="M170 94 C 165 87 165 77 168 70 C 173 78 181 82 188 81 C 189 70 193 61 200 54 C 207 61 211 70 212 81 C 219 82 227 78 232 70 C 235 77 235 87 230 94 C 220 89 210 87 200 87 C 190 87 180 89 170 94 Z"/>
              <circle cx="200" cy="46" r="7.5"/>
              <circle cx="200" cy="74" r="4" fill="#c9a227"/>
            </g>
          </svg>
        </div>
        <h2>你好，我是 Wazir</h2>
        <p>你的私人 AI 助理 · 有什么需要直接说</p>
        <div class="sugs">
          <button type="button" class="sug" onclick="openCallView()">📞 语音通话</button>
          <button class="sug" data-s="你能做什么">你能做什么</button>
          <button class="sug" data-s="有哪些技能">有哪些技能</button>
          <button class="sug" data-s="看看今天的安排">看看今天的安排</button>
        </div>
        <div class="home-section">
          <div class="home-section-title">最近对话</div>
          <div class="home-recent" id="homeRecent"></div>
        </div>
      </div>
    </div>
    <button id="scrollDownBtn" aria-label="滚到底部" title="滚到底部" onclick="scrollDownSmooth()">↓</button>
    <form id="composer" autocomplete="off">
      <div class="combg">
        <div class="cwrap">
          <div id="pending"></div>
          <div id="thumbs"></div>
          <div class="inrow">
            <!-- 新会话项目选择:悬浮在输入框左上角;仅草稿态(local- 会话)显示,
                 发出第一条消息后转正就隐藏——见 renderProjSelChip() -->
            <div id="projSel" hidden>
              <button type="button" id="projSelBtn" title="切换项目">
                <span id="projSelName">默认项目</span><span class="caret chev down"></span>
              </button>
              <div id="projSelPop" hidden></div>
            </div>
            <div id="cmdPop" hidden></div>
            <textarea id="ta" rows="2" placeholder="发消息…"></textarea>
            <div class="inbar">
              <button type="button" id="imgBtn">＋</button>
              <button type="button" id="micBtn" title="语音输入"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 19v3"/><path d="M8 22h8"/></svg></button>
              <span class="spacer"></span>
              <div id="modelBox">
                <button type="button" id="modelBtn" title="切换模型">
                  <span id="modelName">模型</span><span class="caret chev down"></span>
                </button>
                <div id="modelPop" hidden></div>
              </div>
              <button type="submit" id="sendBtn">↑</button>
            </div>
          </div>
          <div id="recRow" aria-label="录音中,点右侧发送或点左侧叉取消">
            <button type="button" id="recCancel" title="取消">✕</button>
            <span class="rdot"></span>
            <canvas id="recWave"></canvas>
            <span id="recTime">0:00</span>
            <button type="button" id="recSend" title="发送">↑</button>
          </div>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </form>
  </main>
  <!-- 通话视图:语音伴聊(原独立 /voice 页,2026-07-09 并入主 SPA,见 00-overview.md
       §2 隔离约束的修订说明)。跟 #chatMain 互斥显隐,左上角复用同一套侧栏展开逻辑,
       原地叠加不打断通话——这正是要合并的原因。 -->
  <main id="callView" hidden>
    <header id="callHead">
      <button id="backLink" title="展开侧栏"></button>
      <span class="title">语音伴聊</span>
      <button id="clearVoiceCtxBtn" title="清空语音聊天上下文(AI 从头开始,历史保留)"></button>
      <button id="tasksBtn" title="任务"><span id="tasksIcon"></span><span id="tasksBadge"></span></button>
    </header>
    <!-- 后台任务状态条:有排队/进行中任务才出现,见 renderTaskBar() -->
    <div id="taskBar" hidden></div>
    <div id="callBody">
      <div id="transcript"></div>
    </div>
    <!-- Omni 出声模式:阿里云通过 WebRTC 远端轨道发回的 AI 语音从这里播——
         这是标准电话链路(远端 RTC 轨道),iOS 的回声消除天然把它当参考信号,
         跟 2026-07-10 炸过的"本地 Web Audio 转 <audio>"(a544051)不是一回事。
         audio 不带 controls 不占版面,不用 hidden。 -->
    <audio id="omniRemoteAudio" autoplay playsinline></audio>
    <footer id="callFoot">
      <button id="stopBtn" hidden><span class="btnicon" id="stopIcon"></span>停</button>
      <!-- 半双工兜底:只有免提初始化失败/浏览器不支持时才出现,见 initUiMode() -->
      <button id="talkBtn" hidden>按住说话</button>
      <!-- 免提是唯一路径:进入通话视图就自动开始,不需要再点一次按钮——
           声纹球常驻可见,状态文字紧贴在球下面,静音/挂断这两个小图标按钮同一行。 -->
      <div id="handsFreeUi">
        <div id="orbWrap" class="idle" title="点一下可以打断 AI 说话">
          <canvas id="orbCanvas" width="640" height="200"></canvas>
        </div>
        <div id="statusLine"><span id="connDot" class="conn-disconnected"></span><div id="status">连接中…</div></div>
        <div id="callActions">
          <button id="muteToggleBtn" title="静音麦克风" aria-label="静音麦克风"></button>
          <div id="voicePickBtn" title="切换音色">
            <span id="voiceIcon"></span>
            <select id="voiceSelect" aria-label="切换音色"></select>
          </div>
          <button id="endHandsFreeBtn" title="结束通话" aria-label="结束通话"></button>
        </div>
      </div>
      <!-- 启动按钮模式:进入通话视图不自动开始录音,用户点这个按钮才启动。
           一轮交互结束后回到此按钮待机状态,再点再开始。 -->
      <button id="startCallBtn" hidden title="开始录音" aria-label="开始录音"></button>
    </footer>
    <div id="tasksDrawer">
      <div id="tasksSheet">
        <h3>后台任务</h3>
        <div id="tasksList"></div>
      </div>
    </div>
  </main>
</div>

<!-- 工具卡片渲染:纯函数声明,不在自己的顶层调用任何东西,放在主脚本前不影响执行顺序
     (它引用的 el/esc/ic/mdToHtml/DOTS 只在函数体内用,真正被调用时主脚本早已跑完)。 -->
<script src="/tool-card.js"></script>
<script>
"use strict";
// ── 状态 ────────────────────────────────────────────────────────────────
const S = {
  token: localStorage.getItem("hermes_token") || "",
  conv: "main",
  convs: [],            // [{conv,title,turns,last_ts,pinned}]
  projects: [],         // [{hash,name,path,last_used}]
  project: null,        // 「活跃」项目 hash(顶部 ＋新对话 建在此;随打开的会话联动);null=默认项目
  expanded: new Set(),  // 已展开的分组:默认项目用 "__default__",项目用其 hash
  moreShown: new Set(), // 点过「展开更多」的分组(键同 expanded):折叠该组或刷新页面即清空,回到默认 5 条
  browseDir: "",        // 目录浏览器当前所在目录
  images: [],           // {data,media_type,url}
  stream: null,         // 当前正在流式的 assistant 气泡 DOM 引用
  localSent: false,     // 本客户端刚发了消息,收到 "user" 事件时跳过(避免重复气泡)
  es: null,
  lastId: 0,            // 已处理的最大事件编号,用于断线重连后去重
  bootId: null,         // 服务端进程启动标识,变了说明重启过,断线补发这条路救不回来,得整体核对
  models: {default:"", choices:[]},  // /models 拉到的可选模型
  model: "",            // 当前会话使用的模型(空=用默认)
  commands: [],          // /commands 拉到的系统斜杠命令清单 [{name,desc}]
  skills: [],            // /commands 拉到的已启用 skill 清单 [{name,desc}]
  cmd: {open:false, items:[], active:0},  // 斜杠命令菜单当前状态
  git: null,            // 当前项目会话的 git 状态(/conv/git 返回);非项目会话为 null
  histCache: {},        // conv → turns[]:切会话时先渲缓存,消除空屏闪烁
  turnEventsCache: {},  // turn_id → 完整 events[]:工具卡片懒加载,点开某轮任意卡片后整轮缓存复用
  pendingChoice: {},    // conv → choice 事件:审批发给非当前会话时暂存,切回该会话再渲染
  live: {},             // conv → 进行中回合的事件缓冲:任意会话(含后台)都记录,切回时重放重建流式气泡
  streamSnap: {},       // conv → {state,asOf}:离开时摘下的流式气泡 DOM + 已处理到的事件下标,
                         // 切回来同一进度直接接上,不用把 live 缓冲从头重放一遍(见 maybeReplayStream)
  pendingReview: {},    // conv → bool:本地缓存会话是否有未读完成内容(避免灰点闪烁)
  pending: {},          // conv → 待发送队列 [{id,text,images}]:上一个任务没结束时点发送,暂存,任务完成自动发
  pendId: 0,            // 待发送项自增 id,供删除定位
  voiceRec: {},         // conv → {bubble}:语音转写中的占位气泡,按录音发起时所属会话记录,切走再切回能补出来
  convFilter: "all",
  rateStatus: {level:"ok", msg:"", lastErr:"", ts:0},  // ok|warn|err, 更新侧栏底部状态点
  dragSrc: null,        // 项目拖拽排序:正在被拖起的项目 hash
  dragMoved: false,     // 刚发生过一次拖拽落地,下一次 click 吞掉(不触发分组展开/收起)
  voiceSidebar: {main:null, tasks:[]},  // /voice/sidebar 拉到的"语音任务"固定分组数据
  cronJobs: [],         // /cron/sidebar 拉到的定时任务列表 [{conv,job_id,title,schedule_desc,enabled,last_status,...}]
  cronEditId: null,     // 定时任务表单当前在编辑哪个 job_id;null=新建模式
  swipedConv: null,     // 当前左滑展开的会话 id;renderConvs 重建 DOM 时靠它补回 swiped 状态,
                         // 否则任意会话(含后台)一完成回合就会触发 loadConvs→renderConvs 把菜单冲掉
  omniEnabled: false,   // /voice/config 的 omni_enabled,P3 阶段二开关,登录后预取好,
                         // 避免每次进通话视图都要等一趟网络往返才知道走哪条路径
  vadThreshold: 0.7,    // /voice/config 的 vad_threshold/vad_silence_ms,兜底默认跟
  vadSilenceMs: 2500,   // config.py 的 VOICE_OMNI_VAD_SILENCE_MS 默认值一致;2026-07-22 800 触发对话

        headers: {"Content-Type": "application/json", "X-Auth-Token": S.token},
        body: JSON.stringify(payload),
      }).catch(()=>{});
    }catch(e){}
  }
  // 全局兜底:通话链路里任何未捕获异常/未处理 rejection 都上报——2026-07-12 真机
  // 一次"卡在连接中"查因困难(静默死亡无痕迹),从此让它们留痕。
  window.addEventListener("error", e=>{
    vdbg("js.error", String(e.message).slice(0,180) + " @" + String(e.filename).split("/").pop() + ":" + e.lineno);
  });
  window.addEventListener("unhandledrejection", e=>{
    // Safari 的 Error.stack 不含 message,两个都要带上(2026-07-12 只记 stack 差点断案失败)
    const msg = String(e.reason).slice(0,140);
    const stk = String((e.reason && e.reason.stack) || "").slice(0,180);
    vdbg("js.unhandledrejection", msg + " || " + stk);
  });

  // ── 播放:Web Audio API,不用 <audio> 标签 ──────────────────────────────
  let audioCtx=null, currentSource=null;

  // 2026-07-09:曾经加过 WebRTC 环回 hack 想让浏览器原生 AEC 认出 TTS 音频当参考信号,
  // 一天内连续炸出"哑巴→双音重叠→再哑巴"三个不同故障,iOS Safari 音频会话的怪癖猜不动,
  // 拆掉换回最简单可靠的单路直连播放。回声消除这个需求单独另开工作评估。

  function setStatus(text, cls){ statusEl.textContent = text; statusEl.className = cls || ""; }
  function clearHint(){ const h = transcriptEl.querySelector(".hint"); if(h) h.remove(); }

  function addMsg(kind, text){
    clearHint();
    const parts = kind.split(" ");
    const who = parts[0];
    const isError = parts.includes("error");
    const isFiller = parts.includes("filler");
    const isActivity = parts.includes("activity");
    const row = document.createElement("div");
    row.className = "row " + (who === "me" ? "me" : "ai");
    const b = document.createElement("div");
    b.className = "bubble" + (isError ? " err" : "") + (isFiller ? " filler" : "") + (isActivity ? " activity" : "");
    if(isError){
      const icon = document.createElement("span");
      icon.className = "msgicon";
      icon.innerHTML = ic("warn");
      b.append(icon);
    }
    const span = document.createElement("span");
    span.className = "msgtext";
    span.textContent = text;
    b.append(span);
    row.append(b);
    transcriptEl.appendChild(row);
    row.scrollIntoView({block:"end"});
    return b;
  }
  function markBubbleError(b){
    b.classList.add("err");
    if(!b.querySelector(".msgicon")){
      const icon = document.createElement("span");
      icon.className = "msgicon";
      icon.innerHTML = ic("warn");
      b.prepend(icon);
    }
  }

  function unlockAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  }

  // 设备切换检测:track.onended/onmute + devicechange + visibilitychange 都往
  // 这上面累积计数,连续超过门槛才触发重连——避免短暂中断(切回前台时的过渡期)
  // 导致不必要的 WebRTC 重建。2026-07-14 真机:iOS 电话打断/蓝牙断开会令
  // getUserMedia 轨道 mute 或 ended,但没有 devicechange 监听和健康检查时,
  // ensureMicStream 会永远返回老化的流,用户无声无息变哑。
  let micHealthSuspectCount = 0;
  let micHealthSuspectTs = 0;
  const MIC_HEALTH_WINDOW = 3500;
  const MIC_HEALTH_THRESHOLD = 2;

  function micStreamHealthy(){
    if(!stream) return false;
    const tracks = stream.getAudioTracks();
    if(!tracks.length) return false;
    return tracks.some(t => t.readyState === "live");
  }

  function suspectMicProblem(reason){
    if(!handsFreeActive) return;
    const now = Date.now();
    if(now - micHealthSuspectTs > MIC_HEALTH_WINDOW){
      micHealthSuspectCount = 0;
      micHealthSuspectTs = now;
    }
    micHealthSuspectCount++;
    vdbg("mic.suspect", {reason, count: micHealthSuspectCount,
      ready: stream?.getAudioTracks().map(t=>t.readyState).join(",")});
    if(micHealthSuspectCount >= MIC_HEALTH_THRESHOLD){
      micHealthSuspectCount = 0;
      if(!micStreamHealthy()) resetMicStream();
      scheduleOmniReconnect("mic:"+reason, 500);
    }
  }

  // 给麦克风流的每条音轨挂监听:iOS 电话打断/蓝牙断开时 track 会 mute/ended
  function wireMicTrackListeners(ms){
    if(!ms) return;
    ms.getAudioTracks().forEach(t => {
      try{ t.onended = null; }catch(e){}
      try{ t.onmute = null; }catch(e){}
      t.onended = () => suspectMicProblem("ended");
      t.onmute = () => suspectMicProblem("muted");
    });
  }

  async function ensureMicStream(){
    if(!stream) {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {echoCancellation:true, noiseSuppression:true, autoGainControl:true}
      });
      wireMicTrackListeners(stream);
    }
    return stream;
  }

  // 音频设备变化监听:iOS 蓝牙断开/耳机插拔触发 devicechange,此时现有流可能已废
  if(navigator.mediaDevices && typeof navigator.mediaDevices.addEventListener === "function"){
    navigator.mediaDevices.addEventListener("devicechange", () => {
      if(handsFreeActive) suspectMicProblem("devicechange");
    });
  }

  // 重建 Omni 连线前必须换一条全新的麦克风流:把旧 RTCPeerConnection 里用过的
  // 音轨再 addTrack 进新 PC,音频能过阿里云 VAD(speech_started 正常),但输入转写
  // (input_audio_transcription.completed)再也不回事件——没有转写就永远不会发给
  // Claude,表现为"AI 不回复"(2026-07-12 真机日志实锤:新开通话必好、重连/切音色
  // 复用旧流必哑)。2026-07-13 复现:两次 handsfree.start 靠得很近但没走重连/切
  // 音色那两条显式调用路径,同样哑掉——干脆挪进 startOmniHandsFree 自己开头无条件
  // 调用,不用再看是谁触发的重开。这里停掉旧流让 ensureMicStream 重新要一条;
  // 声纹 analyser 挂在旧流上,一并拆掉,startOmniHandsFree 里的 ensureAnalyser()
  // 会用新流重建。
  function resetMicStream(){
    if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream = null; }
    if(analyserSource){ try{ analyserSource.disconnect(); }catch(e){} analyserSource = null; }
    analyser = null;
  }

  async function startRecording(){
    if(busy) return;
    unlockAudio();
    try{ await ensureMicStream(); }
    catch(e){ addMsg("ai error", "麦克风权限被拒绝,请到系统设置里允许"); return; }
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    pressTs = Date.now();
    recorder.start();
    talkBtn.classList.add("recording");
    setStatus("聆听中…", "listening");
  }

  function stopRecording(){
    if(!recorder || recorder.state === "inactive") return;
    talkBtn.classList.remove("recording");
    const dur = Date.now() - pressTs;
    const rec = recorder;
    recorder = null;
    rec.onstop = ()=>{
      if(dur < 500){ setStatus("空闲"); flushAnnouncements(); return; }
      const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
      handleTurn(blob);
    };
    rec.stop();
  }

  talkBtn.addEventListener("pointerdown", e=>{ e.preventDefault(); startRecording(); });
  talkBtn.addEventListener("pointerup", stopRecording);
  talkBtn.addEventListener("pointercancel", stopRecording);
  talkBtn.addEventListener("pointerleave", e=>{ if(recorder && recorder.state==="recording") stopRecording(); });

  async function handleTurn(blob){
    const fd = new FormData();
    fd.append("audio", blob, "voice.webm");
    await sendTurn(fd);
  }

  async function sendTurn(body){
    busy = true; talkBtn.disabled = true; stopBtn.hidden = false;
    ttsFailureNoticedThisTurn = false;
    setStatus("识别中…", "thinking");
    const headers = {"X-Auth-Token": S.token};
    const init = {method: "POST", headers};
    if(body instanceof FormData) init.body = body;
    else { headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }

    const finish = ()=>{
      busy = false; talkBtn.disabled = false; stopBtn.hidden = true; setStatus("空闲");
      endActivity();  // 回合结束:动作行保留在气泡流里,只断开指针,下一轮另起一条
      flushAnnouncements();
    };

    let resp;
    try{ resp = await fetch("/voice/send", init); }
    catch(e){ addMsg("ai error", "连不上服务"); finish(); return; }
    if(resp.status === 401){ authError(); finish(); return; }
    if(!resp.ok || !resp.body){
      addMsg("ai error", resp.status === 409 ? "上一轮还没说完" : "出错了");
      finish(); return;
    }

    let aiEl = null, full = "";
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    try{
      while(true){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let sep;
        while((sep = buf.indexOf("\n\n")) >= 0){
          const block = buf.slice(0, sep); buf = buf.slice(sep+2);
          const ev = parseSseBlock(block);
          if(!ev) continue;
          if(ev.event === "transcript"){
            addMsg("me", ev.data.text || "");
            setStatus("思考中…", "thinking");
          } else if(ev.event === "text"){
            stopWorkSound();  // AI 开口了,工作音效退场
            if(!aiEl) aiEl = addMsg("ai", "");
            full += ev.data.text || "";
            renderAi(aiEl, full);
          } else if(ev.event === "activity"){
            showActivity(ev.data.text);
          } else if(ev.event === "sentence"){
            playQueue.push(ev.data);
            pumpPlayback();
          } else if(ev.event === "done"){
            if(!aiEl) aiEl = addMsg("ai", "");
            if(ev.data.full_text){ full = ev.data.full_text; renderAi(aiEl, full); }
            if(ev.data.error){ markBubbleError(aiEl); if(!full) renderAi(aiEl, ev.data.error); }
          }
        }
      }
    }catch(e){ /* 流中断:下面统一收尾,不额外报错打扰用户 */ }
    finish();
  }

  function parseSseBlock(block){
    let event = "message", data = null;
    for(const line of block.split("\n")){
      if(line.startsWith("event:")) event = line.slice(6).trim();
      else if(line.startsWith("data:")) data = line.slice(5).trim();
    }
    if(data == null) return null;
    try{ return {event, data: JSON.parse(data)}; }catch(e){ return null; }
  }

  function renderAi(elm, full){
    elm.querySelector(".msgtext").textContent = full;
    elm.scrollIntoView({block:"end"});
  }

  // ── 前台动作行:AI 本轮查记录/跑脚本时,转写区一条小字实时显示在干什么
  //    (SSE activity 事件驱动)。动作变了原地更新并挪到气泡流末尾;
  //    回合结束只断开指针不删 DOM——留下最后一条当"这轮 AI 干了什么"的痕迹。
  let activityLineEl = null;

  function showActivity(text){
    if(!text) return;
    startWorkSound();  // AI 在干活(还没开口)→ 起工作音效,首个 text/回合结束时停
    if(!activityLineEl){ activityLineEl = addMsg("ai activity", text); return; }
    activityLineEl.querySelector(".msgtext").textContent = text;
    const row = activityLineEl.parentElement;
    transcriptEl.appendChild(row);
    row.scrollIntoView({block:"end"});
  }

  function endActivity(){ activityLineEl = null; stopWorkSound(); }

  // ── 工作音效:AI 调工具期间循环播一段很轻的"双音滴答"(Web Audio 合成,无素材)。
  //    音量刻意压低且是纯音不是语音——本地 Web Audio 出声在 RTC 回环之外,
  //    麦克风可能录到(2026-07-10 自回声教训),纯音短滴答不会被 ASR 转出文字,
  //    VAD 阈值 0.7 也不至于被这个音量触发;真机若误触发,直接把这两个函数体清空即可。
  //    0.15 太响(e212137 调上去过):它是唯一会和 AI 语音贴身共存的音效,
  //    盖住语音尾字还可能漏进麦克风,回落到 0.08。
  let workSound = null;

  function startWorkSound(){
    if(workSound || !audioCtx) return;
    vdbg("worksound.start", audioCtx.state);  // 排障:state 不是 running 就是 iOS 把 ctx 挂起了
    const master = audioCtx.createGain();
    master.gain.value = 0.08;
    master.connect(audioCtx.destination);
    const blip = ()=>{
      if(!audioCtx) return;
      // AI 正在出声/即将出声(Omni 朗读 response 在飞或已排队、自动回复在放、
      // 旧链路 TTS 在播)时这一响跳过,声音一停自动恢复。不能看 wsState:它念完
      // 垫场话后在整轮结束前一直挂在 speaking,会把干活期间的滴答全挡掉
      // (2026-07-12 真机:查任务进度时听不到音效,就是这个原因)。
      // omniReadTailTimer/队列非空也要压:response.done 后标志已清零但 WebRTC
      // 缓冲还有 ~400ms 尾音在播,这个窗口里响一声正好砸在 AI 的最后几个字上
      // (2026-07-13 真机:执行任务时音效吞尾字,就是这个窗口)。
      if(omniReadActive || omniReadPending > 0 || omniAutoActive || playing
         || omniReadTailTimer || omniReadQueue.length > 0) return;
      // iOS 在 getUserMedia/通话音频会话切换时会把 AudioContext 挂起(state 变
      // suspended/interrupted),挂起期间 currentTime 不走,此刻排的音全落在过去
      // =无声——先 resume,这一轮跳过,下一轮 interval 再响。
      if(audioCtx.state !== "running"){ try{ audioCtx.resume(); }catch(e){} return; }
      const t0 = audioCtx.currentTime;
      [1318.5, 1760].forEach((freq, i)=>{  // E6→A6 上行小滴答,间隔 180ms
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = freq;
        env.gain.setValueAtTime(0, t0 + i*0.18);
        env.gain.linearRampToValueAtTime(1, t0 + i*0.18 + 0.02);
        env.gain.exponentialRampToValueAtTime(0.001, t0 + i*0.18 + 0.22);
        osc.connect(env); env.connect(master);
        osc.start(t0 + i*0.18); osc.stop(t0 + i*0.18 + 0.25);
      });
    };
    blip();
    workSound = {timer: setInterval(blip, 1600), master};
  }

  function stopWorkSound(){
    if(!workSound) return;
    vdbg("worksound.stop");
    clearInterval(workSound.timer);
    try{ workSound.master.disconnect(); }catch(e){}
    workSound = null;
  }

  function base64ToArrayBuffer(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function noticeTtsFailure(){
    // audio_b64 为空 = 这句话确实要读但合成失败(见 voice/tts.py),不是"本来就没有音频"——
    // 静默跳过会让用户以为卡住了,提示一次让用户知道去看文字。
    // 2026-07-09 补:免提通话时用户根本不看屏幕,光加文字提示等于没提示——
    // 真实事故复盘过一次(intertrade-bot 任务派发确认那句被 TTS 429 限流吞掉,
    // 用户体感像 AI 中途掉线),这里加一声可听见的提示音兜底。
    playTtsFailTone();
    if(ttsFailureNoticedThisTurn) return;
    ttsFailureNoticedThisTurn = true;
    addMsg("ai", "⚠ 有一句没能读出来,内容已经显示在文字里了");
  }

  async function pumpPlayback(){
    if(playing || playQueue.length === 0 || pausedForInterrupt) return;
    const item = playQueue.shift();
    if(!item.audio_b64){ noticeTtsFailure(); pumpPlayback(); return; }
    playing = true;
    setStatus("工作中…", "playing");
    try{
      if(audioCtx.state === "suspended") await audioCtx.resume();
      const audioBuffer = await audioCtx.decodeAudioData(base64ToArrayBuffer(item.audio_b64));
      await new Promise((resolve, reject)=>{
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        if(outputAnalyser) source.connect(outputAnalyser);
        currentSource = source;
        source.onended = ()=>{ resolve(); };
        try{ source.start(0); }catch(e){ reject(e); }
      });
    }catch(e){ /* 解码/播放失败就跳过这句,不卡住队列 */ }
    currentSource = null;
    playing = false;
    pumpPlayback();
  }

  stopBtn.addEventListener("click", ()=>{
    playQueue = [];
    if(currentSource){ try{ currentSource.onended = null; currentSource.stop(); }catch(e){} currentSource = null; }
    playing = false;
    fetch("/voice/stop", {method:"POST", headers:{"X-Auth-Token":S.token}}).catch(()=>{});
  });

  function authError(){
    addMsg("ai error", "口令失效,请回主界面重新登录");
    showLogin();
  }

  // ── P1 任务板:抽屉列表 + 完成播报(WHEN_IDLE:等空闲/不在录音才插播,F8/F10) ──────
  const STATUS_WORD = {queued:"排队中", running:"进行中", done:"已完成", failed:"失败", cancelled:"已取消"};

  async function loadTasks(){
    try{
      const resp = await fetch("/voice/tasks", {headers:{"X-Auth-Token":S.token}});
      if(!resp.ok) return;
      const rows = await resp.json();
      renderTasks(rows);
      // 顺带全量校准状态条(SSE 断线漏事件时,打开抽屉/task_done 刷新都会走到这里兜底)
      activeTasks.clear();
      for(const t of rows) if(t.status === "queued" || t.status === "running") activeTasks.set(t.id, t);
      renderTaskBar();
    }catch(e){}
  }

  // ── 任务状态条:排队/进行中任务常驻顶栏下方,派发瞬间出现(SSE task_update),
  //    全部结束自动收起;点击等同打开任务抽屉看详情 ─────────────────────────────
  const activeTasks = new Map();  // id -> 任务行,只留 queued/running

  function upsertTaskBar(t){
    if(t.status === "queued" || t.status === "running") activeTasks.set(t.id, t);
    else activeTasks.delete(t.id);
    renderTaskBar();
  }

  function renderTaskBar(){
    const rows = [...activeTasks.values()].sort((a,b)=>a.created_at - b.created_at);
    taskBar.hidden = !rows.length;
    taskBar.innerHTML = rows.map(t=>
      `<div class="taskbar-row"><span class="dot ${t.status}"></span>` +
      `<span class="t">${esc(t.title)}</span>` +
      `<span class="n">${esc(t.status === "running" ? (t.progress_note || "进行中") : "排队中")}</span></div>`
    ).join("");
  }

  taskBar.addEventListener("click", ()=>{ tasksDrawer.classList.add("open"); loadTasks(); });

  function renderTasks(rows){
    tasksList.innerHTML = "";
    if(!rows.length){ tasksList.innerHTML = '<div class="task-empty">还没有任务</div>'; return; }
    for(const t of rows){
      const active = t.status === "queued" || t.status === "running";
      const rowEl = document.createElement("div");
      rowEl.className = "task";
      rowEl.innerHTML =
        `<div class="row"><span class="dot ${t.status}"></span>` +
        `<span class="title">${esc(t.title)}</span><span>${STATUS_WORD[t.status] || t.status}</span>` +
        (active ? '<button class="stop">停止</button>' : "") + `</div>` +
        `<div class="note">${esc(t.status === "running" ? t.progress_note : (t.result_summary || ""))}</div>` +
        `<div class="full">${esc(t.result_full || "")}</div>`;
      rowEl.querySelector(".row").addEventListener("click", (e)=>{
        if(e.target.closest(".stop")) return;
        rowEl.querySelector(".full").classList.toggle("open");
      });
      const stopEl = rowEl.querySelector(".stop");
      if(stopEl) stopEl.addEventListener("click", async (e)=>{
        e.stopPropagation();
        await fetch(`/voice/tasks/${t.id}/stop`, {method:"POST", headers:{"X-Auth-Token":S.token}});
        loadTasks();
      });
      tasksList.appendChild(rowEl);
    }
  }

  tasksBtn.addEventListener("click", ()=>{ tasksBadge.classList.remove("on"); tasksDrawer.classList.add("open"); loadTasks(); });
  tasksDrawer.addEventListener("click", e=>{ if(e.target === tasksDrawer) tasksDrawer.classList.remove("open"); });

  function flushAnnouncements(){
    if(busy || (recorder && recorder.state === "recording") || (handsFreeActive && wsState !== "idle")) return;
    let queuedForOmni = false;
    while(pendingAnnouncements.length){
      const data = pendingAnnouncements.shift();
      addMsg("ai", data.announce_text);
      if(omniDc && omniDc.readyState === "open"){
        // Omni 出声模式:播报交给 Omni 念——跟对话同一把声音、同一条 RTC 链路,
        // 服务端回声消除拿得到参考信号;不再走旧 TTS 的 Web Audio 播放
        // (两套声音并存=语气割裂+自回声风险,2026-07-10 定案)。
        omniReadQueue.push(data.announce_text);
        queuedForOmni = true;
      } else if(audioCtx && data.audio_b64){ playQueue.push({seq:-1, audio_b64: data.audio_b64}); pumpPlayback(); }
    }
    if(queuedForOmni) pumpOmniRead();
  }

  // ── 通话状态字/声波球/提示音(免提 Omni 与按住说话共用)─────────────────────
  const STATE_WORD = {idle:"空闲", capturing:"聆听中…", thinking:"思考中…", speaking:"工作中…"};
  const STATE_CLASS = {capturing:"listening", thinking:"thinking", speaking:"playing"};

  function vadCapable(){
    return typeof AudioWorkletNode !== "undefined";
  }

  let analyser=null, analyserSource=null, outputAnalyser=null, omniOutTap=null, orbCanvasCtx=null, orbAnimHandle=null;
  let orbLevels=null;  // 各柱子的平滑幅度,跨帧保留做指数平滑,消除原始频谱数据的跳变感

  function ensureAnalyser(){
    if(analyser || !audioCtx || !stream) return;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyserSource = audioCtx.createMediaStreamSource(stream);
    analyserSource.connect(analyser);
  }

  // 输出侧(TTS 播放)也接一个 analyser,这样"speaking"状态的声纹是真实跟着
  // AI 语音波动的,不是瞎动的假动画——不需要再往下连到 destination,
  // AnalyserNode 只要接了输入就会处理,这点跟上面 ensureAnalyser() 的麦克风分支一致。
  function ensureOutputAnalyser(){
    if(outputAnalyser || !audioCtx) return;
    outputAnalyser = audioCtx.createAnalyser();
    outputAnalyser.fftSize = 64;
  }

  const WAVE_BARS = 56;  // 一排竖条,绕水平中线上下镜像成一条声波

  // 波形配色跟随主题(从 :root 读 accent 系列),缓存起来、每隔若干帧刷新一次,
  // 这样切换浅/深色主题时颜色也会跟上,又不必每帧都 getComputedStyle。
  let waveColors=null, waveColorTick=0;
  function waveColorFor(state){
    if(!waveColors || (waveColorTick++ % 30)===0){
      const cs=getComputedStyle(document.documentElement);
      waveColors={
        accent:cs.getPropertyValue("--accent").trim(),
        accent2:cs.getPropertyValue("--accent2").trim(),
        err:cs.getPropertyValue("--err").trim(),
        dim:cs.getPropertyValue("--dim2").trim(),
      };
    }
    if(state==="capturing") return [waveColors.err, waveColors.accent];
    if(state==="speaking")  return [waveColors.accent2, waveColors.accent];
    if(state==="thinking")  return [waveColors.accent, waveColors.accent2];
    return [waveColors.dim, waveColors.dim];  // idle
  }

  // ═══ 声波动效 v3:「经典波形·精修」(WebGL)═════════════════════════════
  // 保留旧版柱状频谱的骨架(56→44 柱、钟形包络、各状态动律公式),升级三件事:
  //   1. 配色:品牌橙锚点的 IQ 虹彩调色板沿柱阵流动,垂直光泽渐变+顶端提亮;
  //      空闲=暖灰微澜,连接中整体压成灰调+灰白微光扫过(与活跃状态强区分);
  //   2. 过渡:状态权重(orbW)指数缓动 + 着色器内"涟漪式接力"——中心柱先变、
  //      边缘柱延迟,切状态像一阵涟漪从中间荡开,无硬切;
  //   3. 聆听:真实麦克风频谱驱动柱高,一道闪光沿柱阵恒速滑行(亮度随音量,
  //      速度恒定——速度若随音量实时变会造成相位跳变=抽搐)。
  // 频谱统一走一张 32x1 亮度纹理:聆听喂真实频谱、其余喂合成节奏,过渡期两边
  // 数据在同一张纹理上自然衔接。WebGL 起不来(老设备/编译失败)时回落旧版
  // Canvas 2D 竖条(drawOrbWaveform2D),canvas 原地换新保证 2d 可用。
  const ORB_BANDS = 32;
  let orbGl=null, orbGlU=null, orbGlFailed=false, orbSpecTex=null;
  let orbBands=null, orbBandBytes=null, orbLevelAvg=0, orbPrevT=0;
  let orbConnecting=false;  // startOmniHandsFree 置起,SDP 应答落地/挂断清掉
  const orbW = {idle:1, conn:0, listen:0, think:0, speak:0};

  const ORB_VERT = "attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }";
  const ORB_FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform float uTime;
uniform float uIdle, uConn, uListen, uThink, uSpeak;
uniform float uLevel;   // 平滑后的总能量 0..1
uniform float uDark;    // 深色主题=1:柱子是"光";浅色主题=0:柱子是"颜料"
uniform sampler2D uSpec;

// 频谱采样:与旧版柱状映射一致,x=0..1 从低频到高频
float spec(float x){ return texture2D(uSpec, vec2(clamp(x, 0.0, 1.0), 0.5)).r; }
// 虹彩调色板:6 个手工色标循环渐变(珊瑚橙→金→玫瑰→紫→青→奶油),
// 相邻色标的中点过渡色均人工验过不发灰——余弦色环会周期性扫过橄榄/芥末段,显脏,弃用
vec3 pal(float h){
  float x = fract(h) * 6.0;
  vec3 c0 = vec3(1.00, .55, .30), c1 = vec3(1.00, .78, .44), c2 = vec3(.96, .52, .70);
  vec3 c3 = vec3(.58, .50, 1.00), c4 = vec3(.34, .78, .92), c5 = vec3(1.00, .87, .64);
  vec3 col = mix(c0, c1, clamp(x, 0., 1.));
  col = mix(col, c2, clamp(x - 1., 0., 1.));
  col = mix(col, c3, clamp(x - 2., 0., 1.));
  col = mix(col, c4, clamp(x - 3., 0., 1.));
  col = mix(col, c5, clamp(x - 4., 0., 1.));
  return mix(col, c0, clamp(x - 5., 0., 1.));
}

void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float t = uTime;
  float lv = uLevel;
  vec3 col = vec3(0.0);
  float N = 44.0;
  float halfW = uRes.x / uRes.y * 0.5;
  float u = clamp(p.x / (2.0 * halfW) + 0.5, 0.0, 1.0);
  float bi = floor(u * N);
  float bu = fract(u * N);
  float cx = (bi + 0.5) / N;
  float envB = sin(3.14159 * cx);       // 钟形包络:中间高两端低(沿用旧版)
  float fi = bi;
  // 波纹式接力过渡:中心柱先响应状态变化,边缘柱延迟——切换像涟漪荡开
  float dly = abs(cx - 0.5) * 2.0;
  float wI = clamp(uIdle   * 1.6 - dly * 0.6, 0.0, 1.0);
  float wC = clamp(uConn   * 1.6 - dly * 0.6, 0.0, 1.0);
  float wL = clamp(uListen * 1.6 - dly * 0.6, 0.0, 1.0);
  float wT = clamp(uThink  * 1.6 - dly * 0.6, 0.0, 1.0);
  float wS = clamp(uSpeak  * 1.6 - dly * 0.6, 0.0, 1.0);
  float wSum = max(wI + wC + wL + wT + wS, 0.35);
  // 各状态柱高:公式沿用旧版,聆听/播放接频谱纹理(真实或合成,由 JS 侧决定)
  float hI = 0.06 + 0.05 * sin(t * 1.4 + fi * 0.5);
  float hC = 0.045 + 0.025 * sin(t * 1.1 + fi * 0.35);
  float hL = 0.08 + spec(cx) * 0.75 * (0.6 + lv * 0.5);
  float hT = 0.30 + 0.20 * sin(t * 3.0 - fi * 0.35);
  float hS = 0.15 + spec(cx) * 0.60 * (0.7 + lv * 0.4);
  float h = ((wI * hI + wC * hC + wL * hL + wT * hT + wS * hS) / wSum) * envB;
  float H = max(h * 0.46, 0.012);
  float actW = min(1.0, (wL + wT + wS) / wSum);   // 接力后的活跃度(配色同样带涟漪)
  float connW = wC / wSum;
  // 圆润竖条
  float bx = abs(bu - 0.5);
  float mask = smoothstep(0.36, 0.26, bx) * smoothstep(H, H * 0.86, abs(p.y));
  // 配色:沿宽度的虹彩流动 + 状态定调(连接=灰,空闲=暖灰)
  float hue = cx * 0.30 + t * 0.02 + uThink * (cx * 0.2 + t * 0.05) + uSpeak * 0.03 * sin(t * 1.5);
  vec3 bar = pal(hue);
  bar = mix(pow(bar, vec3(1.6)) * 1.05, bar, uDark);   // 浅色主题:gamma 加深成"颜料",防粉笔灰
  float satF = mix(0.35, 0.22, uDark);
  float satv = (satF + (1.0 - satF) * actW) * (1.0 - 0.88 * connW);
  vec3 gray = vec3(dot(bar, vec3(.333))) * mix(vec3(1.0, .95, .88), vec3(1.0), uDark);
  bar = mix(gray, bar, clamp(satv, 0.0, 1.0));
  // 垂直光泽渐变(上亮下沉) + 顶端提亮
  float vg = 0.72 + 0.34 * smoothstep(-H, H, p.y);
  float tip = smoothstep(H * 0.72, H * 0.98, abs(p.y)) * 0.35;
  float bright = 0.55 + 0.45 * ((wL * (0.5 + lv * 0.9) + wS * 0.75 + wT * 0.6 + wC * 0.25 + wI * 0.15) / wSum);
  col += bar * mask * (vg + tip) * bright;
  // 柱后柔光(仅深色主题,克制)
  col += bar * envB * exp(-abs(p.y) / (H * 1.8 + 0.02)) * smoothstep(0.36, 0.30, bx) * 0.16 * uDark * actW;
  // 连接中:灰白微光扫过柱阵
  if(uConn > 0.003){
    float cxs = fract(t * 0.30) * 2.8 - 1.4;
    col += vec3(.82, .81, .78) * exp(-(p.x - cxs) * (p.x - cxs) * 10.0) * mask * 0.5 * uConn;
  }
  // 聆听:闪光沿柱阵恒速滑行,亮度随声音(速度恒定,避免相位跳变)
  if(uListen > 0.003){
    float gx = fract(t * 0.5) * 2.1 * halfW - 1.05 * halfW;
    float glint = exp(-(p.x - gx) * (p.x - gx) * 24.0);
    col += vec3(1.0, .97, .92) * glint * mask * uListen * (0.35 + lv * 0.9);
  }
  // 输出预乘 alpha:深色主题下是"光"(alpha 松),浅色主题下是"颜料"(alpha 实+掐低强度尾巴)
  float aOut = clamp(max(col.r, max(col.g, col.b)) * 1.1, 0.0, 1.0);
  aOut = pow(aOut, mix(1.35, 0.9, uDark));
  float cut = (1.0 - uDark) * 0.10;
  aOut = clamp((aOut - cut) / (1.0 - cut), 0.0, 1.0);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * aOut, aOut);
}`;

  function orbCompile(gl, type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      vdbg("orb.glsl.fail", String(gl.getShaderInfoLog(sh)).slice(0, 160));
      return null;
    }
    return sh;
  }

  function initOrbGL(canvas){
    let gl = null;
    try{
      gl = canvas.getContext("webgl",
        {alpha:true, premultipliedAlpha:true, antialias:false, depth:false, stencil:false});
    }catch(e){}
    if(!gl){ orbGlFailed = true; return; }
    const vs = orbCompile(gl, gl.VERTEX_SHADER, ORB_VERT);
    const fs = orbCompile(gl, gl.FRAGMENT_SHADER, ORB_FRAG);
    let prog = null, ok = false;
    if(vs && fs){
      prog = gl.createProgram();
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      ok = gl.getProgramParameter(prog, gl.LINK_STATUS);
    }
    if(!ok){
      // 编译/链接失败:canvas 已被 webgl 上下文占住、拿不回 2d,
      // 原地换一个同属性的新 canvas 给 2D 兜底用
      orbGlFailed = true;
      canvas.replaceWith(canvas.cloneNode(false));
      return;
    }
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "aPos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    orbSpecTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, orbSpecTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, ORB_BANDS, 1, 0,
      gl.LUMINANCE, gl.UNSIGNED_BYTE, new Uint8Array(ORB_BANDS));
    gl.viewport(0, 0, canvas.width, canvas.height);
    const U = {};
    ["uRes","uTime","uIdle","uConn","uListen","uThink","uSpeak","uLevel","uDark",
     "uAccent","uAccent2","uErr","uDim","uSpec"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1i(U.uSpec, 0);
    orbGl = gl; orbGlU = U;
  }

  // 主题色解析成 GLSL vec3(跟 waveColorFor 同样的缓存节奏,主题切换能跟上)
  let orbTheme=null, orbThemeTick=0;
  function orbHexVec(s, fb){
    const m = /^#([0-9a-f]{6})$/i.exec(s || "");
    if(!m) return fb;
    const n = parseInt(m[1], 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  }
  function orbThemeVecs(){
    if(!orbTheme || (orbThemeTick++ % 60) === 0){
      const cs = getComputedStyle(document.documentElement);
      const v = n => cs.getPropertyValue(n).trim();
      const bg = orbHexVec(v("--bg2"), [0.1, 0.1, 0.1]);
      orbTheme = {
        accent:  orbHexVec(v("--accent"),  [0.85, 0.47, 0.34]),
        accent2: orbHexVec(v("--accent2"), [0.78, 0.38, 0.25]),
        err:     orbHexVec(v("--err"),     [0.82, 0.40, 0.29]),
        dim:     orbHexVec(v("--dim2"),    [0.44, 0.43, 0.38]),
        dark: (0.2126 * bg[0] + 0.7152 * bg[1] + 0.0722 * bg[2]) < 0.5 ? 1 : 0,
      };
    }
    return orbTheme;
  }

  function drawOrbWaveform(){
    orbAnimHandle = requestAnimationFrame(drawOrbWaveform);
    const canvas = $("#orbCanvas");
    if(!orbGl && !orbGlFailed) initOrbGL(canvas);
    if(orbGlFailed){ drawOrbWaveform2D(); return; }
    const gl = orbGl, U = orbGlU;
    const t = (performance.now() / 1000) % 3600;  // 卷回避免 mediump 精度流失
    let dt = t - orbPrevT; orbPrevT = t;
    if(dt <= 0 || dt > 0.1) dt = 0.016;  // 首帧/切后台回来,别让权重一步跳完

    // 形态权重:指数缓动逼近目标(时间常数≈0.35s,配合着色器内涟漪接力),切状态=权重滑移而非硬切
    const tgt = orbConnecting ? "conn"
      : wsState === "capturing" ? "listen"
      : wsState === "thinking"  ? "think"
      : wsState === "speaking"  ? "speak" : "idle";
    const k = 1 - Math.exp(-dt * 2.8);
    for(const s in orbW) orbW[s] += ((s === tgt ? 1 : 0) - orbW[s]) * k;

    // 频谱纹理:聆听喂真实麦克风频谱;播放接得上本地 TTS analyser 就用真的,
    // Omni 出声(WebRTC 远端轨道,iOS 上进不了 Web Audio)喂合成节奏;其余喂微息
    if(!orbBands){ orbBands = new Float32Array(ORB_BANDS); orbBandBytes = new Uint8Array(ORB_BANDS); }
    let src = null;
    if(wsState === "capturing") src = analyser;
    else if(wsState === "speaking") src = outputAnalyser;
    let data = null;
    if(src){ data = new Uint8Array(src.frequencyBinCount); src.getByteFrequencyData(data); }
    let sum = 0;
    for(let i = 0; i < ORB_BANDS; i++){
      let target;
      if(data){
        target = data[Math.floor(i / ORB_BANDS * data.length)] / 255;
      } else if(wsState === "thinking"){
        target = 0.30 + 0.20 * Math.sin(t * 3 - i * 0.6);
      } else if(wsState === "speaking"){
        target = 0.35 + 0.25 * Math.sin(t * 6 - i * 0.9) * Math.abs(Math.sin(t * 1.7 + i * 0.23));
      } else {
        target = 0.06 + 0.05 * Math.sin(t * 1.4 + i * 0.9);
      }
      orbBands[i] += (target - orbBands[i]) * 0.28;  // 指数平滑,吃掉原始数据的跳变
      orbBandBytes[i] = Math.max(0, Math.min(255, orbBands[i] * 255));
      sum += orbBands[i];
    }
    orbLevelAvg += (sum / ORB_BANDS - orbLevelAvg) * 0.15;

    const th = orbThemeVecs();
    gl.bindTexture(gl.TEXTURE_2D, orbSpecTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, ORB_BANDS, 1, gl.LUMINANCE, gl.UNSIGNED_BYTE, orbBandBytes);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uIdle, orbW.idle);
    gl.uniform1f(U.uConn, orbW.conn);
    gl.uniform1f(U.uListen, orbW.listen);
    gl.uniform1f(U.uThink, orbW.think);
    gl.uniform1f(U.uSpeak, orbW.speak);
    gl.uniform1f(U.uLevel, Math.min(1, orbLevelAvg * 1.6));
    gl.uniform1f(U.uDark, th.dark);
    gl.uniform3fv(U.uAccent, th.accent);
    gl.uniform3fv(U.uAccent2, th.accent2);
    gl.uniform3fv(U.uErr, th.err);
    gl.uniform3fv(U.uDim, th.dim);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ── 2D 兜底:老版竖条声波,WebGL 不可用时由 drawOrbWaveform 每帧转调 ──
  function drawOrbWaveform2D(){
    const canvas = $("#orbCanvas");
    if(!orbCanvasCtx) orbCanvasCtx = canvas.getContext("2d");
    if(!orbCanvasCtx) return;
    const ctx = orbCanvasCtx;
    const w = canvas.width, h = canvas.height, cy = h/2;
    ctx.clearRect(0, 0, w, h);
    if(!orbLevels) orbLevels = new Float32Array(WAVE_BARS);

    let src = null;
    if(wsState === "capturing") src = analyser;
    else if(wsState === "speaking") src = outputAnalyser;
    let data = null;
    if(src){ data = new Uint8Array(src.frequencyBinCount); src.getByteFrequencyData(data); }

    const t = performance.now() / 1000;
    const [c1, c2] = waveColorFor(wsState);
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, c1); grad.addColorStop(0.5, c2); grad.addColorStop(1, c1);
    ctx.strokeStyle = grad;
    ctx.lineCap = "round";

    const gap = w / WAVE_BARS;
    const barW = Math.max(3, gap * 0.42);
    ctx.lineWidth = barW;
    const maxH = h * 0.42;
    for(let i=0;i<WAVE_BARS;i++){
      // 钟形包络:中间高、两头收,让整条波像真实声纹而不是齐平的方块阵
      const env = Math.sin((i / (WAVE_BARS - 1)) * Math.PI);
      let target;
      if(data){
        target = data[Math.floor(i / WAVE_BARS * data.length)] / 255;
      } else if(wsState === "thinking"){
        target = 0.30 + 0.20 * Math.sin(t * 3 - i * 0.35);
      } else if(wsState === "speaking"){
        target = 0.35 + 0.22 * Math.sin(t * 6 - i * 0.5) * Math.abs(Math.sin(t * 1.7 + i * 0.13));
      } else {
        target = 0.06 + 0.05 * Math.sin(t * 1.4 + i * 0.5);  // idle 微起伏
      }
      orbLevels[i] += (target - orbLevels[i]) * 0.28;
      const amp = orbLevels[i] * env;
      const half = Math.max(barW * 0.5, amp * maxH);
      const x = gap * (i + 0.5);
      ctx.beginPath();
      ctx.moveTo(x, cy - half + barW * 0.5);
      ctx.lineTo(x, cy + half - barW * 0.5);
      ctx.stroke();
    }
  }

  function playTone(freq, durMs, shape, vol){
    if(!audioCtx) return;
    // iOS 在通话(WebRTC)期间会把 AudioContext 挂起,挂起后 createOscillator
    // 等 API 静默成功但不出声——先恢复再播放,如 resume 失败则跳过本次音效
    // (2026-07-14 真机:所有音效全消失,根因在此)。
    if(audioCtx.state !== "running"){ try{ audioCtx.resume(); }catch(e){} return; }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = shape || "sine";
    osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    const dur = durMs / 1000;
    gain.gain.setValueAtTime(0, now);
    const v = vol != null ? vol : 0.15;
    gain.gain.linearRampToValueAtTime(v, now + Math.min(0.005, dur/4));
    gain.gain.linearRampToValueAtTime(0, now + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }
  function playCapturingTone(){ playTone(880, 80, "sine"); }
  function playSpeakingTone(){ playTone(660, 90, "sine"); }  // 单音节,原来的双音(660→990)高音太刺耳
  function playTtsFailTone(){ playTone(300, 140, "square"); }  // 免提通话听不到文字提示,得有声音信号
  // 断线/重连提示音:通话静默重连过去用户毫无感知,只能靠"hello hello 能听到吗"
  // 人肉探活(2026-07-10 真机一晚三次)。降调=掉线了,升调=接回来了。
  function playDisconnectTone(){ playTone(520, 110, "sine"); setTimeout(()=>playTone(330, 150, "sine"), 120); }
  function playReconnectTone(){ playTone(330, 110, "sine"); setTimeout(()=>playTone(660, 150, "sine"), 120); }
  // 首次拨打提示音:点击通话按钮、进入"连接中…"那一刻响一声,让用户确认点击生效、
  // 系统正在建连——跟下面的"接通音"用同一单音风格但音高不同,一耳朵能分辨两个阶段。
  function playDialConnectingTone(){ playTone(600, 90, "sine", 0.13); }
  function playDialConnectedTone(){ playTone(880, 100, "sine", 0.13); }
  // 发送音效:用户语音转写完成、提交给 Claude 时轻短"咻"一声(高音短促,低音量)
  function playSendTone(){ playTone(1350, 70, "sine", 0.15); }
  // AI 思考音效:提交后等待回复时循环响,音色跟"工作中"(playSpeakingTone)统一,
  // 用户听感上只分"在等/说完了"两种状态,不用再区分"思考"和"工作"两种音色。
  let thinkingToneTimer = null;
  function playThinkingTone(){
    stopThinkingTone();
    const beep = () => { if(!audioCtx) return; playSpeakingTone(); };
    beep();
    thinkingToneTimer = setInterval(beep, 1200);
  }
  function stopThinkingTone(){
    if(thinkingToneTimer){ clearInterval(thinkingToneTimer); thinkingToneTimer = null; }
  }

  async function startHandsFree(){
    vdbg("handsfree.start", {omni: S.omniEnabled, fn: typeof startOmniHandsFree});
    // 返回值必须透传给按钮模式的点击处理器:吞掉返回值会让调用方永远拿到
    // undefined,连接明明成功也被当失败处理(2026-07-15 踩坑)。
    if(S.omniEnabled){ return await startOmniHandsFree(); }
    // P2 WS 免提链路已下线(/voice/ws 路由已摘,见 docs/adr/0004):走到这里说明
    // Omni 配置没取到(登录预取失败)或 VOICE_OMNI_ENABLED=0——不能再连 WS
    // (只会 404 →1.5s 重连死循环+断线音),直接回落按住说话,跟"免提启动失败"
    // 同一姿态。
    handsFreeUi.hidden = true;
    talkBtn.hidden = false;
    addMsg("ai error", "免提通话需要 Omni 模式(检查 VOICE_OMNI_ENABLED / 网络),已切换到按住说话");
    return false;
  }

  function manualInterrupt(){
    stopThinkingTone();
    if(currentSource){ try{ currentSource.onended = null; currentSource.stop(); }catch(e){} currentSource = null; }
    playQueue = [];
    playing = false;
    pausedForInterrupt = false;
    // Omni 出声模式:点声纹球打断=取消 Omni 正在念/排队要念的内容 + 作废在飞的 Claude 流
    if(omniDc){
      omniTurnGen++;
      cancelOmniReading("manual");
      omniTurnDone = true;

  function connectTaskStream(){
    const es = new EventSource("/voice/tasks/stream?token=" + encodeURIComponent(S.token));
    es.addEventListener("task_update", e=>{
      const t=JSON.parse(e.data);
      upsertTaskBar(t);  // 派发/起跑/进度变化 → 状态条实时刷新
      syncSidebarTaskStatus(t);  // 侧边栏默认项目任务行的进行中圆点同步亮/灭
    });
    es.addEventListener("task_done", e=>{

      loadTasks();
