  // ── 屏幕常亮(Screen Wake Lock):免提通话时用户不碰屏幕,iOS 自动锁屏会把
  // PWA 冻结、麦克风和 WebRTC 一起断掉,只能手动点亮再等重连——所以进通话视图
  // 就申请常亮锁,挂断/切走时释放。锁在页面切后台时会被系统自动收回(规范行为),
  // 回到前台得重新申请,靠下面的 visibilitychange 补。
  // 兼容性:iOS 16.4+ 支持该 API,但"加到主屏幕"的 PWA 里有 WebKit bug
  // (bugs.webkit.org/254545:request 成功 resolve 但屏幕照样熄),iOS 18.4 才修好。
  // 失败/不生效无法从 JS 侧检测,只能靠 vdbg 上报 + 真机验证;若真机仍熄屏,
  // 下一步再上 NoSleep 式静音循环视频兜底,这里先走干净的标准路径。
  let wakeLockSentinel = null;
  async function acquireWakeLock(){
    if(!("wakeLock" in navigator)){ vdbg("wakelock.unsupported"); return; }
    if(wakeLockSentinel) return;  // 已持有(release 事件会把它清回 null,不会泄漏)
    try{
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      wakeLockSentinel.addEventListener("release", ()=>{ wakeLockSentinel = null; });
      vdbg("wakelock.acquired");
    }catch(e){ wakeLockSentinel = null; vdbg("wakelock.fail", String(e)); }
  }
  function releaseWakeLock(){
    if(!wakeLockSentinel) return;
    try{ wakeLockSentinel.release(); }catch(e){}
    wakeLockSentinel = null;
  }
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden) return;
    if(!$("#callView").hidden) acquireWakeLock();
    // 切回前台时可能刚经历过电话打断/蓝牙断开:怀疑麦克风有问题
    if(handsFreeActive) suspectMicProblem("vischange");
  });

  // ── 视图切换入口(供侧边栏"语音任务"主行 + #voiceChatBtn 调用,见下方接线)──────
  // initOnce:原页面这些初始化(常驻任务播报订阅/拉历史/挑一次交互模式)靠整页
  // 加载天然只跑一次;现在同一个 DOM 可以反复进出通话视图,得自己拿个标记位挡住
  // 重复跑——尤其 connectTaskStream() 重跑会攒出好几条重复的 EventSource。
  let initialized = false;
  function initOnce(){
    if(initialized) return;
    initialized = true;

  // 导航卸载页面顺带回收这些资源,现在视图常驻 DOM 不会自动卸载,不手动收就是
  // 麦克风一直"热着"、WS 一直连着,电量和隐私都不划算。
  function teardownCallResources(){
    setOmniConnStatus("disconnected");
    releaseWakeLock();  // 挂断就不需要屏幕常亮了,让系统恢复正常锁屏节能
    stopWorkSound();    // 工作音效跟着通话走,挂断即停(audioCtx 也会在下面 close)
    handsFreeActive = false;  // 先立 flag:让 scheduleOmniReconnect 的回调知道用户已挂断
    if(omniReconnectTimer){ clearTimeout(omniReconnectTimer); omniReconnectTimer = null; }
    stopOmniHandsFree();
    if(currentSource){ try{ currentSource.onended = null; currentSource.stop(); }catch(e){} currentSource = null; }
    playQueue = []; playing = false; pausedForInterrupt = false;
    if(recorder && recorder.state === "recording"){ try{ recorder.stop(); }catch(e){} }
    recorder = null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    if(orbAnimHandle){ cancelAnimationFrame(orbAnimHandle); orbAnimHandle = null; }
    orbCanvasCtx = null; analyser = null; analyserSource = null; outputAnalyser = null; omniOutTap = null; orbLevels = null;
    // 声波球回到干净的空闲态,下次通话不带上一通的残余权重(GL 上下文本身留着复用)
    orbConnecting = false; orbLevelAvg = 0;
    orbW.idle = 1; orbW.conn = orbW.listen = orbW.think = orbW.speak = 0;
    if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }
    handsFreeActive = false; micMuted = false; wsState = "idle";
    busy = false; talkBtn.disabled = false; talkBtn.classList.remove("recording");
    stopBtn.hidden = true;
    orbWrap.className = "idle";
    muteToggleBtn.classList.remove("muted"); muteToggleBtn.title = "静音麦克风";
    setIcon(muteToggleBtn, "mic");
    tasksDrawer.classList.remove("open");
    startBtn.hidden = true;
    startBtn.disabled = false;
    buttonMode = false;
    setStatus("空闲");
  }

  window.openCallView = function(){
    closeSidebar();
    $("#chatMain").hidden = true;
    $("#callView").hidden = false;
    acquireWakeLock();
    initOnce();
    // 按钮启动模式:不自动开始录音,显示"开始录音"按钮等待用户点击

  };

    $("#callView").hidden = true;

// ── Markdown 渲染(内置,不依赖 CDN)────────────────────────────────────────
function inlineMd(t){
  t = esc(t);
  const links=[];                                   // 先把 [文字](url) 抠出来占位,避免下面裸链接二次包裹
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,txt,url)=>{
    links.push('<a href="'+url+'" target="_blank" rel="noopener">'+txt+'</a>'); return "L"+(links.length-1)+""; });
  t = t.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/L(\d+)/g,(m,i)=>links[+i]);   // 还原 Markdown 链接
  return t;
}
function mdToHtml(src){
  src = (src||"").replace(/\r\n/g,"\n");
  const codes=[];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codes.push('<pre class="code"><code>'+esc(code.replace(/\n$/,""))+"</code></pre>");
    return " C"+(codes.length-1)+" ";
  });
  const L = src.split("\n"); let out=""; let i=0; let para=[];
  const flush=()=>{ if(para.length){ out+="<p>"+para.map(inlineMd).join("<br>")+"</p>"; para=[]; } };
  const sepRe=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?\s*$/;
  while(i<L.length){
    let ln=L[i];
    const cm=ln.match(/^ C(\d+) $/);
    if(cm){ flush(); out+=codes[+cm[1]]; i++; continue; }
    if(!ln.trim()){ flush(); i++; continue; }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ flush(); const n=m[1].length; out+="<h"+n+">"+inlineMd(m[2])+"</h"+n+">"; i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ flush(); out+="<hr>"; i++; continue; }
    // 表格
    if(ln.includes("|") && i+1<L.length && sepRe.test(L[i+1])){
      flush();
      const cells=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const head=cells(ln); i+=2; const rows=[];
      while(i<L.length && L[i].includes("|") && L[i].trim()){ rows.push(cells(L[i])); i++; }
      let t="<table><thead><tr>"+head.map(h=>"<th>"+inlineMd(h)+"</th>").join("")+"</tr></thead><tbody>";
      for(const r of rows){ t+="<tr>"+head.map((_,k)=>"<td>"+inlineMd(r[k]||"")+"</td>").join("")+"</tr>"; }
      out+=t+"</tbody></table>"; continue;
    }
    if(m=ln.match(/^\s*>\s?(.*)$/)){ flush(); const q=[]; while(i<L.length&&(m=L[i].match(/^\s*>\s?(.*)$/))){ q.push(m[1]); i++; } out+="<blockquote>"+q.map(inlineMd).join("<br>")+"</blockquote>"; continue; }
    if(/^\s*[-*+]\s+/.test(ln)){ flush(); let h="<ul>"; while(i<L.length&&(m=L[i].match(/^\s*[-*+]\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ul>"; continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ flush(); let h="<ol>"; while(i<L.length&&(m=L[i].match(/^\s*\d+\.\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ol>"; continue; }
    para.push(ln); i++;
  }
  flush();
  return out;
}

// ── 侧栏底部:限额 / 错误状态 ────────────────────────────────────────────
// 从限额报错串里抠出「额度恢复时间」→ 毫秒时间戳,拿不到返回 0。
// 订阅版限额报错常见格式:"Claude AI usage limit reached|1720000000"(竖线后是 unix 秒)。
// 兜底再认 retry-after / "try again in Ns" 这类相对秒数。
function parseRateReset(err){
  if(!err) return 0;
  const s=String(err);
  let m=s.match(/usage limit reached\s*\|\s*(\d{10,13})/i) || s.match(/\|\s*(\d{10,13})\b/);
  if(m){ let n=+m[1]; if(n<1e12) n*=1000; return n; }  // 10 位是秒 → 补成毫秒
  m=s.match(/retry[-\s]?after["'\s:=]+(\d+)/i) || s.match(/try again in\s+(\d+)\s*s/i);
  if(m) return Date.now()+(+m[1])*1000;
  return 0;
}
// 把恢复时间戳格式化成「预计 14:30 恢复(还剩 46 分钟)」
function fmtReset(ts){
  if(!ts||ts<=Date.now()) return "";
  const hhmm=new Date(ts).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  const mins=Math.max(1, Math.round((ts-Date.now())/60000));
  const left=mins>=60 ? (Math.floor(mins/60)+" 小时 "+(mins%60)+" 分") : (mins+" 分钟");
  return "预计 "+hhmm+" 恢复(还剩 "+left+")";
}
function setRateStatus(level, msg, err){
  const reset = level==="warn" ? parseRateReset(err) : 0;
  S.rateStatus={level:level||"ok", msg:msg||"", lastErr:err||"", ts:Date.now(), resetTs:reset};
  updateSfoot();
}

function cmdMatches(prefix){
  const p=prefix.toLowerCase();

  const skills=S.skills.filter(c=>c.name.toLowerCase().startsWith(p)).map(c=>Object.assign({kind:"skill"},c));
  return cmds.concat(skills);

// 顶栏那颗 ⎇ 按钮:仅项目会话显示;点开弹层看改动 + 一键建分支
function gitBtnLabel(d){
  let s='⎇ '+esc(d.branch)+(d.dirty?' •'+d.dirty:'');
  if(d.added||d.removed){
    s+=' <span style="color:#3fb950">+'+d.added+'</span>'
      +' <span style="color:#f85149">-'+d.removed+'</span>';
  }
  return s;
}
async function refreshGit(conv){
  const btn=$("#convGit"); $("#gitPop").hidden=true;
  btn.hidden=false; btn.classList.remove("dirty"); btn.textContent="⎇ …";
  try{
    const r=await api("/conv/git?conv="+encodeURIComponent(conv)); const d=await r.json();
    if(S.conv!==conv) return;                                      // 期间切走了,丢弃结果
    S.git=d;
    if(!d.is_project){ btn.hidden=true; return; }
    if(!d.is_repo){ btn.textContent="⎇ 非 git 仓库"; return; }
    btn.innerHTML=gitBtnLabel(d); btn.classList.toggle("dirty", d.dirty>0);
  }catch(e){ btn.hidden=true; }
}
// 默认分支名:hermes/月日-时分,方便一次会话开一条隔离分支
function defaultBranchName(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return "hermes/"+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); }
function renderGitPop(){
  const d=S.git, pop=$("#gitPop");
  if(!d || !d.is_project){ pop.hidden=true; return; }
  if(!d.is_repo){ pop.innerHTML='<div class="gph"><span class="gbr">'+esc(d.name)+'</span></div>'+
    '<div class="gempty">该项目目录不是 git 仓库</div>'; return; }
  const ah=[]; if(d.ahead) ah.push("↑"+d.ahead); if(d.behind) ah.push("↓"+d.behind);
  const files = d.dirty
    ? '<div class="gfiles">'+d.files.map(f=>'<div class="gf"><span class="gx">'+esc((f.x||"").trim()||"?")+'</span><span class="gp">'+esc(f.path)+'</span></div>').join("")+'</div>'
    : '<div class="gclean">✓ 工作区干净</div>';
  pop.innerHTML=
    '<div class="gph"><span class="gbr">⎇ '+esc(d.branch)+'</span>'+(ah.length?'<span class="gah">'+ah.join(" ")+'</span>':'')+'</div>'+
    '<div class="gsub">'+esc(d.path)+'</div>'+

    '<div class="gnew"><input id="gitBrName" type="text" placeholder="新分支名" value="'+esc(defaultBranchName())+'"><button id="gitBrGo" type="button">新建并切换</button></div>'+
    '<div class="gerr" id="gitErr" hidden></div>';
  $("#gitBrGo").onclick=createGitBranch;
  $("#gitBrName").onkeydown=e=>{ if(e.key==="Enter") createGitBranch(); };
}
async function createGitBranch(){
  const name=$("#gitBrName").value.trim(), err=$("#gitErr"), btn=$("#gitBrGo");
  err.hidden=true;
  if(!name){ err.textContent="请填写分支名"; err.hidden=false; return; }
  btn.disabled=true; btn.textContent="创建中…";
  try{
    const r=await api("/conv/git/branch",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({conv:S.conv, name})});
    const d=await r.json();
    if(!r.ok){ err.textContent=d.error||"创建失败"; err.hidden=false; btn.disabled=false; btn.textContent="新建并切换"; return; }
    S.git=d; renderGitPop();                                       // 重绘:分支名已切到新分支
    const b=$("#convGit"); b.innerHTML=gitBtnLabel(d); b.classList.toggle("dirty", d.dirty>0);
  }catch(e){ err.textContent="网络错误"; err.hidden=false; btn.disabled=false; btn.textContent="新建并切换"; }
}

function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts*1000), n=new Date();

async function loadPrefs(){

    if(p.theme && ["light","dark"].includes(p.theme) && p.theme !== localStorage.getItem("hermes_theme")){
      document.documentElement.setAttribute("data-theme", p.theme);

// 用一份 /conversations 响应数据重建 S.convs(供 loadConvs() 与登录时的首次拉取共用,
// 登录那次不用再多打一次 /conversations)。
function applyConvs(d){
  const main = d.main; main.conv="main"; main.title="主会话"; main.pinned=true;
  // 新建但还没发出第一条消息的本地会话(conv=local-xxx)后端还不认识,不在返回列表里;
  // 合并时保留它,否则录音/转写等待期间只要有别的会话触发这次刷新,这条新会话就会被冲没
  const locals = S.convs.filter(c=>String(c.conv).startsWith("local-"));
  // 全部会话(含主会话)按最近活跃排序,最新的排最前面
  S.convs = [main, ...d.conversations, ...locals].sort((a,b)=>(b.last_ts||0)-(a.last_ts||0));
  renderConvs();   // 会话刷新后同步标题栏
}
async function loadConvs(){
  const r = await api("/conversations"); const d = await r.json();
  applyConvs(d);
}

// 作为普通条目参与分组的「最多展示 5 条」限制。
function buildVoiceTaskRows(inCall){
  const vs = S.voiceSidebar;
  if(!vs || !vs.main) return [];
  const rows=[];
  for(const t of vs.tasks){
    // 任务行跟普通会话行吃同一套归档筛选
    const arch=!!t.archived;
    if(S.convFilter==="archived"&&!arch)continue;
    if(S.convFilter==="active"&&arch)continue;
    const row=el("div","conv ingroup"+(!inCall && t.conv===S.conv?" active":""));
    row.dataset.conv=t.conv;
    const body=el("div","cvbody");
    const ct=el("div","ct"); ct.textContent=t.title||"新对话"; body.append(ct);
    const tm=fmtTime(t.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; body.append(tmEl); }
    const more=el("button","more"); more.textContent="⋯"; more.title="更多";
    more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,t.conv);}; body.append(more);
    row.append(body);
    const act=el("div","cvact");
    const archBtn=el("button","cvarch"); archBtn.innerHTML=ic("folder"); archBtn.title=arch?"取消归档":"归档";
    archBtn.onclick=ev=>{ ev.stopPropagation(); closeSwipe(row); toggleArchive(t.conv); };
    const del=el("button","cvdel"); del.innerHTML=ic("trash"); del.title="删除";
    del.onclick=ev=>{ ev.stopPropagation(); closeSwipe(row); delConv(t.conv); };
    act.append(archBtn,del); row.append(act);
    bindSwipe(row, body, act);
    if(t.conv===S.swipedConv) row.classList.add("swiped");
    row.onclick=()=>{
      if(row._justSwiped){ row._justSwiped=false; return; }
      if(row.classList.contains("swiped")){ closeSwipe(row); return; }
      openConv(t.conv);
    };
    rows.push(row);
  }
  return rows;
}

function buildConvRow(c, inCall){
  const e=el("div","conv ingroup"+(!inCall && c.conv===S.conv?" active":"")+(c.pinned?" pinned":""));
  e.dataset.conv=c.conv;

  if(c.pinned){ const star=el("span","star"); star.textContent="★"; body.append(star); }   // 主会话:右侧弱化星标
  else { const more=el("button","more"); more.textContent="⋯"; more.title="更多"; more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,c.conv);}; body.append(more); }
  e.append(body);
  if(!c.pinned){
    const act=el("div","cvact");
    const arch=el("button","cvarch"); arch.innerHTML=ic("folder"); arch.title=c.archived?"取消归档":"归档";
    arch.onclick=ev=>{ ev.stopPropagation(); closeSwipe(e); toggleArchive(c.conv); };
    const del=el("button","cvdel"); del.innerHTML=ic("trash"); del.title="删除";
    del.onclick=ev=>{ ev.stopPropagation(); closeSwipe(e); delConv(c.conv); };
    act.append(arch,del); e.append(act);
    bindSwipe(e, body, act);   // 触屏:左滑露出归档/删除,不用长按(iOS 用户少用长按)
    if(c.conv===S.swipedConv) e.classList.add("swiped");   // 重建 DOM 后补回展开状态,别被后台事件触发的重渲染冲掉
  }
  e.onclick=()=>{
    if(e._justSwiped){ e._justSwiped=false; return; }   // 刚滑动完的这次 click 不触发切换
    if(e.classList.contains("swiped")){ closeSwipe(e); return; }   // 已展开:点一下先收起
    openConv(c.conv);
  };
  return e;
}
const CONV_SHOW_MAX = 5;   // 每个分组默认最多展示的会话数(置顶行不计入),超出折进「展开更多」
// 手风琴:默认项目 + 每个项目一个可折叠分组,展开后列出其会话;末尾一行「新建项目」
function renderConvs(){
  const box=$("#convList"); box.innerHTML="";
  const inCall = !$("#callView").hidden;  // 通话中:普通会话行都不高亮,高亮权让给「语音对话」那一行
  const groups=[{hash:null,name:"默认项目"}].concat(S.projects.map(p=>({hash:p.hash,name:p.name})));
  for(const g of groups){
    const convs=convsInGroup(g.hash);
    const open=S.expanded.has(grpKey(g.hash));
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent=g.name; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);   // 折线箭头,展开时旋转朝下
    if(g.hash!==null){
      const more=el("button","pgmore"); more.textContent="⋯"; more.title="更多";
      more.onclick=ev=>{ ev.stopPropagation(); openProjMenu(more, g.hash); }; h.append(more);
    }
    const add=el("button","pgadd"); add.textContent="＋"; add.title="在此项目下新建会话";
    add.onclick=ev=>{ ev.stopPropagation(); newChatIn(g.hash); }; h.append(add);
    if(g.hash!==null){
      bindProjDrag(h, g.hash);   // 默认项目/末尾「新建项目」不可拖,仅真实项目分组可排序
    }
    h.onclick=()=>{ if(S.dragMoved){ S.dragMoved=false; return; } toggleGroup(g.hash); };  // 拖拽落地那一下别顺带触发展开/收起
    box.append(h);
    if(!open) continue;
    // 置顶区:主会话(对话) + 语音对话恒在默认分组最前,不参与时间排序,也不占「展开更多」的名额
    const rows=[];
    if(g.hash===null){
      for(const c of convs) if(c.pinned) box.append(buildConvRow(c, inCall));
      const vm=buildVoiceMainRow(inCall); if(vm) box.append(vm);
      rows.push(...buildVoiceTaskRows(inCall));   // 语音后台任务:普通条目,排在普通会话前
    }
    for(const c of convs){
      if(c.pinned) continue;
      const arch=!!c.archived;
      if(S.convFilter==="archived"&&!arch)continue;
      if(S.convFilter==="active"&&arch)continue;
      rows.push(buildConvRow(c, inCall));
    }
    // 每组默认最多展示 CONV_SHOW_MAX 条,余下折进「展开更多」(点开后本次会话内保持展开)
    const shown = S.moreShown.has(grpKey(g.hash)) ? rows : rows.slice(0, CONV_SHOW_MAX);
    for(const r of shown) box.append(r);
    if(rows.length > shown.length){
      const k=grpKey(g.hash);
      const more=el("div","conv ingroup convmore");
      const mct=el("div","ct"); mct.textContent="展开更多"; more.append(mct);
      more.onclick=()=>{ S.moreShown.add(k); renderConvs(); };
      box.append(more);
    }
  }
  const addp=el("div","projgrp projadd"); addp.textContent="＋ 新建项目…"; addp.onclick=openProjModal; box.append(addp);
  // 同步标题栏:loadConvs 刷新 S.convs 后调 renderConvs,标题可能已更新
  const activeConv=S.convs.find(c=>c.conv===S.conv);
  if(activeConv) $("#convTitle").textContent=activeConv.title||"新对话";
}

// 项目分组拖拽排序(原生 HTML5 DnD:桌面拖起手感好,鼠标移动量够才触发,不影响原有点击展开)
function bindProjDrag(h, hash){
  h.draggable = true;
  h.ondragstart = ev=>{
    if(ev.target.closest(".pgadd,.pgmore")){ ev.preventDefault(); return; }   // 加号/更多按钮不触发拖拽
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", hash);
    S.dragSrc = hash;
    setTimeout(()=>h.classList.add("dragging"), 0);   // 下一 tick 加,免得拖拽预览图也变半透明
  };
  h.ondragend = ()=>{ h.classList.remove("dragging"); S.dragSrc=null; };
  h.ondragover = ev=>{ if(!S.dragSrc || S.dragSrc===hash) return; ev.preventDefault(); ev.dataTransfer.dropEffect="move"; h.classList.add("dragover"); };
  h.ondragleave = ()=> h.classList.remove("dragover");
  h.ondrop = ev=>{
    ev.preventDefault(); h.classList.remove("dragover");
    const src = ev.dataTransfer.getData("text/plain");
    S.dragMoved = true;   // 拖拽落地这一下,别顺带触发 h.onclick 里的展开/收起
    if(src && src!==hash) reorderProject(src, hash);
  };
}
function reorderProject(srcHash, targetHash){
  const arr=S.projects;
  const si=arr.findIndex(p=>p.hash===srcHash), ti=arr.findIndex(p=>p.hash===targetHash);
  if(si<0 || ti<0) return;
  const [item]=arr.splice(si,1); arr.splice(ti,0,item);
  renderConvs();
  api("/projects/reorder",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order:arr.map(p=>p.hash)})}).catch(()=>{});
}
function toggleGroup(hash){
  const k=grpKey(hash);
  if(S.expanded.has(k)){ S.expanded.delete(k); S.moreShown.delete(k); }  // 折叠时清掉「展开更多」态,下次打开回到默认 5 条
  else S.expanded.add(k);
  saveExpanded(); renderConvs();
}
// 在指定项目下开新会话(顶部 ＋新对话 用当前活跃项目;分组 ＋ 用该分组)
function newChatIn(hash){
  S.project=hash; S.expanded.add(grpKey(hash)); saveExpanded();

  const conv="local-"+(hash?("p"+hash+":"):"")+id;

}

async function removeProject(hash){
  try{ await api("/projects/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hash})}); }

function renderNotifyPane(){
  let h = '<h3>'+ic("bell")+'系统通知</h3>'+
    '<p class="shint">开启后,回复完成 / 需要审批 / 主动推送(cron)/ 出错 会推送手机系统通知——页面关了、锁屏也能收到。</p>';

  if(!PUSH.enabled){
    h += '<div class="setempty">服务端还没配推送密钥。<br>跑 <code>python -m claude_hermes.gateway.adapters.web_push --gen-keys</code> 生成 VAPID 填进 .env,重启后再来。</div>';
    $("#setPane").innerHTML=h; return;
  }
  h += '<div class="srow"><div class="sinfo"><div class="sname">本设备通知</div>'+
       '<div class="sdesc" id="notifyDesc">检查中…</div></div>'+
       '<div class="sacts"><label class="sw"><input type="checkbox" id="notifyToggle"><span class="track"></span></label></div></div>';
  h += '<div class="srow"><div class="sinfo"><div class="sname">发送测试通知</div>'+
       '<div class="sdesc">开启后点这里,手机应立刻弹一条系统通知——验证链路是否真的通。</div></div>'+
       '<div class="sacts"><button class="btn ghost sm" id="notifyTest" disabled>测试</button></div></div>';
  h += '<div class="sechd">通知场景</div>'+
       '<p class="shint">回复完成 · 需要审批确认 · 主动推送(cron)· 出错异常——默认全开,可在 .env 用 <code>PUSH_ON_*=0</code> 单独关某类。</p>';
  $("#setPane").innerHTML=h;
  bindNotifyPane();
}
async function bindNotifyPane(){
  const tgl=$("#notifyToggle"), desc=$("#notifyDesc"); if(!tgl) return;
  const denied = (typeof Notification!=="undefined" && Notification.permission==="denied");
  const sub = denied ? null : await currentSub();
  if(denied){ tgl.checked=false; tgl.disabled=true; desc.textContent="浏览器已拒绝通知,去系统/浏览器设置里放行后再试"; }
  else {
    tgl.checked=!!sub; tgl.disabled=false;
    desc.textContent = sub ? "已开启,本设备会收到通知"
      : (isIOSNonStandalone() ? "iPhone 需先把网页「加到主屏」,从主屏图标打开才能开" : "点右侧开关开启");
  }
  const testBtn=$("#notifyTest");
  if(testBtn){
    testBtn.disabled = !sub;
    testBtn.onclick = async ()=>{
      testBtn.disabled=true; const t=testBtn.textContent; testBtn.textContent="发送中…";
      try{
        const j = await (await api("/push/test",{method:"POST"})).json();
        alert(j.sent>0
          ? "已发往 "+j.sent+" 台设备。看手机系统通知(锁屏/通知中心)。"
          : "服务端订阅列表为空(sent=0)——开关没真正订阅成功,请重开一次并留意报错。");
      }catch(e){ alert("测试失败:"+(e&&e.message||e)); }
      finally{ testBtn.textContent=t; testBtn.disabled=!sub; }
    };
  }
  tgl.onchange = async ()=>{
    tgl.disabled=true;
    try{ tgl.checked ? await enableNotify() : await disableNotify(); }
    catch(e){ alert("操作失败:"+(e&&e.message||e)); }
    finally{ bindNotifyPane(); }
  };
}

// ── Web Push 底座:注册 SW + 订阅 VAPID ────────────────────────────────────
// 装了 Service Worker + 订阅公钥后,页面关了/锁屏也能收到系统通知。
// 服务端未配 VAPID 时 /push/config 返回 enabled:false,通知 tab 显示未配置提示。
const PUSH = { pubKey:"", enabled:false, ready:false };
function b64ToU8(base64){
  const pad="=".repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(b), arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
async function initPush(){
  if(!("serviceWorker" in navigator)) return;
  try{ await navigator.serviceWorker.register("/sw.js"); }catch(e){ return; }
  // 点系统通知 → SW 让页面切到对应会话
  navigator.serviceWorker.addEventListener("message", ev=>{
    const m=ev.data||{};
    if(m.type==="open" && m.conv){ try{ openConv(m.conv); }catch(e){} }
  });
  try{
    const cfg = await (await api("/push/config")).json();
    PUSH.enabled=!!cfg.enabled; PUSH.pubKey=cfg.vapidPublicKey||"";
  }catch(e){ return; }
  PUSH.ready=true;
}
async function currentSub(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function enableNotify(){
  // 每一步失败都抛带原因的错误,交给 onchange 的 catch 弹出来——别再静默失败让人盲猜。
  if(isIOSNonStandalone())
    throw new Error("现在不是主屏模式。iPhone 需先把本页「添加到主屏幕」,再从主屏图标打开才能开启。");
  if(typeof Notification==="undefined")
    throw new Error("此浏览器不支持通知 API(Notification 未定义)。");
  let perm = Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm==="denied")
    throw new Error("通知权限被拒。iOS 需删掉主屏图标 + 清掉网站数据后,重新加主屏再试。");
  if(perm!=="granted")
    throw new Error("未获得通知权限(perm="+perm+")。");
  if(!PUSH.pubKey)
    throw new Error("服务端没返回 VAPID 公钥,推送未配置。");
  const reg=await navigator.serviceWorker.ready;
  let sub;
  try{
    sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(PUSH.pubKey) });
  }catch(e){
    throw new Error("订阅失败(pushManager.subscribe):"+(e&&e.message||e));
  }
  const r=await api("/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});
  if(!r.ok)
    throw new Error("订阅已建立但保存到服务端失败(HTTP "+r.status+")。");
}
async function disableNotify(){
  const sub=await currentSub();
  if(sub){
    try{ await api("/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
  }
}

function bindMcpPane(){
  $("#setPane").querySelectorAll("[data-mtgl]").forEach(inp=>{

// 触屏左滑会话行露出归档/删除(iOS 邮件同款手势,比长按更符合触屏习惯)
const SWIPE_W=72;   // 需与 CSS .cvact 宽度一致
function closeSwipe(row){ row.classList.remove("swiped"); if(S.swipedConv===row.dataset.conv) S.swipedConv=null; }
function closeAllSwipes(except){
  $("#convList").querySelectorAll(".conv.swiped").forEach(r=>{ if(r!==except) closeSwipe(r); });
}
function bindSwipe(row, body, act){
  let startX=0, startY=0, dx=0, lock=null, dragging=false;
  row.addEventListener("touchstart", ev=>{
    if(ev.touches.length!==1) return;
    startX=ev.touches[0].clientX; startY=ev.touches[0].clientY;
    dx=0; lock=null; dragging=false;
    row.classList.add("swiping");
  }, {passive:true});
  row.addEventListener("touchmove", ev=>{
    if(ev.touches.length!==1) return;
    const x=ev.touches[0].clientX, y=ev.touches[0].clientY, ddx=x-startX, ddy=y-startY;
    if(lock===null) lock = Math.abs(ddx)>Math.abs(ddy)+4 ? "x" : (Math.abs(ddy)>Math.abs(ddx)+4 ? "y" : null);
    if(lock!=="x") return;   // 竖向滑动交给列表滚动,不拦截
    dragging=true;
    const base = row.classList.contains("swiped") ? -SWIPE_W : 0;
    dx = Math.max(-SWIPE_W, Math.min(0, base+ddx));
    body.style.transform="translateX("+dx+"px)"; act.style.transform="translateX("+(SWIPE_W+dx)+"px)";
  }, {passive:true});
  const end=()=>{
    row.classList.remove("swiping");
    body.style.transform=""; act.style.transform="";
    if(dragging){
      row._justSwiped=true;
      if(dx<=-SWIPE_W/2){ closeAllSwipes(row); row.classList.add("swiped"); S.swipedConv=row.dataset.conv; } else closeSwipe(row);
    }
    dragging=false;
  };
  row.addEventListener("touchend", end);
  row.addEventListener("touchcancel", end);
}

// 按 conv id 找会话对象:普通会话在 S.convs,语音后台任务行在 S.voiceSidebar.tasks
function findConv(conv){
  return S.convs.find(x=>x.conv===conv) || (S.voiceSidebar.tasks||[]).find(x=>x.conv===conv);
}
async function delConv(conv){
  // 语音任务行不在 S.convs 里,从各自所在的列表里乐观移除
  const list = S.convs.some(x=>x.conv===conv) ? S.convs : ((S.voiceSidebar.tasks||[]).some(x=>x.conv===conv) ? S.voiceSidebar.tasks : null);
  if(!list) return;
  const idx=list.findIndex(x=>x.conv===conv);
  const removed=list[idx], wasActive=(S.conv===conv);
  // 乐观假删:先从列表移除并立即重绘,不等服务器
  list.splice(idx,1); delete S.histCache[conv]; delete S.live[conv]; markLive(); renderConvs();
  if(wasActive) openConv(S.convs[0]?S.convs[0].conv:"main");   // 删的是当前会话→切到最近一个
  // 纯本地会话(从未发过消息)服务端没有记录,删完即止
  if(String(conv).startsWith("local-")) return;
  try{
    await api("/conv/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv})});
  }catch(err){
    // 删除失败:回滚列表并提示
    list.splice(idx,0,removed); renderConvs();
    alert("删除失败,已恢复该会话");
  }
}

const SYS_MARK="⚙️[系统]";   // 与后端 selfops.SYS_MARKER 一致:系统注入的轮渲染成居中系统条
function addSysNote(text){

function renderTurns(turns){
  $("#wrap").innerHTML="";
  for(const t of turns){
    if(t.user && t.user.startsWith(SYS_MARK)) addSysNote(t.user.slice(SYS_MARK.length).trim());
    else addBubble("me", t.user, t.images);
    if(!t.pending){
      const b=addBubble("ai","");
      if(t.events && t.events.length){
        const flow=renderEventsFlow(t.events);
        // 时间线里一个字都没有(如被截断)→ 末尾补一段最终正文兜底
        if(!t.events.some(x=>x.type==="text") && t.assistant){
          const d=el("div","seg"); d.innerHTML=mdToHtml(t.assistant); flow.append(d);
        }
        b.append(flow);
      }else b.innerHTML=mdToHtml(t.assistant);   // 老数据没存时间线:只有最终正文
    }else if(t.draft){
      // 进行中但后端正流式写 draft:用部分内容起底兜底,避免刷新后空白;
      // SSE 恢复后 maybeReplayStream 会用同 seg 全文覆盖无缝续上
      const b=addBubble("ai","");
      b.innerHTML=mdToHtml(t.draft);
      const st=el("div","status"); st.textContent="回复中…"; b.append(st);
    }
  }
  updateEmpty(); scrollDown(true);
}
// 用落库的过程时间线重建一轮回复:文字段与工具卡按当时的真实顺序交错复现
function renderEventsFlow(events){
  const flow=el("div","flow");
  for(const blk of events){
    if(blk.type==="text"){
      if(!blk.text) continue;
      const d=el("div","seg"); d.innerHTML=mdToHtml(blk.text); flow.append(d); continue;
    }
    if(blk.type==="compact"){
      const d=el("div","compactline"); d.textContent="上下文已自动压缩,对话继续";
      flow.append(d); continue;
    }
    if(blk.type!=="tool") continue;
    const finished=("preview" in blk), failed=blk.ok===false;
    const det=(blk.detail||"").trim();
    let card=renderToolCard(blk.name, blk.input||{});
    if(!card){
      if(!failed && !det) continue;        // 无入参卡且成功无输出:与流式一致,不补卡
      card=toolCardShell(ic(failed?"warn":"wrench")+" "+esc(blk.name), "", el("div"), true);
    }
    if(card._sub && (blk.subs||[]).length){ // 子代理卡:恢复内部工具步 chips
      const list=blk.subs;
      const bits=['<span>'+ic("zap")+" "+list.length+' 步</span>'];
      for(const x of list.slice(-8)) bits.push('<span>'+esc(x.name)+(x.ok===false?" ✗":" ✓")+'</span>');
      card._sub.innerHTML=bits.join("");
    }
    if(finished) applyResult(card, {ok:!failed, preview:blk.preview||"", detail:blk.detail||""});
    flow.append(card);
  }
  return flow;
}
async function openConv(conv){

  // 语音任务会话不在 S.convs 里(那是 /conversations 拉的),标题去 /voice/sidebar 的缓存里找
  const c=S.convs.find(x=>x.conv===conv) || S.voiceSidebar.tasks.find(x=>x.conv===conv);

  const cached = S.histCache[conv];

    $("#wrap").innerHTML=""; $("#convLoading").classList.remove("on");
  }
  if(S.voiceRec[conv]) renderVoicePending(conv);  // 切回时该会话仍在转写 → 补出占位气泡,不然像是丢了
  if(conv && !String(conv).startsWith("local-")){
    try{
      const r=await api("/history?conv="+encodeURIComponent(conv)); const d=await r.json();
      if(S.conv!==conv) return;   // 拉取期间已切到别的会话 → 丢弃过期结果,避免内容错乱
      $("#convLoading").classList.remove("on");
      S.histCache[conv]=d.turns;
      // 仅当与已渲染的缓存不一致才重绘,避免命中缓存时白闪一下
      if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
    }catch(e){ $("#convLoading").classList.remove("on"); }
    maybeReplayStream(conv);   // 该会话仍在流式 → 用缓冲在历史下方重建流式气泡(切换不中断)
    if(S.conv===conv && S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);  // 切回带待审批的会话 → 补出按钮
    return;
  }
  if(S.conv!==conv) return;
  updateEmpty(); scrollDown(true);
  maybeReplayStream(conv);
  if(S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);
}

// ── 重加载历史(SSE 连接恢复后)──────────────────────────────────────────
// force=true:强制核对一次(用于"流式气泡疑似卡死"场景——例如重连时环形缓冲已把 done 事件
// 挤出去,前端永远等不到收尾)。核对时只信服务端:该轮在 /history 里已落库完成才收气泡改用
// 权威历史重绘;服务端也认为还在跑就绝不打断,只是重置一下卡住计时,过会再核对一次。
async function reloadHistory(force){
  const conv=S.conv;
  if(!conv || String(conv).startsWith("local-")) return;  // 只在非本地会话拉
  if(S.stream && !force) return;  // 正在流式输出中 → 别用全量重绘冲掉流式气泡
  try{
    const r=await api("/history?conv="+encodeURIComponent(conv));
    const d=await r.json();
    if(S.conv!==conv) return;  // await 期间切了会话 → 丢弃
    const cached=S.histCache[conv];
    if(S.stream){
      const last=d.turns[d.turns.length-1];
      if(!last || last.pending){ S.stream.lastEvt=Date.now(); return; }  // 服务端也还在跑,别打断
      finalizeStream();  // 服务端已收尾,前端漏接了 → 收掉卡住的流式气泡,改用下面的权威历史重绘
    }
    S.histCache[conv]=d.turns;
    if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
  }catch(e){}
}

// ── 消息气泡 ─────────────────────────────────────────────────────────────
function addBubble(who, text, imgs){
  const row=el("div","row "+(who==="me"?"me":"ai"));
  const b=el("div","bubble");
  if(who==="me"){ b.textContent=text; } else { b.innerHTML = text?mdToHtml(text):""; }
  row.append(b);

    // 历史图走 /image?name=(需鉴权头,浏览器 <img> 不带) → 用 api() 取 blob;
    // 实时发的是 data:/blob: URL,直接塞 src。
    if(typeof u==="string" && u.startsWith("/")) loadAuthedImg(im,u); else im.src=u;
    g.append(im);} b.append(g); }

// 带鉴权头拉图并显示;token 只在头里传,不进 URL(不泄露到日志/历史/Referer)
async function loadAuthedImg(im, url){

    const r=await api(url); if(!r.ok) return;
    const b=await r.blob(); const o=URL.createObjectURL(b);
    im.onload=()=>URL.revokeObjectURL(o); im.src=o;

}
function scrollDown(force){

    const dist=m.scrollHeight - m.scrollTop - m.clientHeight;

function updateScrollBtn(){

// 点↓按钮:平滑滚到底(流式跟滚仍用瞬时,否则追不上不断增长的内容)
function scrollDownSmooth(){
  const m=$("#messages");
  m.scrollTo({top:m.scrollHeight, behavior:"smooth"});
}

// ── SSE 流式接收 ─────────────────────────────────────────────────────────
// 用 fetch 流式读 SSE,替代原生 EventSource。原因:iOS Safari 只要有活跃的 EventSource
// 长连接,地址栏就【一直转圈】(把没结束的长连接当成"页面还在加载")。fetch 读流不占这个
// "页面加载"语义,转圈消失;且重连完全握在自己手里(回前台立即重连、断线退避重连)。
// 服务端仍是标准 SSE,无需改动。对外暴露与 EventSource 兼容的接口:readyState / close()。
class FetchSSE {
  constructor(url, token){
    this.url=url; this.token=token;
    this.readyState=0;        // 0=连接中 1=已连 2=已关闭
    this.lastId=null;         // 最后收到的 SSE id,重连时带 Last-Event-ID 让服务端补发漏掉的
    this.lastBeat=Date.now(); // 最后收到任何数据(含心跳)的时刻,看门狗据此判断假死
    this.onopen=null; this.onmessage=null;
    this._closed=false; this._ctrl=null; this._wake=null;
    this._loop();
  }
  async _loop(){
    let firstOpen=true;
    while(!this._closed){
      this.readyState=0; this._ctrl=new AbortController();
      try{
        const headers={"X-Auth-Token":this.token};
        if(this.lastId!=null) headers["Last-Event-ID"]=String(this.lastId);
        const resp=await fetch(this.url,{headers, signal:this._ctrl.signal, cache:"no-store"});
        if(resp.status===401){ this.close(); showLogin(); return; }
        if(!resp.ok || !resp.body) throw new Error("http "+resp.status);
        this.readyState=1; this.lastBeat=Date.now();
        if(this.onopen) this.onopen(firstOpen);   // 传首连标志:首连不补历史(openConv 已拉),重连才补
        firstOpen=false;
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
        while(!this._closed){
          const {value,done}=await reader.read();
          if(done) break;                          // 服务端关流 → 跳出去重连
          buf+=dec.decode(value,{stream:true});
          let sep;
          while((sep=buf.indexOf("\n\n"))>=0){ const block=buf.slice(0,sep); buf=buf.slice(sep+2); this._emit(block); }
        }
      }catch(e){ /* abort / 网络断,落到下面退避重连 */ }
      if(this._closed) break;
      this.readyState=0; await this._sleep(3000);  // 退避 3s(reconnectNow 可提前唤醒)
    }
    this.readyState=2;
  }
  _emit(block){
    this.lastBeat=Date.now();                      // 收到任何块(含 ": ping")= 连接活着
    let id=null,data=null;
    for(const line of block.split("\n")){
      if(line.startsWith(":")) continue;           // ": ping" / ": connected" 注释行,忽略
      if(line.startsWith("id:")) id=line.slice(3).trim();
      else if(line.startsWith("data:")) data=line.slice(5).trim();
    }
    if(id!=null) this.lastId=id;
    if(data!=null && this.onmessage) this.onmessage({data});
  }
  _sleep(ms){ return new Promise(res=>{ const t=setTimeout(res,ms); this._wake=()=>{ clearTimeout(t); this._wake=null; res(); }; }); }
  reconnectNow(){ if(this._closed) return; if(this._ctrl) try{this._ctrl.abort();}catch(e){} if(this._wake) this._wake(); } // 立刻断开重连(跳过退避)
  close(){ this._closed=true; this.readyState=2; if(this._ctrl) try{this._ctrl.abort();}catch(e){} if(this._wake) this._wake(); }
}
function connect(){
  if(S.es) S.es.close();
  const es = S.es = new FetchSSE("/events", S.token);
  es.onopen = (firstOpen)=>{
    // 首连/重连都拉一次历史:首连补回上次刷新前进行中轮的部分内容(draft_text);
    // 重连补回断连期间漏掉的消息(尤其服务端自我重启后注入的系统消息)。force:重连这一刻
    // 恰是最容易出现"流式气泡卡死"的时候(断线期间 done 被环形缓冲挤掉),顺带核对一次。
    reloadHistory(true);
  };
  es.onmessage = ev=>{ try{
    const d=JSON.parse(ev.data);
    if(d.id){ if(d.id<=S.lastId) return; S.lastId=d.id; }  // 补发/重复的老事件直接丢弃
    handleEvent(d);
  }catch(e){} };
}
// 手机救命稻草:iOS 切后台/锁屏会挂起连接,回前台后连接多半已【假死】(既不报错也不来数据)。
// 页面重新可见 / 重新联网 / 窗口聚焦时,主动 reconnectNow() 强制重连,并直接走 HTTP 拉一次历史
// (不等 SSE 恢复)。8s 看门狗兜底:超过 20s 没收到任何数据(含心跳)就判定假死并强制重连。
function reviveSSE(){
  if(document.hidden) return;
  if(!S.es) connect(); else S.es.reconnectNow();
  reloadHistory(true);          // 强制核对:回前台/回网络时最可能出现"卡在思考中"的漏接
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reviveSSE(); });
window.addEventListener("online", reviveSSE);
window.addEventListener("focus", reviveSSE);
setInterval(()=>{
  if(document.hidden || !S.es) return;
  if(S.es.readyState===2) connect();                                   // 被关掉了 → 重建
  else if(Date.now()-(S.es.lastBeat||0) > 20000) S.es.reconnectNow();  // 20s 无心跳=假死 → 强制重连
  // 连接活着,但当前会话的流式气泡超过 25s 没收到任何新事件 → 疑似卡住(如反复切换多个
  // 正在streaming的会话期间发生过短暂重连,漏接了这条的某帧),强制核对一次历史自愈
  else if(S.stream && Date.now()-(S.stream.lastEvt||S.stream.t0||0) > 25000) reloadHistory(true);
}, 8000);
function ensureStream(t0){
  // 为当前会话准备一个流式 assistant 气泡(含状态行/思考/过程区)
  if(S.stream) return S.stream;
  const row=el("div","row ai");
  const bubble=el("div","bubble");
  const status=el("div","status");
  const thinktog=el("div","thinktog"); const tcv=el("span","chev");
  thinktog.append(tcv, document.createTextNode("思考过程"));
  const think=el("div","think");
  // flow:文字段与工具卡按到达顺序交错追加(复刻 Claude Code 的边说边干)
  const flow=el("div","flow");
  bubble.append(thinktog,think,flow,status);  // 状态行(工作中…)放气泡底部,像 TG 的打字指示
  row.append(bubble); $("#wrap").append(row); updateEmpty();
  thinktog.onclick=()=>{ const on=think.classList.toggle("show"); tcv.classList.toggle("down", on); };
  S.stream={row,bubble,status,think,thinktog,flow,segs:{},tools:[],cards:{},subs:{},t0:t0||Date.now(),lastEvt:Date.now()};
  // 状态行的耗时计数每秒走字;流被任何路径丢弃(完成/切会话)都会自行停表,不泄漏
  const tm=setInterval(()=>{ if(!S.stream||S.stream.timer!==tm){ clearInterval(tm); return; } renderStatus(); }, 1000);
  S.stream.timer=tm;
  renderStatus();  // 初始即显示"💭 思考中…"动画
  updateSendBtn();
  scrollDown(true); return S.stream;
}
// 取/建某文字段的 div(按首次出现顺序挂进 flow,与工具卡自然交错)
function segDiv(s, seg){
  seg=seg||0;
  let d=s.segs[seg];
  if(!d){ d=el("div","seg"); d.dataset.raw=""; s.segs[seg]=d; s.flow.append(d); }
  return d;
}
// 全部文字段拼起来(判断"这轮有没有正文"用)
function streamText(s){
  return Object.keys(s.segs).sort((a,b)=>a-b).map(k=>s.segs[k].dataset.raw).join("");
}
let renderPending=false; const dirtySegs=new Set();
function renderSeg(d){
  dirtySegs.add(d);
  if(renderPending) return; renderPending=true;
  requestAnimationFrame(()=>{ renderPending=false;
    for(const x of dirtySegs) x.innerHTML=mdToHtml(x.dataset.raw);
    dirtySegs.clear(); scrollDown(); });
}
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';
function renderStatus(){
  if(!S.stream) return;
  const t=S.stream.tools, hasBody=!!streamText(S.stream);
  // 工具 chip 已下放到 flow 卡片,这里不再重复;只留一条持续的"工作中/思考中"指示
  const secs=Math.max(0, Math.round((Date.now()-(S.stream.t0||Date.now()))/1000));
  const tick=secs>=1?(" · "+(secs>=60?Math.floor(secs/60)+"m"+(secs%60)+"s":secs+"s")):"";
  // 有正文 或 有工具在跑 → 工作中;纯思考(啥都没出)→ 思考中(始终带动画,像 TG)
  const working = hasBody || t.some(x=>!x.done);
  const label = working ? "工作中" : "思考中";
  S.stream.status.innerHTML = '<span class="chip live">'+label+DOTS+esc(tick)+'</span>'
    + '<button type="button" class="statusstop" title="停止回复" aria-label="停止回复"><span class="sq"></span></button>';
}
function finalizeStream(finalText){
  if(!S.stream) return;
  if(S.stream.timer) clearInterval(S.stream.timer);
  S.stream.status.remove(); S.stream.thinktog.remove(); S.stream.think.remove();
  // 回合已结束:还没点的审批按钮全部失效(点了也只会收到"已过期")
  S.stream.bubble.querySelectorAll(".choice button").forEach(b=>{ b.disabled=true; });
  // 交错排布保持原样;只有整轮没渲出任何正文时才用 done 的全文兜底(防丢帧空泡)
  if(finalText!==undefined && !streamText(S.stream)){
    const d=segDiv(S.stream, 0); d.dataset.raw=finalText; d.innerHTML=mdToHtml(finalText);
  }else{
    for(const k in S.stream.segs){ const d=S.stream.segs[k]; d.innerHTML=mdToHtml(d.dataset.raw); }
  }
  S.stream=null; updateSendBtn(); scrollDown();
}
// 构成一个"进行中回合"的流式事件类型(可重放以重建气泡)。done/message/choice 不在此列。
const STREAMY = ["user","start","thinking","text","tool_start","tool_input","tool_end","compact"];
// 每会话缓冲进行中回合的事件;text/thinking 是全量快照:thinking 全局只留最后一条,
// text 按段(seg)各留最后一条 —— 段的先后顺序就是与工具卡交错的顺序,不能压掉。
function bufPush(conv, e){
  const b = S.live[conv] || (S.live[conv]=[]);
  if(e.type==="start" && !e._t0) e._t0=Date.now(); // 记录真实开始时刻,切回重放时恢复计时
  if(e.type==="text"||e.type==="thinking"){
    for(let i=b.length-1;i>=0;i--){
      if(b[i].type!==e.type) continue;
      if(e.type==="text" && (b[i].seg||0)!==(e.seg||0)) continue;
      b[i]=e; return;
    }
  }
  b.push(e);
}
// 仅当"正在回复的会话集合"变化时才重绘列表(圆点靠 CSS 动画常闪,不需逐帧 JS)。
let _liveSig="";
function markLive(){
  const sig=Object.keys(S.live).sort().join(",");
  if(sig===_liveSig) return;
  _liveSig=sig; renderConvs();
}
function handleEvent(e){
  // 会话有新回合 → 历史已变,作废其缓存,下次打开会重新拉取
  if(e.type==="done"||e.type==="message") delete S.histCache[e.conv];
  // 维护每会话"进行中"缓冲:无论前台/后台都记录,切回该会话时可完整重建流式气泡
  if(STREAMY.indexOf(e.type)>=0){ bufPush(e.conv, e); markLive(); }
  if(e.type==="done"||e.type==="message"){ delete S.live[e.conv]; markLive(); }

  if(e.conv!==S.conv){ // 别的会话在后台的事件 → 不打断当前视图(已缓冲,圆点已更新)
    // 审批发给非当前会话:暂存,切回该会话时补渲染,别静默丢弃(否则那轮会一直卡到超时)
    if(e.type==="choice"){ S.pendingChoice[e.conv]=e; loadConvs(); return; }
    // 该会话这一轮结束了 → 之前暂存的审批已作废,清掉
    if(e.type==="done"||e.type==="message"){ delete S.pendingChoice[e.conv]; loadConvs(); }
    if(e.type==="done") flushPending(e.conv);  // 后台会话任务完成 → 补发其待发送队列
    return;
  }
  // 当前会话本轮结束 → 清掉可能残留的暂存审批
  if(e.type==="done"||e.type==="message") delete S.pendingChoice[e.conv];
  if(STREAMY.indexOf(e.type)>=0){ applyStreamEvent(e); if(S.stream) S.stream.lastEvt=Date.now(); return; }
  switch(e.type){
    case "done": {
      const errBubble = S.stream ? S.stream.bubble : null;
      finalizeStream(e.text);
      if(e.is_error){
        if(errBubble) errBubble.classList.add("err");
        // 有 api_error_status(429/529/5xx等)= 后端已确认是模型服务商那边的错,
        // 直接按状态码分类;没有才退回关键词猜测(网络/进程异常等)
        const st=e.api_error_status;
        if(st===429) setRateStatus("warn", "最近遇到限额/过载", e.error);
        else if(st===529) setRateStatus("warn", "Claude 服务过载", e.error);
        else if(st) setRateStatus("err", `Claude 服务出错(${st})`, e.error);
        else {
          const el=(e.error||"").toLowerCase();
          if(/rate|429|quota|limit|overloaded/i.test(el)) setRateStatus("warn", "最近遇到限额/过载", e.error);
          else setRateStatus("err", "", e.error);
        }
      }else{ setRateStatus("ok","",""); }
      setMeta(e); loadConvs(); flushPending(e.conv); break; }
    case "message": // 命令回复 / 报错 / cron 推送
      if(S.stream && !streamText(S.stream)){ finalizeStream(e.text); }
      else { S.stream=null; addBubble("ai", e.text); }
      // 后端推送的报错也更新侧栏状态
      if(e.text&&e.text.includes("⚠️")){
        const el2=e.text.toLowerCase();
        if(/rate|429|quota|limit|overloaded/i.test(el2)) setRateStatus("warn", "最近遇到限额/过载", e.text);
        else setRateStatus("err", "", e.text);
      }
      loadConvs(); flushPending(e.conv); break;
    case "choice": delete S.pendingChoice[e.conv]; renderChoice(e); break;
  }
}
// 把单个流式事件落到 DOM(供前台实时渲染 + 切回会话时按缓冲重放两用)
function applyStreamEvent(e){
  switch(e.type){
    case "user":
      if(S.localSent){ S.localSent=false; break; }  // 本客户端发的,气泡已在 send() 里加了
      // 无活跃流式气泡 = 不是本轮发送 → 历史已渲染过该消息,跳过避免重复
      if(!S.stream) break;
      addBubble("me", e.text); break;
    case "start": ensureStream(e._t0); break;
    case "thinking": { const s=ensureStream(); s.thinktog.style.display="flex"; s.think.textContent=e.text; renderStatus(); break; }
    case "text": { const s=ensureStream(); const d=segDiv(s, e.seg); d.dataset.raw=e.text; renderSeg(d); renderStatus(); break; }
    case "tool_start": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:false, ok:true}); }
      else s.tools.push({name:e.name, id:e.tool_id, done:false, ok:true, subN:0});
      renderStatus(); break; }
    case "tool_input": { const s=ensureStream();
      if(e.parent) break;   // 子代理内部工具的入参不展大卡片(动态在子代理卡里),避免刷屏
      const card=renderToolCard(e.name, e.input||{});
      if(card){ if(e.tool_id) s.cards[e.tool_id]=card; s.flow.append(card); scrollDown();
        // 子代理卡片刚建好:若它的内部工具事件已先到(存在 s.subs),补渲染一次动态区
        if(card._sub && e.tool_id && s.subs[e.tool_id]) renderSub(s, e.tool_id);
      } break; }
    case "tool_end": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:true, ok:e.ok}); renderStatus(); break; }
      // 优先按 tool_id 配对(并行同名工具不会错标),回退按名字
      const it=(e.tool_id&&s.tools.find(x=>x.id===e.tool_id&&!x.done))
        ||s.tools.find(x=>x.name===e.name&&!x.done)||s.tools[s.tools.length-1];
      if(it){it.done=true;it.ok=e.ok;}
      attachResult(s, e); renderStatus(); break; }
    case "compact": { const s=ensureStream();
      const d=el("div","compactline"); d.textContent="上下文已自动压缩,对话继续";
      s.flow.append(d); scrollDown(); break; }
  }
}
// 切回某会话:若它有进行中的缓冲,重放事件在历史下方重建流式气泡
function maybeReplayStream(conv){
  if(S.conv!==conv) return;
  const buf=S.live[conv]; if(!buf||!buf.length) return;
  // renderTurns 可能已用 draft 渲染了部分内容;SSE 恢复后流式气泡会覆盖它,
  // 先清掉避免出现两个 AI 气泡(草稿+流式)
  const rows=$("#wrap").children;
  for(let i=rows.length-1;i>=0;i--){
    if(rows[i].classList.contains("ai") && rows[i].querySelector(".status")){
      rows[i].remove(); break;
    }
  }
  S.stream=null;
  for(const e of buf){
    if(e.type==="user") continue;   // 用户消息已由历史渲染,重放跳过避免重复气泡
    applyStreamEvent(e);
  }
  if(S.stream) S.stream.lastEvt=Date.now();  // 按当前时刻起算卡住检测,不用缓冲里事件的旧时间
}
function renderChoice(e){
  const box=el("div","choice");

  });

    const card=el("div","toolcard");

// ── 工具卡片渲染(diff / todo 清单 / 计划卡 / 命令预览)──────────────────────
function toolCardShell(title, pathText, bodyEl, collapsed){
  const card=el("div","toolcard");
  const head=el("div","tc-head");
  const chev=el("span","chev"); if(!collapsed) chev.classList.add("down");
  const titleEl=el("span"); titleEl.innerHTML=title;
  head.append(chev, titleEl);
  const p=el("span","tc-path"); if(pathText) p.textContent=pathText; head.append(p);  // 始终留位,结果预览可后补
  const bodyWrap=el("div","tc-body"+(collapsed?" collapsed":""));
  if(bodyEl) bodyWrap.append(bodyEl);
  head.onclick=()=>{ const c=bodyWrap.classList.toggle("collapsed"); chev.classList.toggle("down",!c); };
  card.append(head,bodyWrap);
  card._head=head; card._chev=chev; card._body=bodyWrap; card._path=p;
  return card;
}
function diffEl(oldStr, newStr){
  const d=el("div","diff");
  if(oldStr){ for(const l of oldStr.split("\n")){ const s=el("span","ln del"); s.textContent=l; d.append(s); } }
  if(newStr){ for(const l of newStr.split("\n")){ const s=el("span","ln add"); s.textContent=l; d.append(s); } }
  return d;
}
// ── 子代理(Task)动态:嵌进 Task 卡片的实时工具 chips ──────────────────────
function subUpsert(s, pid, item){
  const st = s.subs[pid] || (s.subs[pid]={list:[]});
  let t = item.id ? st.list.find(x=>x.id===item.id) : null;
  if(!t && item.done) t = [...st.list].reverse().find(x=>x.name===item.name && !x.done);
  if(t){ Object.assign(t, item); }
  else {
    st.list.push(item);
    const p=s.tools.find(x=>x.id===pid); if(p) p.subN=(p.subN||0)+1;  // Task chip 上的步数
  }
  renderSub(s, pid);
}
function renderSub(s, pid){
  const card=s.cards[pid]; if(!card||!card._sub) return;
  const list=(s.subs[pid]||{list:[]}).list;
  const bits=['<span>'+ic("zap")+" "+list.length+' 步</span>'];
  for(const x of list.slice(-8))
    bits.push('<span>'+esc(x.name)+(x.done?(x.ok?" ✓":" ✗"):DOTS)+'</span>');
  card._sub.innerHTML=bits.join("");
}
// ── 工具结果:折进入参卡的展开区(同一张卡,不再单独占一行)──────────────────
// 没有入参卡的工具(出错/有输出)才补一张最小卡
function applyResult(card, e){
  const det=(e.detail||"").trim();
  if(!e.ok) card._head.classList.add("err");                 // 出错:整行标红
  if(e.preview && card._path && !card._path.textContent) card._path.textContent=e.preview;  // 头部无路径时补结果预览
  if(det){
    if(card._body.childNodes.length) card._body.append(el("div","tc-sep"));  // 已有入参 → 加分隔线
    const body=el("pre","tc-res-body"); body.textContent=det; card._body.append(body);
  }
}
function attachResult(s, e){
  const det=(e.detail||"").trim();
  let card=e.tool_id ? s.cards[e.tool_id] : null;
  if(!card){
    if(e.ok && !det) return;              // 成功且无输出:chip 的 ✓ 已表达,不补卡
    card=toolCardShell(ic(e.ok?"wrench":"warn")+" "+esc(e.name), "", null, true);
    if(e.tool_id) s.cards[e.tool_id]=card;
    s.flow.append(card);
  }
  applyResult(card, e);
  scrollDown();
}
function renderToolCard(name, inp){
  try{
    if(name==="Task"||name==="Agent"){   // 子代理:新版工具名 Agent,老版 Task,两者都收
      // 子代理卡片:标题=描述,收起的正文=完整指令;动态区(_sub)实时滚动工具步
      const meta=el("div","tc-code");

      }
      return toolCardShell(ic("clip")+" 待办清单","",ul,false);
    }
    if(name==="ExitPlanMode"){

      return toolCardShell(ic("compass")+" 执行计划","",p,false);
    }
    if(name==="Write")     return toolCardShell(ic("doc")+" 写文件", inp.file_path||"", diffEl("", inp.content||""), true);
    if(name==="Edit")      return toolCardShell(ic("edit")+" 编辑", inp.file_path||"", diffEl(inp.old_string||"", inp.new_string||""), true);
    if(name==="MultiEdit"){
      const wrap=el("div");
      for(const ed of (inp.edits||[])) wrap.append(diffEl(ed.old_string||"", ed.new_string||""));
      return toolCardShell(ic("edit")+" 多处编辑", inp.file_path||"", wrap, true);
    }

    const hint=inp.file_path||inp.path||inp.pattern||inp.query||inp.url||"";
    if(hint){ const c=el("div","tc-code"); c.textContent=hint; return toolCardShell(ic("wrench")+" "+esc(name), "", c, true); }
    return null;
  }catch(e){ return null; }
}

// ── 发送 ────────────────────────────────────────────────────────────────
async function send(text, display, opts){
  opts=opts||{};
  closeCmdMenu();
  text=(text||"").trim(); if(!text && !S.images.length) return;
  // 上一个任务还没结束 → 不打断,排进待发送队列,任务完成后自动发(审批/语音走 forceSend 立即发)
  if(S.stream && !opts.forceSend){ if(queuePending(text, S.images.slice())){ S.images=[]; renderThumbs(); $("#ta").value=""; autoGrow(); } return; }
  const imgs=S.images.map(x=>x.url);
  // display:点按钮时传选项文字,气泡显示友好文字而非原始命令(如 /clarify id 0)
  const shown=(display!=null)?display:text;
  // opts.reuseBubble:语音已先冒了占位气泡并回填文字,这里不再重复冒泡
  if(!opts.reuseBubble && (shown || imgs.length)) addBubble("me", shown||"(图片)", imgs);
  // 标记本轮由本客户端发出,避免收到 "user" 事件时渲染重复气泡
  if(!text.startsWith("/")) S.localSent = true;
  // 非命令消息:立刻挂一个"💭 思考中…"气泡,不等服务器 start 事件,反馈更即时(像 TG 秒回 typing)
  if(!text.startsWith("/") && !S.stream){ ensureStream(); }
  const payload={conv:S.conv, text, images:S.images.map(x=>({data:x.data,media_type:x.media_type}))};
  // 新会话:发出第一条后,把本地临时会话转正
  const wasLocal=String(S.conv).startsWith("local-");
  if(wasLocal){ S.conv=S.conv.replace("local-",""); payload.conv=S.conv; }
  S.images=[]; renderThumbs(); $("#ta").value=""; autoGrow();
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}
// 静默发命令(如 /model 切换):不渲染用户气泡,回执由服务端 message 事件带回
async function sendCmd(cmd){
  const payload={conv:S.conv, text:cmd, images:[]};
  const wasLocal=String(S.conv).startsWith("local-");
  if(wasLocal){ S.conv=S.conv.replace("local-",""); payload.conv=S.conv; }
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}

async function stopReply(){
  if(!S.stream) return;

  try{ await api("/abort",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv})}); }
  catch(e){ /* 网络异常忽略,前端已处理 */ }
}
// ── 待发送队列 ────────────────────────────────────────────────────────────
function queuePending(text, images){
  if(!text && !(images||[]).length) return;
  const q = S.pending[S.conv] || (S.pending[S.conv]=[]);
  if(q.length>=3){ pendFull(); return false; }  // 满 3 条不再排队,抖一下提示
  q.push({id:++S.pendId, text, images:images||[]});
  drawPending();
  return true;
}
// 队列已满:让待发送区抖一下,给个"到上限了"的即时反馈
function pendFull(){
  const box=$("#pending"); if(!box) return;
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
}
function drawPending(){
  const box=$("#pending"); if(!box) return;
  box.innerHTML="";
  for(const it of (S.pending[S.conv]||[])){
    const row=el("div","pi");
    const clk=el("span","clock"); clk.textContent="⏳";
    const tx=el("span","ptext"); tx.textContent=it.text||"(图片)";
    const del=el("button","pdel"); del.type="button"; del.title="删除"; del.textContent="×";
    del.onclick=()=>removePending(it.id);
    row.append(clk,tx,del); box.append(row);
  }
}
function removePending(id){
  const q=S.pending[S.conv]; if(!q) return;
  const i=q.findIndex(x=>x.id===id); if(i<0) return;
  q.splice(i,1); if(!q.length) delete S.pending[S.conv]; drawPending();
}
// 任务完成 → 发出该会话待发送队列的第一条(逐条发:发一条,等它 done 再发下一条)
function flushPending(conv){
  const q=S.pending[conv]; if(!q || !q.length) return;
  const item=q.shift(); if(!q.length) delete S.pending[conv];
  if(conv===S.conv){
    drawPending();
    S.images=(item.images||[]).slice(); renderThumbs();
    send(item.text, null, {forceSend:true});
    return;
  }
  // 后台会话:直接发,不渲染,靠 SSE 缓冲在切回时重建
  const payload={conv, text:item.text, images:(item.images||[]).map(x=>({data:x.data,media_type:x.media_type}))};
  api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(loadConvs).catch(()=>{});
}

// ── 语音输入(录音 → 后端 SenseVoice 转写 → 填进输入框)────────────────────
// Claude 不吃音频,故先在后端转成文字。点一下开录(实时声波动效)、再点结束,转好的文字并入输入框可编辑再发。
const REC = { state:"idle", mr:null, chunks:[], stream:null, mime:"", t0:0, timer:null, cancel:false,
  actx:null, analyser:null, dataArr:null, raf:null, levels:[], waveColor:"#ef4444", _lastPush:0 };
function setRecUI(){
  // 只在"录音中"显示录音条;点发送后立即收起录音条、恢复输入框,转写状态改由聊天区占位气泡承载
  const rec=REC.state==="recording";
  const row=$("#recRow"), inrow=document.querySelector(".inrow");
  row.classList.toggle("show", rec);
  if(inrow) inrow.style.display = rec ? "none" : "";
}
function recTick(){ const s=Math.max(0,Math.floor((Date.now()-REC.t0)/1000)); $("#recTime").textContent=(s/60|0)+":"+String(s%60).padStart(2,"0"); }
// 滚动声波:采样(取音量)节流到约每 75ms 一次,但渲染每帧都画——用采样间隔内的时间差
// 算出平滑偏移量,让柱子连续向左滑而不是每 75ms 才跳一格(避免低帧率卡顿感)
function drawWave(){
  if(REC.state!=="recording" || !REC.analyser){ return; }
  REC.raf=requestAnimationFrame(drawWave);
  const now=Date.now();
  const PUSH_MS=75;
  if(now - REC._lastPush >= PUSH_MS){   // 节流:只控制"多久取一次样",不影响绘制帧率
    REC._lastPush=now;
    REC.analyser.getByteTimeDomainData(REC.dataArr);
    let sum=0; for(let i=0;i<REC.dataArr.length;i++){ const x=(REC.dataArr[i]-128)/128; sum+=x*x; }
    REC.levels.push(Math.min(1, Math.sqrt(sum/REC.dataArr.length)*3.4));
  }
  const cv=$("#recWave"); if(!cv) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||1, H=cv.clientHeight||1;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const barW=3, step=5, maxBars=Math.floor(W/step)+2;
  if(REC.levels.length>maxBars) REC.levels.splice(0, REC.levels.length-maxBars);
  const offset=step*Math.min(1, (now-REC._lastPush)/PUSH_MS);   // 采样间隔内的连续滚动偏移
  ctx.fillStyle=REC.waveColor;
  const n=REC.levels.length;
  for(let i=0;i<n;i++){
    const h=Math.max(3, REC.levels[i]*(H-4)), x=W-(n-i)*step-offset, y=(H-h)/2;
    if(x+barW<0) continue;
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,barW,h,barW/2); ctx.fill(); }
    else ctx.fillRect(x,y,barW,h);
  }
}
function cleanupAudio(){
  if(REC.raf){ cancelAnimationFrame(REC.raf); REC.raf=null; }
  try{ if(REC.actx && REC.actx.state!=="closed") REC.actx.close(); }catch(e){}
  REC.actx=null; REC.analyser=null; REC.levels=[];
  const cv=$("#recWave"); if(cv){ const c=cv.getContext("2d"); if(c) c.clearRect(0,0,cv.width,cv.height); }
}
// 每次录音结束即释放麦克风流(见 onRecStop),这里负责按需重新获取;权限按站点记住,不会反复弹框
async function getMic(){
  if(REC.stream && REC.stream.getAudioTracks().some(t=>t.readyState==="live")) return REC.stream;
  REC.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  return REC.stream;
}
function releaseMic(){ if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; } }
async function startRec(){
  if(REC.state!=="idle") return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert("此浏览器不支持录音"); return; }
  try{ await getMic(); }
  catch(e){ alert("麦克风权限被拒绝或不可用"); return; }
  // 限码率:识别不需要高音质,压低码率能大幅缩短手机上传耗时(实测上传经常比转写本身还慢)
  REC.chunks=[]; REC.cancel=false; REC._lastPush=0; REC.mr=new MediaRecorder(REC.stream,{audioBitsPerSecond:24000});
  REC.mime = REC.mr.mimeType || "audio/webm";
  REC.mr.ondataavailable=e=>{ if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=onRecStop;
  try{   // 实时声波(失败不影响录音本身)
    const AC=window.AudioContext||window.webkitAudioContext;
    REC.actx=new AC(); if(REC.actx.state==="suspended") await REC.actx.resume();
    REC.analyser=REC.actx.createAnalyser(); REC.analyser.fftSize=512;
    REC.actx.createMediaStreamSource(REC.stream).connect(REC.analyser);
    REC.dataArr=new Uint8Array(REC.analyser.fftSize); REC.levels=[];
    REC.waveColor=(getComputedStyle(document.documentElement).getPropertyValue("--err").trim())||"#ef4444";
  }catch(e){ REC.analyser=null; }
  REC.mr.start(); REC.state="recording"; REC.t0=Date.now(); recTick();
  REC.timer=setInterval(recTick,500); setRecUI();
  if(REC.analyser) drawWave();
}
function stopRec(cancel){
  if(REC.state!=="recording") return;
  REC.cancel=!!cancel; clearInterval(REC.timer); REC.timer=null;
  try{ REC.mr.stop(); }catch(e){}
}
// 转写中占位气泡:按"录音发起时所属会话"存进 S.voiceRec,切走再切回能补出来(否则像是丢了)
function renderVoicePending(conv){
  const st=S.voiceRec[conv]; if(!st) return;
  const b=addBubble("me","");
  b.classList.add("voicebub");
  b.innerHTML='<span class="vwait"><span class="sp"></span>转写中…</span>';
  st.bubble=b;
}
async function onRecStop(){
  cleanupAudio();   // 停声波分析
  releaseMic();     // 立刻停掉麦克风流,灭掉 iOS 状态栏录音指示灯(权限已按站点记住,下次不再弹框)
  const blob=new Blob(REC.chunks,{type:REC.mime}); const mime=REC.mime;
  REC.mr=null;
  if(REC.cancel || blob.size<1200){ REC.state="idle"; setRecUI(); return; }
  // 记住录音发起时所在的会话:转写这段时间用户可能已切到别的会话,完成后要发到这个会话而非当前会话
  const conv=S.conv;
  // 点发送:立即收起录音条,在聊天区冒一个"我"的占位气泡(转写中…),不等结果
  REC.state="transcribing"; setRecUI();
  S.voiceRec[conv]={};
  renderVoicePending(conv);
  try{
    const ext = mime.includes("mp4")||mime.includes("mpeg")?"mp4":mime.includes("ogg")?"ogg":mime.includes("wav")?"wav":"webm";
    const fd=new FormData(); fd.append("audio", blob, "voice."+ext);
    const r=await api("/transcribe",{method:"POST",body:fd});
    const d=await r.json().catch(()=>({}));
    const st=S.voiceRec[conv]; delete S.voiceRec[conv];
    const here=S.conv===conv;   // 转写完成时是否还停留在发起录音的那个会话
    if(r.ok && d.text){
      if(here && st && st.bubble){
        // 还在原会话:文字回填占位气泡,再复用它自动发给 Claude(不重复冒泡)
        st.bubble.classList.remove("voicebub"); st.bubble.textContent=d.text;
        await send(d.text, null, {reuseBubble:true, forceSend:true});
      }else{
        // 已切到别的会话:占位气泡早被清空,直接发到后台会话,靠历史/SSE 缓冲在切回时补出来;
        // 若该会话还是未转正的本地新会话(local-xxx),后端不认识这个前缀,得先去掉
        const realConv = String(conv).replace(/^local-/,"");
        const payload={conv:realConv, text:d.text, images:[]};
        await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
        if(realConv!==conv){ const c=S.convs.find(x=>x.conv===conv); if(c) c.conv=realConv; }
        loadConvs();
      }
    } else if(here && st && st.bubble){ voiceFail(st.bubble, d.error); }
  }catch(e){
    const st=S.voiceRec[conv]; delete S.voiceRec[conv];
    if(S.conv===conv && st && st.bubble) voiceFail(st.bubble, "转写失败:"+e.message);
  }
  REC.state="idle"; setRecUI();
}
// 转写没识别到内容:占位气泡改成"没听清"+重录按钮,绝不把空内容误发给 Claude
function voiceFail(b, msg){
  b.classList.remove("voicebub"); b.innerHTML="";
  const t=el("span","vfailtxt"); t.textContent="🎤 "+(msg||"没识别到内容,再说一次");
  const rb=el("button"); rb.type="button"; rb.className="vretry"; rb.textContent="重录";
  rb.onclick=()=>{ const row=b.closest(".row"); if(row) row.remove(); startRec(); };
  b.append(t, rb);
}
function insertToInput(t){
  const ta=$("#ta");
  ta.value = ta.value.trim() ? (ta.value.replace(/\s+$/,"")+" "+t) : t;
  autoGrow(); ta.focus();
}
$("#micBtn").onclick = ()=>{ if(REC.state==="idle") startRec(); };          // 麦克风:开录
$("#recSend").onclick = e=>{ e.stopPropagation(); if(REC.state==="recording") stopRec(false); }; // 右侧 ↑:完成并发送
$("#recCancel").onclick = e=>{ e.stopPropagation(); stopRec(true); };        // 左侧 ✕:取消
// 兜底:关页/切后台也释放一次,防止极端情况下(录音中直接切走)残留占用
window.addEventListener("pagehide", releaseMic);

// ── 新会话 / 侧边栏 ─────────────────────────────────────────────────────
$("#newBtn").onclick = newChat;
// 顶栏 ☰:桌面(收起态)= 展开侧边栏;移动端 = 抽屉式打开
function expandSidebarResponsive(){
  if(window.innerWidth>760){ setSidebarCollapsed(false); }
  else { $("#sidebar").classList.add("open"); $("#backdrop").classList.add("show"); }
  loadVoiceSidebar();  // 打开侧边栏时刷新语音后台任务(新派发的运行中任务也能及时出现在默认项目)
}
$("#hamb").onclick = expandSidebarResponsive;
$("#collapseBtn").innerHTML = ic("panel");
$("#hamb").innerHTML = ic("panel");
$("#collapseBtn").onclick = ()=> setSidebarCollapsed(true);   // 侧边栏内:收起
$("#backdrop").onclick = closeSidebar;
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("show"); }
// 桌面侧边栏折叠态(记忆到 localStorage)
function setSidebarCollapsed(v){
  document.body.classList.toggle("sb-collapsed", v);
  try{ localStorage.setItem("hermes_sb", v?"1":"0"); }catch(e){}
}


// ── 消息区 padding 自适应顶栏/输入框高度(两者 absolute 脱离流,需 padding 避开) ──
function _updateChromePad(){
  const h=document.querySelector('header.bar'), c=document.getElementById('composer'),
        m=document.getElementById('messages');
  if(h&&c&&m){ m.style.setProperty('--header-h',h.offsetHeight+'px');
    m.style.setProperty('--composer-h',c.offsetHeight+'px'); }
}
_updateChromePad();
new ResizeObserver(_updateChromePad).observe(document.querySelector('header.bar'));
new ResizeObserver(_updateChromePad).observe(document.getElementById('composer'));
// iOS 独立 PWA 首屏:safe-area 与字体都晚一拍才稳定,顶栏实测高会偏小,
// 第一条消息会钻进半透明顶栏下被盖住。多触发点重测让 --header-h 追上真实高度。
// (ResizeObserver 在 standalone 下有时不触发重排,故显式补齐。)
addEventListener("load", _updateChromePad);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(_updateChromePad);
addEventListener("orientationchange", ()=>{ _updateChromePad(); setTimeout(_updateChromePad,300); });
requestAnimationFrame(()=>requestAnimationFrame(_updateChromePad));  // 双帧:等首次布局落定
[120,400,800].forEach(t=>setTimeout(_updateChromePad,t));            // 延迟兜底:等 safe-area 稳定

// ── 键盘/视口自适应 ──────────────────────────────────────────────────────
// 把 #app 高度绑定到「可视视口」而非布局视口:键盘弹出时整体缩短,
// 输入框自动贴在键盘上方,既不被遮挡、间距也不会过大。
function fitViewport(){
  const vv = window.visualViewport; if(!vv) return;
  const st = document.documentElement.style;
  const kbOpen = (window.innerHeight - vv.height) > 120;  // 视口缩水超阈值 → 判定键盘弹出
  document.body.classList.toggle("kb", kbOpen);
  if(kbOpen){
    st.setProperty("--app-h", vv.height + "px");
    st.setProperty("--app-top", vv.offsetTop + "px");
    scrollDown(true);
  }else{
    // 键盘收起时交还布局视口(100%):iOS 独立 PWA 下 visualViewport 高度
    // 常偏小且不再触发 resize,固定绑定会在底部留一条空白
    st.removeProperty("--app-h");
    st.removeProperty("--app-top");
    // 视口回正后输入框会重新布局:重测其高度让 messages 底部让位量跟上,
    // 并把最后一条消息重新滚进可视区,避免收起后内容被输入框盖住。
    // iOS 独立 PWA 收起后布局晚一拍才稳定,再延迟兜底一次。
    _updateChromePad(); scrollDown(true);
    setTimeout(()=>{ _updateChromePad(); scrollDown(true); }, 80);
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
  fitViewport();
}

// ── 启动 ────────────────────────────────────────────────────────────────
try{ if(localStorage.getItem("hermes_sb")==="1") document.body.classList.add("sb-collapsed"); }catch(e){}
syncTheme();
if(S.token){ tryEnter(); } else { $("#pw").focus(); }
