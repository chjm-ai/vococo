// ── 会话搜索(⌘F / 侧栏放大镜)─────────────────────────────────────────
// 标题命中排前、正文其次,含归档会话;删除的会话已物理删除,天然搜不到。
// 输入 200ms 防抖走 /conv/search(个人规模 LIKE 全表扫描毫秒级,见 session_store)。
const SM = { seq:0, timer:null, results:[], sel:-1 };
const SM_HINT = '<div class="smempty">输入关键词,搜索所有会话的标题与内容(含已归档)</div>';
function openSearchModal(){
  $("#searchModal").hidden = false;
  const inp = $("#smInput");
  inp.value = ""; SM.results = []; SM.sel = -1;
  $("#smList").innerHTML = SM_HINT;
  inp.focus();
}
function closeSearchModal(){ $("#searchModal").hidden = true; }
// 手动拼 HTML:先转义再把命中段包 <b>,避免把会话内容当 HTML 注入
function smHl(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<b>" + esc(text.slice(i, i+q.length)) + "</b>" + esc(text.slice(i+q.length));
}
function renderSearchResults(q){
  const box = $("#smList"); box.innerHTML = "";
  if(!SM.results.length){ box.innerHTML = '<div class="smempty">没有匹配的会话</div>'; return; }
  SM.results.forEach((r, i)=>{
    const row = el("div","smrow" + (i===SM.sel?" sel":""));
    const t = el("div","smtitle");
    const name = el("span","t"); name.innerHTML = smHl(r.title||"新对话", q); t.append(name);
    if(r.archived){ const tag=el("span","smtag"); tag.textContent="已归档"; t.append(tag); }
    const tm = fmtTime(r.last_ts); if(tm){ const te=el("span","smtime"); te.textContent=tm; t.append(te); }
    row.append(t);
    if(r.snippet){ const sn=el("div","smsnip"); sn.innerHTML = smHl(r.snippet, q); row.append(sn); }
    row.onclick = ()=>{ closeSearchModal(); openConv(r.conv); };
    box.append(row);
  });
}
async function runConvSearch(){
  const q = $("#smInput").value.trim();
  const seq = ++SM.seq;   // 迟到的旧响应按序号丢弃,避免快速输入时结果错乱
  if(!q){ SM.results=[]; SM.sel=-1; $("#smList").innerHTML = SM_HINT; return; }
  try{
    const r = await api("/conv/search?q="+encodeURIComponent(q));
    const d = await r.json();
    if(seq !== SM.seq) return;
    SM.results = d.results||[]; SM.sel = SM.results.length ? 0 : -1;
    renderSearchResults(q);
  }catch(e){}
}
$("#smInput").oninput = ()=>{ clearTimeout(SM.timer); SM.timer = setTimeout(runConvSearch, 200); };
$("#smInput").onkeydown = e=>{
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    if(!SM.results.length) return;
    SM.sel = (SM.sel + (e.key==="ArrowDown"?1:-1) + SM.results.length) % SM.results.length;
    renderSearchResults($("#smInput").value.trim());
    const selEl = $("#smList").children[SM.sel];
    if(selEl) selEl.scrollIntoView({block:"nearest"});
  } else if(e.key==="Enter"){
    e.preventDefault();
    const r = SM.results[SM.sel]; if(r){ closeSearchModal(); openConv(r.conv); }
  } else if(e.key==="Escape"){ closeSearchModal(); }
};
$("#searchModal").onclick = e=>{ if(e.target.id==="searchModal") closeSearchModal(); };
$("#smHead").insertAdjacentHTML("afterbegin", ic("search"));
$("#searchBtn").innerHTML = ic("search");
$("#searchBtn").onclick = ()=>{ closeSidebar(); openSearchModal(); };
document.addEventListener("keydown", e=>{
  // ⌘F/Ctrl+F 接管浏览器页内查找:登录页不响应
  if((e.metaKey||e.ctrlKey) && !e.shiftKey && !e.altKey && (e.key==="f"||e.key==="F")){
    if($("#app").hidden) return;
    e.preventDefault(); openSearchModal();
  } else if(e.key==="Escape" && !$("#searchModal").hidden){ closeSearchModal(); }
});


// ── 消息区 padding 自适应顶栏/输入框高度(两者 absolute 脱离流,需 padding 避开) ──
function _updateChromePad(){
  const h=document.querySelector('header.bar'), c=document.getElementById('composer'),
        m=document.getElementById('messages');
  if(h&&c&&m){ m.style.setProperty('--header-h',h.offsetHeight+'px');
    m.style.setProperty('--composer-h',c.offsetHeight+'px'); }
}
_updateChromePad();
new ResizeObserver(_updateChromePad).observe(document.querySelector('header.bar'));
new ResizeObserver(_updateChromePad).observe(document.getElementById('composer'));
// iOS 独立 PWA 首屏:safe-area 与字体都晚一拍才稳定,顶栏实测高会偏小,
// 第一条消息会钻进半透明顶栏下被盖住。多触发点重测让 --header-h 追上真实高度。
// (ResizeObserver 在 standalone 下有时不触发重排,故显式补齐。)
addEventListener("load", _updateChromePad);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(_updateChromePad);
addEventListener("orientationchange", ()=>{ _updateChromePad(); setTimeout(_updateChromePad,300); });
requestAnimationFrame(()=>requestAnimationFrame(_updateChromePad));  // 双帧:等首次布局落定
[120,400,800].forEach(t=>setTimeout(_updateChromePad,t));            // 延迟兜底:等 safe-area 稳定

// ── 键盘/视口自适应 ──────────────────────────────────────────────────────
// 把 #app 高度绑定到「可视视口」而非布局视口:键盘弹出时整体缩短,
// 输入框自动贴在键盘上方,既不被遮挡、间距也不会过大。
function fitViewport(){
  const vv = window.visualViewport; if(!vv) return;
  const st = document.documentElement.style;
  const kbOpen = (window.innerHeight - vv.height) > 120;  // 视口缩水超阈值 → 判定键盘弹出
  document.body.classList.toggle("kb", kbOpen);
  if(kbOpen){
    st.setProperty("--app-h", vv.height + "px");
    st.setProperty("--app-top", vv.offsetTop + "px");
    scrollDown(true);
  }else{
    // 键盘收起时交还布局视口(100%):iOS 独立 PWA 下 visualViewport 高度
    // 常偏小且不再触发 resize,固定绑定会在底部留一条空白
    st.removeProperty("--app-h");
    st.removeProperty("--app-top");
    // 视口回正后输入框会重新布局:重测其高度让 messages 底部让位量跟上,
    // 并把最后一条消息重新滚进可视区,避免收起后内容被输入框盖住。
    // iOS 独立 PWA 收起后布局晚一拍才稳定,再延迟兜底一次。
    _updateChromePad(); scrollDown(true);
    setTimeout(()=>{ _updateChromePad(); scrollDown(true); }, 80);
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
  fitViewport();
}

// ── 启动 ────────────────────────────────────────────────────────────────
try{ if(localStorage.getItem("hermes_sb")==="1") document.body.classList.add("sb-collapsed"); }catch(e){}
syncTheme();
if(S.token){ tryEnter(); } else { $("#pw").focus(); }
</script>
</body>
