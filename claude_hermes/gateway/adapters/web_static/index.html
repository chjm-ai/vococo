<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#181716">
<title>Wazir</title>
<!-- PWA:装到主屏 + Web Push 系统通知 -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/svg+xml" href="/wazir-mark.svg?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<!-- 防闪烁:渲染前先套用上次选择的主题 -->
<script>(function(){try{var t=localStorage.getItem("hermes_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  /* ── 深色(默认)· Claude Code 暖炭灰 + 赤陶橙 ────────────────────────── */
  :root{
    --bg:#181716; --bg2:#1c1b19; --panel:#252320; --panel2:#302f2c; --card:#2b2a27;
    --line:#3a3934; --line2:#4a4941;
    --text:#ecebe3; --dim:#a5a094; --dim2:#716d61;
    --accent:#d97757; --accent2:#c8613f;
    --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
    --ok:#5aa469; --err:#d1674a; --radius:16px;
    --bar-bg:rgba(28,27,25,.72);
    --login-bg:radial-gradient(120% 90% at 50% -10%,#252320 0%,#1c1b19 60%);
    --code-bg:#22211e; --code-fg:#d4d0c4; --code-inline:rgba(180,170,150,.15);
    --scroll:#3a3934; --scroll-h:#4a4941;
    --bubble-shadow:0 1px 2px rgba(0,0,0,.24);
    --shadow:0 10px 34px rgba(0,0,0,.45);
    --focus-ring:rgba(217,119,87,.2);
    --glow1:rgba(217,119,87,.4); --glow2:rgba(194,95,60,.4);
  }
  /* ── 浅色:系统偏好浅色且用户未手动固定时 · Claude Code 暖米色 ────────── */
  @media(prefers-color-scheme:light){
    :root:not([data-theme]){
      --bg:#ffffff; --bg2:#ffffff; --panel:#f7f7f7; --panel2:#eeeeee; --card:#ffffff;
      --line:#e5e5e5; --line2:#d8d8d8;
      --text:#29261f; --dim:#6d6757; --dim2:#9a9482;
      --accent:#bd5d3a; --accent2:#a84e2f;
      --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
      --bar-bg:rgba(255,255,255,.8);
      --login-bg:radial-gradient(120% 90% at 50% -10%,#f5f5f5 0%,#ffffff 60%);
      --code-bg:#f5f5f5; --code-fg:#3a362c; --code-inline:rgba(0,0,0,.06);
      --scroll:#d8d8d8; --scroll-h:#c4c4c4;
      --bubble-shadow:0 1px 2px rgba(0,0,0,.05);
      --shadow:0 10px 34px rgba(0,0,0,.08);
      --focus-ring:rgba(189,93,58,.16);
      --glow1:rgba(217,119,87,.3); --glow2:rgba(189,93,58,.28);
    }
  }
  /* ── 手动固定浅色 ────────────────────────────────────────────────────── */
  :root[data-theme="light"]{
    --bg:#ffffff; --bg2:#ffffff; --panel:#f7f7f7; --panel2:#eeeeee; --card:#ffffff;
    --line:#e5e5e5; --line2:#d8d8d8;
    --text:#29261f; --dim:#6d6757; --dim2:#9a9482;
    --accent:#bd5d3a; --accent2:#a84e2f;
    --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
    --bar-bg:rgba(255,255,255,.8);
    --login-bg:radial-gradient(120% 90% at 50% -10%,#f5f5f5 0%,#ffffff 60%);
    --code-bg:#f5f5f5; --code-fg:#3a362c; --code-inline:rgba(0,0,0,.06);
    --scroll:#d8d8d8; --scroll-h:#c4c4c4;
    --bubble-shadow:0 1px 2px rgba(0,0,0,.05);
    --shadow:0 10px 34px rgba(0,0,0,.08);
    --focus-ring:rgba(189,93,58,.16);
    --glow1:rgba(217,119,87,.3); --glow2:rgba(189,93,58,.28);
  }
  /* data-theme="dark" 用根默认值即可,无需重复 */

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg2);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background-color .3s ease,color .3s ease}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:var(--accent)}

  /* 美化滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* 登录 */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--login-bg);z-index:50;padding:24px}
  #login .card{width:100%;max-width:340px;text-align:center;animation:pop .4s ease}
  #login .logo{width:68px;height:68px;margin:0 auto 16px;color:var(--text);
    display:flex;align-items:center;justify-content:center}
  #login .logo svg{width:100%;height:100%}
  #login h1{font-size:30px;margin:0 0 6px;letter-spacing:1px;font-weight:600;
    font-family:ui-serif,Georgia,"Times New Roman","Songti SC",serif}
  #login p{color:var(--dim);margin:0 0 26px;font-size:14px}
  #login input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);
    background:var(--card);color:var(--text);font-size:16px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
  #login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  #login button{width:100%;padding:15px;border-radius:14px;
    background:linear-gradient(135deg,var(--user1),var(--user2));color:#fff;font-weight:600;font-size:16px;
    transition:transform .12s,box-shadow .2s;box-shadow:0 4px 16px var(--glow2)}
  #login button:active{transform:scale(.97)}
  #login .err{color:var(--err);font-size:13px;height:18px;margin-top:10px}

  /* 布局 */
  #app{display:flex;overflow:hidden;
    position:fixed;top:var(--app-top,0);left:0;right:0;bottom:0;height:var(--app-h,auto)}
  #sidebar{width:280px;flex-shrink:0;background:var(--bg2);
    border:1px solid var(--line);border-radius:16px;
    margin:8px 0 8px 8px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    display:flex;flex-direction:column;overflow:hidden;
    transition:transform .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1),margin .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;z-index:30}
  #sidebar .shead{padding:12px 14px 6px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
  #sidebar .shead .brand{flex:1;font-family:ui-serif,Georgia,"Times New Roman","Songti SC",serif;
    font-size:20px;font-weight:700;color:var(--text)}
  /* 列表行统一规范:所有可点行(＋新对话 / 分组头 / 会话)共用同一内边距 + 圆角,
     hover 的灰底矩形尺寸与圆角完全一致 */
  #convList{flex:1;overflow-y:auto;padding:2px 8px 8px}
  .projgrp,.conv{padding:7px 10px;border-radius:7px;display:flex;align-items:center;
    cursor:pointer;transition:background .15s,color .15s}
  .projgrp:hover,.conv:hover,.conv.active{background:var(--panel2)}
  /* ＋新对话:填充按钮、宽度撑满(左右与列表内边距对齐) */
  #newBtn{display:flex;align-items:center;justify-content:center;gap:8px;
    width:calc(100% - 16px);margin:2px 8px 4px;padding:8px 10px;border-radius:9px;
    background:var(--panel2);color:var(--text);font-size:13px;font-weight:600;
    cursor:pointer;transition:background .15s,transform .12s}
  #newBtn .np{font-size:14px;line-height:1}
  #newBtn:hover{background:var(--card)}
  #newBtn:active{transform:scale(.98)}
  /* 侧边栏收起按钮(仅桌面显示)*/
  #collapseBtn{display:none;width:26px;height:26px;border-radius:7px;flex-shrink:0;
    align-items:center;justify-content:center;color:var(--dim);
    transition:background .16s,color .16s,transform .12s}
  #collapseBtn:hover{background:var(--panel2);color:var(--text)}
  #collapseBtn:active{transform:scale(.9)}
  #collapseBtn .ic{width:16px;height:16px}
  .conv{margin-bottom:1px;gap:8px;color:var(--dim);position:relative}
  .conv:hover,.conv.active{color:var(--text)}
  .conv .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .conv .livedot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:livepulse 1.2s infinite}   /* AI 正在回复:闪烁圆点 */
  @keyframes livepulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .conv .ctime{flex-shrink:0;color:var(--dim2);font-size:10px;font-variant-numeric:tabular-nums;transition:opacity .16s}  /* 会话时刻:名称右侧 */
  .conv .star{flex-shrink:0;color:var(--dim2);font-size:10px;transition:opacity .16s}   /* 主会话:弱化星标 */
  /* 「⋯」更多键绝对定位:不占布局宽度,hover 时浮现 */
  .conv .more{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;
    font-size:16px;line-height:1;color:var(--dim2);padding:2px 6px;border-radius:7px;transition:opacity .16s,color .16s,background .16s}
  .conv:hover .star,.conv:hover .ctime{opacity:0}
  .conv:hover .more{opacity:.6;pointer-events:auto}
  .conv .more:hover,.conv .more.on{color:var(--text);background:var(--card);opacity:1}
  /* 触屏无 hover:默认只显示时间、「⋯」不可见(保持行整洁);
     但「⋯」区域仍可点(pointer-events:auto)弹菜单——用 opacity 而非 :active,
     不改变按下时的外观,故不会吞掉首次点击(点两下才切换的经典坑) */
  @media(hover:none){ .conv .more{opacity:0;pointer-events:auto} }
  /* 会话「更多」浮层菜单(挂在 body 上,避开侧栏 overflow 裁剪) */
  .convmenu{position:fixed;z-index:40;min-width:130px;
    background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:5px;
    box-shadow:var(--shadow);animation:pop .14s ease}
  .convmenu .cmitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--text);transition:background .14s}
  .convmenu .cmitem:hover{background:var(--panel2)}
  .convmenu .cmitem.danger{color:var(--err)}
  .convmenu .cmitem.danger:hover{background:rgba(209,103,74,.12)}
  /* 侧栏底部会话筛选下拉(挂在状态栏「设置」左侧,弹层朝上开) */
  #convFilterBox{position:relative}
  #convFilterPop{position:absolute;bottom:calc(100% + 4px);right:0;min-width:120px;z-index:40;
    background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:5px;
    box-shadow:var(--shadow);animation:pop .14s ease}
  #convFilterPop[hidden]{display:none}
  #convFilterPop .fmi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--text);transition:background .14s}
  #convFilterPop .fmi:hover{background:var(--panel2)}
  #convFilterPop .fmi.on{color:var(--accent);font-weight:600}
  .sfoot{padding:9px 12px 9px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--text);display:flex;align-items:center;gap:9px}
  .sfoot .savatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--user2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:700;letter-spacing:0}
  .sfoot .sfoottxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  /* 限额状态弹层 */
  #ratePop{position:fixed;z-index:45;min-width:260px;max-width:320px;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);animation:pop .18s ease}
  #ratePop[hidden]{display:none}
  #ratePop .rphead{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:14px;font-weight:600}
  #ratePop .rphead .rpd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  #ratePop .rphead .rpd.ok{background:var(--ok)}
  #ratePop .rphead .rpd.warn{background:#d9a43a}
  #ratePop .rphead .rpd.err{background:var(--err)}
  #ratePop .rpbody{font-size:13px;color:var(--dim);line-height:1.55}
  #ratePop .rpbody .rptime{font-size:11.5px;color:var(--dim2);margin-top:6px}
  /* 出错气泡:红色左边框 */
  .bubble.err{border-left:3px solid var(--err);padding-left:11px}
  /* 设置入口:状态栏最右一个齿轮图标 */
  .sfoicon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);transition:background .16s,color .16s}
  .sfoicon:hover{background:var(--panel2);color:var(--text)}
  .sfoicon:active{transform:scale(.9)}
  .sfoicon .ic{width:17px;height:17px;vertical-align:0}

  /* 项目分组(手风琴;行的内边距/圆角走上面的统一规范) */
  .projgrp{gap:6px;margin-top:2px;color:var(--dim);font-size:13px;font-weight:600;user-select:none}
  .projgrp:hover{color:var(--text)}
  .projgrp .pgcaret{margin-right:auto;color:var(--dim2)}  /* chevron 紧跟名称(间距走 projgrp 的 gap:6px),auto 外边距把按钮推到最右 */
  .projgrp .pgname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim2)}
  .projgrp .pgadd,.projgrp .pgmore{flex-shrink:0;opacity:0;background:none;border:none;cursor:pointer;
    color:var(--dim2);font-size:13px;padding:1px 5px;border-radius:6px;line-height:1}
  .projgrp:hover .pgadd,.projgrp:hover .pgmore{opacity:.6}
  .projgrp .pgadd:hover{opacity:1;color:var(--text);background:var(--card)}
  .projgrp .pgmore:hover,.projgrp .pgmore.on{opacity:1;color:var(--text);background:var(--card)}
  .projgrp.projadd{color:var(--dim2);font-weight:600;margin-top:4px}   /* 黑灰、无分割线、与分组同款行 */
  /* 项目拖拽排序:可拖起手型,拖起半透明,悬停目标高亮上边框示意插入位置 */
  .projgrp[draggable="true"]{cursor:grab}
  .projgrp.dragging{opacity:.4}
  .projgrp.dragover{box-shadow:inset 0 2px 0 var(--accent)}
  .conv.ingroup{margin-left:12px}   /* 分组下的会话缩进,体现层级 */

  /* 新建项目弹窗(服务端目录浏览器) */
  #projModal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #projModal[hidden]{display:none}   /* id+attr 优先级压过上面的 display:flex,hidden 才真生效 */
  #projModal .pmbox{width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
  #projModal .pmhead{padding:15px 18px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line)}
  #projModal .pmpathrow{display:flex;gap:8px;padding:12px 16px}
  #pmPath{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;
    color:var(--text);padding:8px 11px;font-size:13px}
  #projModal .pmgo{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:0 14px;cursor:pointer}
  #pmList{flex:1;overflow-y:auto;padding:4px 10px;min-height:120px}
  .pmrow{padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmrow:hover{background:var(--panel2)}
  .pmrow.pmup{color:var(--dim2)}
  #projModal .pmfoot{display:flex;gap:10px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line)}
  #projModal .pmfoot button{padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
  #projModal .pmfoot .pmok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* 设置弹窗 */
  #setModal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #setModal[hidden]{display:none}
  .setbox{width:min(820px,94vw);height:min(660px,88vh);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
  .sethead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sethead .settitle{flex:1;font-size:16px;font-weight:700}
  .setclose{width:32px;height:32px;border-radius:9px;color:var(--dim);font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:background .16s,color .16s}
  .setclose:hover{background:var(--panel2);color:var(--text)}
  .setbody{flex:1;display:flex;min-height:0}
  .settabs{flex-shrink:0;width:132px;padding:12px 10px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .settab{text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--dim);
    transition:background .15s,color .15s}
  .settab:hover{background:var(--panel2);color:var(--text)}
  .settab.active{background:var(--panel2);color:var(--text);font-weight:600}
  .setpane{flex:1;overflow-y:auto;padding:18px 20px;min-width:0}

  /* 分区标题 + 说明 */
  .setpane h3{margin:0 0 4px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .setpane h3 .ic{width:16px;height:16px;color:var(--accent)}
  .setpane .shint{margin:0 0 14px;font-size:12.5px;color:var(--dim);line-height:1.55}
  .setpane .sechd{margin:20px 0 8px;font-size:12px;font-weight:700;color:var(--dim2);
    text-transform:uppercase;letter-spacing:.5px}

  /* 开关(switch) */
  .sw{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .track{position:absolute;inset:0;background:var(--line2);border-radius:22px;transition:background .2s;cursor:pointer}
  .sw .track::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;
    background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sw input:checked + .track{background:var(--accent)}
  .sw input:checked + .track::before{transform:translateX(16px)}

  /* 行:一条设置项(左内容 + 右开关) */
  .srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow .sinfo{flex:1;min-width:0}
  .srow .sname{font-size:14px;font-weight:600;color:var(--text);word-break:break-word}
  .srow .sdesc{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srow .sacts{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .srow .miniact{font-size:12px;color:var(--dim);padding:3px 7px;border-radius:7px;transition:background .15s,color .15s;white-space:nowrap}
  .srow .miniact:hover{background:var(--panel2);color:var(--text)}
  .srow .miniact.on{color:var(--accent)}
  .srow .miniact.danger:hover{color:var(--err);background:rgba(209,103,74,.12)}
  .srow.off .sname{color:var(--dim)}

  /* 技能搜索框 + 计数 */
  .skbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sksearch{flex:1;display:flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:9px;padding:7px 11px}
  .sksearch .ic{width:15px;height:15px;color:var(--dim2)}
  .sksearch input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:13.5px}
  .skcount{font-size:12px;color:var(--dim2);white-space:nowrap}

  /* 通用按钮 */
  .btn{padding:8px 14px;border-radius:9px;font-size:13.5px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--card)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:none;border-color:var(--line2)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .setrowbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}

  /* 外部 MCP 添加表单 */
  .mcpform{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  .mcpform .fld{margin-bottom:10px}
  .mcpform .fld:last-child{margin-bottom:0}
  .mcpform label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .mcpform input,.mcpform textarea,.mcpform select{width:100%;background:var(--panel2);
    border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:8px 11px;font-size:13.5px;
    font-family:inherit}
  .mcpform textarea{resize:vertical;min-height:52px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .mcpform input:focus,.mcpform textarea:focus,.mcpform select:focus{outline:none;border-color:var(--accent)}
  .mcperr{color:var(--err);font-size:12.5px;margin-top:8px;min-height:16px}
  .mcptag{display:inline-block;font-size:11px;color:var(--dim2);border:1px solid var(--line2);
    border-radius:6px;padding:1px 6px;margin-left:8px;font-family:ui-monospace,Menlo,monospace}

  /* 文件列表 + 编辑器(记忆 / 人设) */
  .frow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .15s}
  .frow:hover .fname{color:var(--accent)}
  .frow .ic{width:16px;height:16px;color:var(--dim);flex-shrink:0}
  .frow .fname{flex:1;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .frow .fmiss{font-size:11px;color:var(--dim2)}
  .frow .fchev{color:var(--dim2);font-size:15px}
  .feditor{display:flex;flex-direction:column;height:100%}
  .feditor .fetop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .feditor .feback{font-size:13px;color:var(--dim);padding:5px 9px;border-radius:8px;transition:background .15s,color .15s}
  .feditor .feback:hover{background:var(--panel2);color:var(--text)}
  .feditor .fepath{flex:1;font-size:13px;font-weight:600;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feditor textarea{flex:1;width:100%;background:var(--code-bg);color:var(--code-fg);
    border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:13px;line-height:1.6;
    font-family:ui-monospace,Menlo,monospace;resize:none;outline:none}
  .feditor textarea:focus{border-color:var(--accent)}
  .fesave{display:flex;align-items:center;gap:10px;margin-top:12px}
  .fesave .festat{font-size:12.5px;color:var(--dim);flex:1}
  .fesave .festat.ok{color:var(--ok)}
  .setempty{text-align:center;color:var(--dim2);font-size:13px;padding:30px 10px}
  .setload{text-align:center;color:var(--dim2);font-size:13px;padding:24px}

  /* 外观:主题分段选择器 */
  .theme-seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;width:fit-content;margin-top:4px}
  .theme-seg .tsopt{padding:9px 20px;font-size:13.5px;color:var(--dim);transition:background .15s,color .15s;border-right:1px solid var(--line2)}
  .theme-seg .tsopt:last-child{border-right:none}
  .theme-seg .tsopt:not(.active):hover{background:var(--panel2);color:var(--text)}
  .theme-seg .tsopt.active{background:var(--accent);color:#fff;font-weight:600;cursor:default}

  @media(max-width:640px){
    .setbox{width:100vw;height:100%;max-height:100%;border-radius:0;border:none}
    .sethead{padding-top:calc(14px + env(safe-area-inset-top))}
    .setbody{flex-direction:column}
    .settabs{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);
      padding:8px 10px;gap:6px;overflow-x:auto}
    .settab{white-space:nowrap;flex-shrink:0}
    .setpane{padding:16px}
  }

  /* 主区 */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg2);overflow:hidden}
  header.bar{padding:11px 32px;
    padding-top:calc(11px + env(safe-area-inset-top));
    background:var(--bar-bg);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);position:absolute;top:0;left:0;right:0;z-index:10;
    transition:transform .35s cubic-bezier(.4,0,.2,1)}
  header.bar .barwrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:var(--dim);flex-shrink:0;transition:background .16s,color .16s}
  .icon:hover{background:var(--panel2);color:var(--text)}
  .icon:active{transform:scale(.92)}
  header.bar .title{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
  header.bar .title #convTitle{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.bar .title .tsub{display:flex;align-items:center;gap:8px;min-width:0}
  #gitBox{position:relative;flex-shrink:0}
  .tgit{font-size:10.5px;color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums;
    background:var(--panel2);border-radius:7px;padding:1.5px 7px;max-width:190px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .16s,color .16s}
  .tgit:hover{color:var(--text)}
  .tgit.dirty{color:var(--accent)}
  .tgit[hidden]{display:none}
  /* Git 状态弹层 */
  #gitPop{position:absolute;top:calc(100% + 8px);left:0;width:288px;z-index:20;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);animation:pop .18s ease}
  #gitPop[hidden]{display:none}
  #gitPop .gph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  #gitPop .gbr{font-size:13px;font-weight:600;color:var(--accent)}
  #gitPop .gah{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #gitPop .gsub{font-size:11px;color:var(--dim2);word-break:break-all;margin-bottom:10px;
    font-family:ui-monospace,Menlo,monospace}
  #gitPop .gclean{font-size:12.5px;color:var(--dim);padding:2px 0 4px}
  #gitPop .gfiles{max-height:180px;overflow:auto;margin-bottom:8px;
    border-top:1px solid var(--line);padding-top:6px}
  #gitPop .gf{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:2px 0}
  #gitPop .gf .gx{flex-shrink:0;width:20px;color:var(--accent);font-family:ui-monospace,Menlo,monospace}
  #gitPop .gf .gp{color:var(--text);word-break:break-all}
  #gitPop .gnew{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px}
  #gitPop .gnew input{flex:1;min-width:0;font-size:12.5px;padding:6px 9px;border-radius:8px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
  #gitPop .gnew button{flex-shrink:0;font-size:12px;padding:6px 11px;border-radius:8px;
    background:var(--accent);color:#fff;font-weight:500;transition:opacity .16s}
  #gitPop .gnew button:disabled{opacity:.55}
  #gitPop .gerr{font-size:12px;color:var(--err);margin-top:8px}
  #gitPop .gerr[hidden]{display:none}
  #gitPop .gempty{font-size:12.5px;color:var(--dim)}
  #ctxBox{position:relative;flex-shrink:0}
  #barMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);
    font-weight:500;font-variant-numeric:tabular-nums;padding:5px 9px;border-radius:9px;transition:background .16s}
  #barMeta:hover{background:var(--panel2)}
  #barMeta[hidden]{display:none}
  #barMeta .ctxring{width:20px;height:20px;flex-shrink:0}
  #barMeta .ctxring .track{fill:none;stroke:var(--panel2);stroke-width:2.5}
  #barMeta .ctxring .fill{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .45s ease,stroke .3s}
  #barMeta.warn .ctxring .fill{stroke:var(--err)}
  #barMeta.warn #ctxPct{color:var(--err)}
  /* 上下文明细弹层(默认收起,点进度条展开)*/
  #ctxPop{position:absolute;top:calc(100% + 8px);right:0;width:248px;z-index:20;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);animation:pop .18s ease;font-variant-numeric:tabular-nums}
  #ctxPop[hidden]{display:none}
  #ctxPop .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
  #ctxPop .ph .t{font-size:12px;color:var(--dim)}
  #ctxPop .ph .m{font-size:13px;font-weight:600}
  #ctxPop .ph .m b{color:var(--accent)}
  #ctxPop.warn .ph .m b{color:var(--err)}
  #ctxPop .pbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-bottom:11px}
  #ctxPop .pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--user2))}
  #ctxPop.warn .pbar i{background:var(--err)}
  #ctxPop .pr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:4.5px 0;color:var(--text)}
  #ctxPop .pr .k{color:var(--dim)}
  #ctxPop .pr .v .pp{color:var(--dim2);margin-left:5px}
  #ctxPop .pr.sub .k{padding-left:12px;color:var(--dim2);font-size:12px}
  #ctxPop .pr.sep{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  #ctxPop .pr .mdl{font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
  /* 上下文明细弹层里的会话 ID */
  #ctxPop .convid{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
  #ctxPop .convid .k{color:var(--dim);flex-shrink:0}
  #ctxPop .convid .idv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;color:var(--text)}
  #ctxPop .convid .cpy{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim2);transition:background .15s,color .15s;flex-shrink:0}
  #ctxPop .convid .cpy:hover{background:var(--panel2);color:var(--text)}
  #hamb{display:none;width:42px;height:42px;font-size:21px;border-radius:13px}
  #hamb .ic{width:19px;height:19px}

  #messages{flex:1;overflow-y:auto;padding:18px 32px 8px;
    /* JS 实测到就用精确顶栏高;没测到(或时机太早)时兜底也要含顶部安全区,
       否则刘海机上第一条消息会钻进半透明顶栏。max 取两者较大者,双保险。 */
    padding-top:calc(18px + max(var(--header-h, 0px), 62px + env(safe-area-inset-top)));
    padding-bottom:calc(8px + var(--composer-h, 104px));
    -webkit-overflow-scrolling:touch;position:relative;
    transition:padding .35s cubic-bezier(.4,0,.2,1)}
  #scrollDownBtn{position:fixed;bottom:calc(16px + var(--composer-h, 104px));right:24px;z-index:50;
    width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);
    color:var(--dim);font-size:18px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .2s,transform .2s;
    opacity:0;transform:translateY(8px);pointer-events:none}
  #scrollDownBtn.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #scrollDownBtn:hover{background:var(--hover);color:var(--text)}
  .wrap{max-width:820px;margin:0 auto}
  .row{display:flex;margin:10px 0;animation:pop .32s cubic-bezier(.2,.7,.3,1)}
  .row.me{justify-content:flex-end}
  .row.ai{display:block;margin:0}
  .row.sys{justify-content:center}
  .row.sys .sysnote{font-size:12px;color:var(--dim2);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:5px 14px;max-width:90%;text-align:center}
  .bubble{max-width:86%;padding:10px 14px;border-radius:var(--radius);white-space:normal;word-wrap:break-word;
    overflow-wrap:anywhere;box-shadow:var(--bubble-shadow)}
  .row.me .bubble{background:linear-gradient(135deg,var(--user1),var(--user2));color:var(--on-user);border-bottom-right-radius:6px}
  .row.ai .bubble{background:transparent;border-radius:var(--radius);max-width:100%;margin:4px 0 10px;display:block;box-shadow:none;padding:0}
  .bubble.pending{color:var(--dim)}
  .status{font-size:12px;color:var(--dim);margin:0;display:flex;flex-wrap:wrap;gap:4px 12px}
  .status .chip{display:inline-flex;align-items:center}
  .status .chip.live{color:var(--accent)}
  .status .statusstop{margin-left:auto;flex-shrink:0;width:24px;height:24px;border-radius:50%;
    background:var(--err);color:#fff;font-size:11px;line-height:1;display:inline-flex;
    align-items:center;justify-content:center;cursor:pointer;border:none}
  .status .statusstop:hover{filter:brightness(1.1)}
  .status .statusstop:active{transform:scale(.9)}
  .status .statusstop .sq{width:9px;height:9px;border-radius:2px;background:#fff}
  .dots{display:inline-flex;gap:3px;margin-left:5px;align-items:center}
  .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.28;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.28} 30%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .think{font-size:13px;color:var(--dim);border-left:2px solid var(--line2);padding:2px 0 2px 10px;margin-bottom:8px;
    white-space:pre-wrap;max-height:140px;overflow:auto;display:none}
  .think.show{display:block}
  .thinktog{font-size:12px;color:var(--accent);margin-bottom:6px;display:none;align-items:center;gap:6px;cursor:pointer;user-select:none}

  /* markdown */
  .bubble p{margin:.5em 0}
  .bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:.7em 0 .4em;line-height:1.3}
  .bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3{font-size:1.08em}
  .bubble ul,.bubble ol{margin:.4em 0;padding-left:1.3em}
  .bubble li{margin:.2em 0}
  .bubble code{background:var(--code-inline);padding:.12em .4em;border-radius:6px;font-size:.9em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .row.me code{background:rgba(255,255,255,.2)}
  .bubble pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    overflow-x:auto;margin:.6em 0}
  .bubble pre.code code{background:none;padding:0;font-size:.86em;line-height:1.5;color:var(--code-fg)}
  .bubble blockquote{margin:.5em 0;padding:.2em .9em;border-left:3px solid var(--accent2);color:var(--dim)}
  .bubble table{border-collapse:collapse;margin:.6em 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
  .bubble th,.bubble td{border:1px solid var(--line);padding:7px 11px;text-align:left}
  .bubble th{background:var(--panel2);font-weight:600}
  .bubble a{word-break:break-all}
  .bubble img{max-width:100%;border-radius:10px}
  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .imgs img{width:120px;height:120px;object-fit:cover;border-radius:10px}

  /* 选择/审批面板:复刻 Claude Code TUI —— 选项竖排带编号,选中项左侧 ❯ + 整行高亮条,其余置灰。
     外框由所在的工具卡(审批)或气泡(/model)提供,这里只负责排选项 */
  .choice{margin:6px 0 2px}
  .choice .opts{display:flex;flex-direction:column}
  .choice button{appearance:none;border:0;background:transparent;color:var(--fg);width:100%;
    display:flex;align-items:baseline;gap:7px;padding:10px 12px;font-size:14px;line-height:1.45;
    border-radius:8px;text-align:left;cursor:pointer;transition:background .12s,color .12s,opacity .12s}
  .choice button .arw{flex:0 0 10px;color:var(--accent);opacity:0;font-weight:700}
  .choice button .num{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .choice button .lbl{flex:1;min-width:0}
  .choice button:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .choice button:active:not(:disabled){background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .choice button.selected{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:600}
  .choice button.selected .arw{opacity:1}
  .choice button.selected .num{color:var(--accent)}
  .choice button.dimmed{opacity:.4}
  .choice button:disabled{pointer-events:none}

  /* 工具卡片:diff / todo 清单 / 计划卡 / 命令预览(复刻 Claude Code 的结构化过程) */
  /* flow:一轮回复的过程区 —— 文字段与工具卡按真实顺序交错排列(像 Claude Code) */
  .flow{display:flex;flex-direction:column;gap:2px}
  .flow>.seg{margin:2px 0}
  .compactline{font-size:12px;color:var(--dim);margin:6px 0;display:flex;align-items:center;gap:8px}
  .compactline::before,.compactline::after{content:"";flex:1;border-top:1px dashed var(--dim);opacity:.4}
  .toolbox{display:flex;flex-direction:column;gap:2px;margin:4px 0}
  /* 工具卡:无边框,默认收起成 1 行,点头部展开(复刻 Claude Code 的简洁风) */
  .toolcard{font-size:13px}
  .tc-head{padding:3px 6px;border-radius:6px;font-weight:400;font-size:12.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim);
    display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .tc-head:hover{background:var(--panel2)}
  .tc-head.tc-warn{color:var(--text);cursor:default;background:var(--panel2);font-weight:600}
  .tc-head.err{color:#d94f4f}                                               /* 工具出错:整行标红 */
  .tc-head .tc-path{color:var(--dim2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .tc-body{padding:5px 6px 7px 24px}                                        /* 展开区:左缩进对齐标题文字 */
  .tc-body.collapsed{display:none}
  .tc-sep{height:7px;margin:0}                                               /* 展开区内:入参与结果之间的间距，无线 */
  .tc-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;
    background:var(--code-bg);color:var(--code-fg);padding:7px 9px;border-radius:7px;line-height:1.5}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;line-height:1.55;
    border-radius:7px;overflow:hidden}
  .diff .ln{display:block;padding:0 8px}
  .diff .del{background:rgba(248,81,73,.12)}
  .diff .add{background:rgba(63,185,80,.13)}
  .diff .del::before{content:"− ";opacity:.8;color:#f85149}
  .diff .add::before{content:"+ ";opacity:.8;color:#3fb950}
  .todo{list-style:none;margin:0;padding:0;font-size:13px}
  .todo li{padding:3px 0;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
  .todo li.done{opacity:.5;text-decoration:line-through}
  .todo li.doing{font-weight:600;color:var(--accent)}
  .plan{font-size:13.5px;line-height:1.6}
  .plan h1,.plan h2,.plan h3{font-size:14.5px;margin:.5em 0 .3em}
  /* 工具结果:折进展开区里的输出块(不再单独占一行) */
  .tc-res-body{margin:0;padding:7px 9px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    white-space:pre-wrap;word-break:break-all;line-height:1.5;background:var(--code-bg);color:var(--code-fg);
    border-radius:6px;max-height:340px;overflow-y:auto}
  /* Task 卡片内的子代理实时动态(工具步数 chips):始终可见,随标题缩进 */
  .tc-sub{padding:2px 6px 2px 24px;display:flex;flex-wrap:wrap;gap:4px 10px;
    font-size:11.5px;color:var(--dim2);align-items:center}
  .tc-sub:empty{display:none}

  /* 切会话 loading 骨架屏 */
  #convLoading{display:none;padding:20px 32px;flex-direction:column;gap:14px}
  #convLoading.on{display:flex}
  .skel{border-radius:14px;animation:skelshine 1.2s ease-in-out infinite}
  .skel.ai{align-self:flex-start;height:54px;width:68%;background:var(--panel2)}
  .skel.me{align-self:flex-end;height:36px;width:44%;background:var(--user1);opacity:.35}
  .skel.ai2{align-self:flex-start;height:80px;width:75%;background:var(--panel2)}
  @keyframes skelshine{0%,100%{opacity:.45}50%{opacity:.85}}

  /* 空状态 / 欢迎屏 */
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:none}
  #empty .elogo{width:76px;height:76px;margin-bottom:18px;color:var(--text);
    display:flex;align-items:center;justify-content:center;animation:pop .5s ease}
  #empty .elogo svg{width:100%;height:100%}
  #empty h2{margin:0 0 6px;font-size:24px;font-weight:600;
    font-family:ui-serif,Georgia,"Times New Roman","Songti SC",serif}
  #empty p{margin:0 0 24px;color:var(--dim);font-size:14px}
  #empty .sugs{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:440px;pointer-events:auto}
  #empty .sug{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 16px;font-size:14px;
    color:var(--text);transition:background .16s,border-color .16s,transform .12s}
  #empty .sug:hover{border-color:var(--accent)}
  #empty .sug:active{transform:scale(.96)}

  /* 输入区:全透明,桌面端底部留间距 */
  #composer{background:transparent;padding:0 32px;
    position:absolute;bottom:0;left:0;right:0;z-index:10;
    transition:transform .35s cubic-bezier(.4,0,.2,1)}
  @media(min-width:641px){
    #composer{padding-bottom:12px}
  }
  /* 顶栏始终可见,输入框不随滚动隐藏 */
  #composer .cwrap{max-width:820px;margin:0 auto}
/* 输入框底部工具条:左=上传,右=模型 + 发送 */
  .inbar{display:flex;align-items:center;gap:4px;margin-top:2px}
  .inbar .spacer{flex:1}
  /* 模型选择器(发送按钮左侧,无边框)*/
  #modelBox{position:relative}
  #modelBtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);font-weight:500;
    padding:6px 8px;border-radius:9px;max-width:150px;transition:color .16s,background .16s,transform .12s}
  #modelBtn #modelName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #modelBtn:hover{color:var(--text);background:var(--panel2)}
  #modelBtn:active{transform:scale(.96)}
  /* 折线箭头(chevron):border 描边 + 旋转,替代实心三角,略大;默认指向右,.down 转朝下 */
  .chev{flex-shrink:0;width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;
    transform:translateX(-1px) rotate(-45deg);transition:transform .15s}   /* 收起:朝右(向左补 1px 视觉居中) */
  .chev.down{transform:translateY(-1px) rotate(45deg)}                      /* 展开:朝下 */
  #modelBtn .caret{opacity:.6;flex-shrink:0}
  #modelPop{position:absolute;bottom:calc(100% + 8px);right:0;min-width:236px;z-index:20;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;
    box-shadow:var(--shadow);animation:pop .16s ease}
  #modelPop[hidden]{display:none}
  #modelPop .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    text-align:left;padding:9px 11px;border-radius:10px;font-size:13px;color:var(--text);transition:background .14s}
  #modelPop .mi:hover{background:var(--panel2)}
  #modelPop .mi.on{color:var(--accent)}
  #modelPop .mi .mk{color:var(--accent);font-size:12px;flex-shrink:0}
  #pending{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  #pending:empty{display:none}
  #pending.shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #pending .pi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;
    background:var(--card);border:1px solid var(--line2);font-size:13px;color:var(--dim)}
  #pending .pi .clock{flex-shrink:0}
  #pending .pi .ptext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pending .pi .pdel{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
    background:transparent;color:var(--dim);font-size:15px;line-height:1;display:inline-flex;
    align-items:center;justify-content:center}
  #pending .pi .pdel:hover{background:var(--err);color:#fff}
  #thumbs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  #thumbs .t{position:relative}
  #thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
  #thumbs .x{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border-radius:50%;
    width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  /* 竖排输入框:文本区在上(默认约 2 行),工具条在下 */
  .inrow{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);
    border-radius:20px;padding:8px 10px 6px;transition:border-color .18s,box-shadow .18s}
  .inrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  #ta{width:100%;background:none;border:none;color:var(--text);resize:none;font:inherit;
    min-height:46px;max-height:180px;padding:2px 4px;outline:none;line-height:1.5}
  #ta::placeholder{color:var(--dim2)}
  #imgBtn{color:var(--dim);font-size:22px;width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:color .16s,background .16s}
  #imgBtn:hover{color:var(--text);background:var(--panel2)}
  #micBtn{position:relative;color:var(--dim);font-size:18px;width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:color .16s,background .16s,transform .12s}
  #micBtn:hover{color:var(--text);background:var(--panel2)}
  #micBtn:active{transform:scale(.9)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes recIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* 录音行:点 🎤 后整个输入框变成这一条,整行点按即完成(参考 iMessage) */
  #recRow{display:none;align-items:center;gap:11px;cursor:default;user-select:none;-webkit-user-select:none;
    background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:0 8px 0 12px;
    min-height:64px;animation:recIn .2s ease;transition:border-color .18s,transform .1s}
  #recRow.show{display:flex}
  #recRow.show{border-color:var(--err)}
  #recRow .rdot{width:9px;height:9px;border-radius:50%;background:var(--err);animation:blink 1s infinite;flex-shrink:0;pointer-events:none}
  #recRow #recWave{flex:1;height:36px;min-width:0;pointer-events:none}
  #recRow #recTime{color:var(--err);font-variant-numeric:tabular-nums;font-size:14px;flex-shrink:0;min-width:36px;text-align:right;pointer-events:none}
  #recRow #recCancel{flex-shrink:0;width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:15px;
    display:flex;align-items:center;justify-content:center;background:var(--panel2);transition:color .16s,background .16s}
  #recRow #recCancel:hover{color:var(--text);background:var(--line2)}
  #sendBtn,#recRow #recSend{background:linear-gradient(135deg,var(--user1),var(--user2));color:#fff;border-radius:50%;
    width:34px;height:34px;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,opacity .2s,box-shadow .2s;box-shadow:0 2px 10px var(--glow2)}
  #sendBtn:hover,#recRow #recSend:hover{box-shadow:0 4px 16px var(--glow1)}
  #sendBtn:active,#recRow #recSend:active{transform:scale(.9)}
  /* 语音占位气泡:转写中 spinner / 没听清可重录 */
  .bubble .vwait{display:inline-flex;align-items:center;gap:8px}
  .bubble .vwait .sp{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.42);border-top-color:#fff;animation:spin .7s linear infinite;flex-shrink:0}
  .bubble .vretry{margin-left:9px;padding:2px 11px;border-radius:12px;background:rgba(255,255,255,.24);color:#fff;font-size:13px;cursor:pointer}
  .bubble .vretry:active{transform:scale(.94)}
  #sendBtn:disabled{opacity:.4;box-shadow:none}
  #sendBtn.stop-mode{background:linear-gradient(135deg,#e05050,#c03030);font-size:13px}
  #sendBtn.stop-mode:hover{box-shadow:0 4px 16px rgba(192,48,48,.5)}

  #backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;backdrop-filter:blur(2px)}

  @media(max-width:760px){
    #sidebar{position:fixed;inset:8px auto 8px 8px;margin:0;
      transform:translateX(calc(-100% - 16px))}
    #sidebar.open{transform:translateX(0);box-shadow:0 4px 16px rgba(0,0,0,.22)}
    #hamb{display:flex}
    #backdrop.show{display:block}
    /* 移动端左右留白收窄:桌面 32px 在窄屏太挤,回到 16px */
    #messages,#convLoading{padding-left:16px;padding-right:16px}
    header.bar{padding-left:16px;padding-right:16px}
    #composer{padding-left:16px;padding-right:16px}
  }
  /* 桌面宽屏:基础字号调小(手机保持 16px 不变,避免 iOS 聚焦缩放) */
  @media(min-width:761px){
    html,body{font-size:14px;line-height:1.55}
    #collapseBtn{display:flex}
    /* 收起:侧边栏宽度归零,顶栏 ☰ 变身为"展开"入口 */
    body.sb-collapsed #sidebar{width:0;margin-left:0;border-color:transparent;box-shadow:none;overflow:hidden}
    body.sb-collapsed #hamb{display:flex}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .ic{width:14px;height:14px;vertical-align:-2.5px;flex-shrink:0}
  #micBtn .ic{width:17px;height:17px;vertical-align:-4px}
  .pmrow .ic{width:15px;height:15px;vertical-align:-3px;margin-right:2px;color:var(--dim)}
</style>

<script>
"use strict";
// ── 状态 ────────────────────────────────────────────────────────────────
const S = {
  token: localStorage.getItem("hermes_token") || "",
  conv: "main",
  convs: [],            // [{conv,title,turns,last_ts,pinned}]
  projects: [],         // [{hash,name,path,last_used}]
  project: null,        // 「活跃」项目 hash(顶部 ＋新对话 建在此;随打开的会话联动);null=默认项目
  expanded: new Set(),  // 已展开的分组:默认项目用 "__default__",项目用其 hash
  browseDir: "",        // 目录浏览器当前所在目录
  images: [],           // {data,media_type,url}
  stream: null,         // 当前正在流式的 assistant 气泡 DOM 引用
  localSent: false,     // 本客户端刚发了消息,收到 "user" 事件时跳过(避免重复气泡)
  es: null,
  lastId: 0,            // 已处理的最大事件编号,用于断线重连后去重
  models: {default:"", choices:[]},  // /models 拉到的可选模型
  model: "",            // 当前会话使用的模型(空=用默认)
  git: null,            // 当前项目会话的 git 状态(/conv/git 返回);非项目会话为 null
  histCache: {},        // conv → turns[]:切会话时先渲缓存,消除空屏闪烁
  pendingChoice: {},    // conv → choice 事件:审批发给非当前会话时暂存,切回该会话再渲染
  live: {},             // conv → 进行中回合的事件缓冲:任意会话(含后台)都记录,切回时重放重建流式气泡
  pending: {},          // conv → 待发送队列 [{id,text,images}]:上一个任务没结束时点发送,暂存,任务完成自动发
  pendId: 0,            // 待发送项自增 id,供删除定位
  convFilter: "all",
  rateStatus: {level:"ok", msg:"", lastErr:"", ts:0},  // ok|warn|err, 更新侧栏底部状态点
  dragSrc: null,        // 项目拖拽排序:正在被拖起的项目 hash
  dragMoved: false,     // 刚发生过一次拖拽落地,下一次 click 吞掉(不触发分组展开/收起)

// ── Markdown 渲染(内置,不依赖 CDN)────────────────────────────────────────
function inlineMd(t){
  t = esc(t);
  const links=[];                                   // 先把 [文字](url) 抠出来占位,避免下面裸链接二次包裹
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,txt,url)=>{
    links.push('<a href="'+url+'" target="_blank" rel="noopener">'+txt+'</a>'); return "L"+(links.length-1)+""; });
  t = t.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/L(\d+)/g,(m,i)=>links[+i]);   // 还原 Markdown 链接
  return t;
}
function mdToHtml(src){
  src = (src||"").replace(/\r\n/g,"\n");
  const codes=[];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codes.push('<pre class="code"><code>'+esc(code.replace(/\n$/,""))+"</code></pre>");
    return " C"+(codes.length-1)+" ";
  });
  const L = src.split("\n"); let out=""; let i=0; let para=[];
  const flush=()=>{ if(para.length){ out+="<p>"+para.map(inlineMd).join("<br>")+"</p>"; para=[]; } };
  const sepRe=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?\s*$/;
  while(i<L.length){
    let ln=L[i];
    const cm=ln.match(/^ C(\d+) $/);
    if(cm){ flush(); out+=codes[+cm[1]]; i++; continue; }
    if(!ln.trim()){ flush(); i++; continue; }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ flush(); const n=m[1].length; out+="<h"+n+">"+inlineMd(m[2])+"</h"+n+">"; i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ flush(); out+="<hr>"; i++; continue; }
    // 表格
    if(ln.includes("|") && i+1<L.length && sepRe.test(L[i+1])){
      flush();
      const cells=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const head=cells(ln); i+=2; const rows=[];
      while(i<L.length && L[i].includes("|") && L[i].trim()){ rows.push(cells(L[i])); i++; }
      let t="<table><thead><tr>"+head.map(h=>"<th>"+inlineMd(h)+"</th>").join("")+"</tr></thead><tbody>";
      for(const r of rows){ t+="<tr>"+head.map((_,k)=>"<td>"+inlineMd(r[k]||"")+"</td>").join("")+"</tr>"; }
      out+=t+"</tbody></table>"; continue;
    }
    if(m=ln.match(/^\s*>\s?(.*)$/)){ flush(); const q=[]; while(i<L.length&&(m=L[i].match(/^\s*>\s?(.*)$/))){ q.push(m[1]); i++; } out+="<blockquote>"+q.map(inlineMd).join("<br>")+"</blockquote>"; continue; }
    if(/^\s*[-*+]\s+/.test(ln)){ flush(); let h="<ul>"; while(i<L.length&&(m=L[i].match(/^\s*[-*+]\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ul>"; continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ flush(); let h="<ol>"; while(i<L.length&&(m=L[i].match(/^\s*\d+\.\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ol>"; continue; }
    para.push(ln); i++;
  }
  flush();
  return out;
}

// ── 侧栏底部:限额 / 错误状态 ────────────────────────────────────────────
// 从限额报错串里抠出「额度恢复时间」→ 毫秒时间戳,拿不到返回 0。
// 订阅版限额报错常见格式:"Claude AI usage limit reached|1720000000"(竖线后是 unix 秒)。
// 兜底再认 retry-after / "try again in Ns" 这类相对秒数。
function parseRateReset(err){
  if(!err) return 0;
  const s=String(err);
  let m=s.match(/usage limit reached\s*\|\s*(\d{10,13})/i) || s.match(/\|\s*(\d{10,13})\b/);
  if(m){ let n=+m[1]; if(n<1e12) n*=1000; return n; }  // 10 位是秒 → 补成毫秒
  m=s.match(/retry[-\s]?after["'\s:=]+(\d+)/i) || s.match(/try again in\s+(\d+)\s*s/i);
  if(m) return Date.now()+(+m[1])*1000;
  return 0;
}
// 把恢复时间戳格式化成「预计 14:30 恢复(还剩 46 分钟)」
function fmtReset(ts){
  if(!ts||ts<=Date.now()) return "";
  const hhmm=new Date(ts).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  const mins=Math.max(1, Math.round((ts-Date.now())/60000));
  const left=mins>=60 ? (Math.floor(mins/60)+" 小时 "+(mins%60)+" 分") : (mins+" 分钟");
  return "预计 "+hhmm+" 恢复(还剩 "+left+")";
}
function setRateStatus(level, msg, err){
  const reset = level==="warn" ? parseRateReset(err) : 0;
  S.rateStatus={level:level||"ok", msg:msg||"", lastErr:err||"", ts:Date.now(), resetTs:reset};
  updateSfoot();
}

function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts*1000), n=new Date();
  const sameDay=d.toDateString()===n.toDateString();
  return sameDay ? d.toTimeString().slice(0,5) : (d.getMonth()+1)+"/"+d.getDate(); }
async function loadPrefs(){
  try{
    const r = await api("/prefs"); const p = await r.json();
    // 服务端有明确值才覆盖本地;null = 不动(本地 localStorage 是当前设备的主)
    if(p.theme && ["light","dark"].includes(p.theme) && p.theme !== localStorage.getItem("hermes_theme")){
      document.documentElement.setAttribute("data-theme", p.theme);
      try{ localStorage.setItem("hermes_theme", p.theme); }catch(e){}
      syncTheme();
    }
    if(p.conv_filter) S.convFilter = p.conv_filter;
  }catch(e){}
}
async function loadConvs(){
  const r = await api("/conversations"); const d = await r.json();
  const main = d.main; main.conv="main"; main.title="主会话"; main.pinned=true;
  // 全部会话(含主会话)按最近活跃排序,最新的排最前面
  S.convs = [main, ...d.conversations].sort((a,b)=>(b.last_ts||0)-(a.last_ts||0));
  renderConvs();   // 会话刷新后同步标题栏
}
// 从 conv id 解析它属于哪个项目:p<hash>:<convid> → hash;否则 null(默认项目)
function convProject(conv){
  const m = String(conv).replace(/^local-/,"").match(/^p([0-9a-f]+):/);
  return m ? m[1] : null;
}
// 分组的存储键:默认项目用固定串,项目用其 hash
function grpKey(hash){ return hash===null ? "__default__" : hash; }
function saveExpanded(){ try{ localStorage.setItem("hermes_expanded", JSON.stringify([...S.expanded])); }catch(e){} }
function loadExpanded(){ try{ S.expanded=new Set(JSON.parse(localStorage.getItem("hermes_expanded")||"[]")); }catch(e){ S.expanded=new Set(); } }

function convsInGroup(hash){
  return S.convs.filter(c => c.pinned ? hash===null : convProject(c.conv)===hash);
}
// 手风琴:默认项目 + 每个项目一个可折叠分组,展开后列出其会话;末尾一行「新建项目」
function renderConvs(){
  const box=$("#convList"); box.innerHTML="";
  const groups=[{hash:null,name:"默认项目"}].concat(S.projects.map(p=>({hash:p.hash,name:p.name})));
  for(const g of groups){
    const convs=convsInGroup(g.hash);
    const open=S.expanded.has(grpKey(g.hash));
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent=g.name; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);   // 折线箭头,展开时旋转朝下
    if(g.hash!==null){
      const more=el("button","pgmore"); more.textContent="⋯"; more.title="更多";
      more.onclick=ev=>{ ev.stopPropagation(); openProjMenu(more, g.hash); }; h.append(more);
    }
    const add=el("button","pgadd"); add.textContent="＋"; add.title="在此项目下新建会话";
    add.onclick=ev=>{ ev.stopPropagation(); newChatIn(g.hash); }; h.append(add);
    if(g.hash!==null){
      bindProjDrag(h, g.hash);   // 默认项目/末尾「新建项目」不可拖,仅真实项目分组可排序
    }
    h.onclick=()=>{ if(S.dragMoved){ S.dragMoved=false; return; } toggleGroup(g.hash); };  // 拖拽落地那一下别顺带触发展开/收起
    box.append(h);
    if(!open) continue;
    for(const c of convs){
      if(!c.pinned){const arch=!!c.archived;if(S.convFilter==="archived"&&!arch)continue;if(S.convFilter==="active"&&arch)continue;}
      const e=el("div","conv ingroup"+(c.conv===S.conv?" active":"")+(c.pinned?" pinned":""));
      if(S.live[c.conv]){ const dot=el("span","livedot"); dot.title="AI 正在回复中"; e.append(dot); }   // 该会话正在流式 → 闪烁圆点
      const ct=el("div","ct"); ct.textContent=c.title||"新对话"; e.append(ct);
      const tm=fmtTime(c.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; e.append(tmEl); }   // 会话时刻:名称右侧
      if(c.pinned){ const star=el("span","star"); star.textContent="★"; e.append(star); }   // 主会话:右侧弱化星标
      else { const more=el("button","more"); more.textContent="⋯"; more.title="更多"; more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,c.conv);}; e.append(more); }
      e.onclick=()=>openConv(c.conv);
      box.append(e);
    }
  }
  const addp=el("div","projgrp projadd"); addp.textContent="＋ 新建项目…"; addp.onclick=openProjModal; box.append(addp);
  // 同步标题栏:loadConvs 刷新 S.convs 后调 renderConvs,标题可能已更新
  const activeConv=S.convs.find(c=>c.conv===S.conv);
  if(activeConv) $("#convTitle").textContent=activeConv.title||"新对话";
}

async function loadProjects(){

// 项目分组拖拽排序(原生 HTML5 DnD:桌面拖起手感好,鼠标移动量够才触发,不影响原有点击展开)
function bindProjDrag(h, hash){
  h.draggable = true;
  h.ondragstart = ev=>{
    if(ev.target.closest(".pgadd,.pgmore")){ ev.preventDefault(); return; }   // 加号/更多按钮不触发拖拽
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", hash);
    S.dragSrc = hash;
    setTimeout(()=>h.classList.add("dragging"), 0);   // 下一 tick 加,免得拖拽预览图也变半透明
  };
  h.ondragend = ()=>{ h.classList.remove("dragging"); S.dragSrc=null; };
  h.ondragover = ev=>{ if(!S.dragSrc || S.dragSrc===hash) return; ev.preventDefault(); ev.dataTransfer.dropEffect="move"; h.classList.add("dragover"); };
  h.ondragleave = ()=> h.classList.remove("dragover");
  h.ondrop = ev=>{
    ev.preventDefault(); h.classList.remove("dragover");
    const src = ev.dataTransfer.getData("text/plain");
    S.dragMoved = true;   // 拖拽落地这一下,别顺带触发 h.onclick 里的展开/收起
    if(src && src!==hash) reorderProject(src, hash);
  };
}
function reorderProject(srcHash, targetHash){
  const arr=S.projects;
  const si=arr.findIndex(p=>p.hash===srcHash), ti=arr.findIndex(p=>p.hash===targetHash);
  if(si<0 || ti<0) return;
  const [item]=arr.splice(si,1); arr.splice(ti,0,item);
  renderConvs();
  api("/projects/reorder",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order:arr.map(p=>p.hash)})}).catch(()=>{});
}
function toggleGroup(hash){
  const k=grpKey(hash);
  if(S.expanded.has(k)) S.expanded.delete(k); else S.expanded.add(k);
  saveExpanded(); renderConvs();
}
// 在指定项目下开新会话(顶部 ＋新对话 用当前活跃项目;分组 ＋ 用该分组)
function newChatIn(hash){
  S.project=hash; S.expanded.add(grpKey(hash)); saveExpanded();
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const conv="local-"+(hash?("p"+hash+":"):"")+id;
  S.convs.unshift({conv,title:"新对话",turns:0,last_ts:null});
  openConv(conv); $("#ta").focus();
}

async function removeProject(hash){
  try{ await api("/projects/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hash})}); }
  catch(e){ alert("移除失败"); return; }
  S.expanded.delete(hash); saveExpanded();
  const activeGone = convProject(S.conv)===hash;   // 当前会话属于被移除项目 → 回落主会话
  if(S.project===hash) S.project=null;
  await loadProjects();

}

function renderNotifyPane(){

  $("#setPane").innerHTML=h;

async function bindNotifyPane(){
  const tgl=$("#notifyToggle"), desc=$("#notifyDesc"); if(!tgl) return;
  const denied = (typeof Notification!=="undefined" && Notification.permission==="denied");
  const sub = denied ? null : await currentSub();
  if(denied){ tgl.checked=false; tgl.disabled=true; desc.textContent="浏览器已拒绝通知,去系统/浏览器设置里放行后再试"; }
  else {
    tgl.checked=!!sub; tgl.disabled=false;
    desc.textContent = sub ? "已开启,本设备会收到通知"
      : (isIOSNonStandalone() ? "iPhone 需先把网页「加到主屏」,从主屏图标打开才能开" : "点右侧开关开启");
  }
  const testBtn=$("#notifyTest");
  if(testBtn){
    testBtn.disabled = !sub;
    testBtn.onclick = async ()=>{
      testBtn.disabled=true; const t=testBtn.textContent; testBtn.textContent="发送中…";
      try{
        const j = await (await api("/push/test",{method:"POST"})).json();
        alert(j.sent>0
          ? "已发往 "+j.sent+" 台设备。看手机系统通知(锁屏/通知中心)。"
          : "服务端订阅列表为空(sent=0)——开关没真正订阅成功,请重开一次并留意报错。");
      }catch(e){ alert("测试失败:"+(e&&e.message||e)); }
      finally{ testBtn.textContent=t; testBtn.disabled=!sub; }
    };
  }
  tgl.onchange = async ()=>{
    tgl.disabled=true;
    try{ tgl.checked ? await enableNotify() : await disableNotify(); }
    catch(e){ alert("操作失败:"+(e&&e.message||e)); }
    finally{ bindNotifyPane(); }
  };
}

// ── Web Push 底座:注册 SW + 订阅 VAPID ────────────────────────────────────
// 装了 Service Worker + 订阅公钥后,页面关了/锁屏也能收到系统通知。
// 服务端未配 VAPID 时 /push/config 返回 enabled:false,通知 tab 显示未配置提示。
const PUSH = { pubKey:"", enabled:false, ready:false };
function b64ToU8(base64){
  const pad="=".repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(b), arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
async function initPush(){
  if(!("serviceWorker" in navigator)) return;
  try{ await navigator.serviceWorker.register("/sw.js"); }catch(e){ return; }
  // 点系统通知 → SW 让页面切到对应会话
  navigator.serviceWorker.addEventListener("message", ev=>{
    const m=ev.data||{};
    if(m.type==="open" && m.conv){ try{ openConv(m.conv); }catch(e){} }
  });
  try{
    const cfg = await (await api("/push/config")).json();
    PUSH.enabled=!!cfg.enabled; PUSH.pubKey=cfg.vapidPublicKey||"";
  }catch(e){ return; }
  PUSH.ready=true;
}
async function currentSub(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function enableNotify(){
  // 每一步失败都抛带原因的错误,交给 onchange 的 catch 弹出来——别再静默失败让人盲猜。
  if(isIOSNonStandalone())
    throw new Error("现在不是主屏模式。iPhone 需先把本页「添加到主屏幕」,再从主屏图标打开才能开启。");
  if(typeof Notification==="undefined")
    throw new Error("此浏览器不支持通知 API(Notification 未定义)。");
  let perm = Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm==="denied")
    throw new Error("通知权限被拒。iOS 需删掉主屏图标 + 清掉网站数据后,重新加主屏再试。");
  if(perm!=="granted")
    throw new Error("未获得通知权限(perm="+perm+")。");
  if(!PUSH.pubKey)
    throw new Error("服务端没返回 VAPID 公钥,推送未配置。");
  const reg=await navigator.serviceWorker.ready;
  let sub;
  try{
    sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(PUSH.pubKey) });
  }catch(e){
    throw new Error("订阅失败(pushManager.subscribe):"+(e&&e.message||e));
  }
  const r=await api("/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});
  if(!r.ok)
    throw new Error("订阅已建立但保存到服务端失败(HTTP "+r.status+")。");
}
async function disableNotify(){
  const sub=await currentSub();
  if(sub){
    try{ await api("/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
  }
}

function parseKV(text){ const o={}; (text||"").split("\n").forEach(l=>{ l=l.trim(); if(!l) return; const i=l.indexOf("="); if(i>0) o[l.slice(0,i).trim()]=l.slice(i+1).trim(); }); return o; }
async function saveMcpForm(){
  const err=$("#mfErr"); err.textContent="";
  const name=$("#mfName").value.trim();
  if(!name){ err.textContent="请填名称"; return; }
  const type=$("#mfType").value;
  const body={action:"add", name, type, enabled:true};
  if(type==="stdio"){
    if(!$("#mfCmd").value.trim()){ err.textContent="stdio 需要 command"; return; }
    body.command=$("#mfCmd").value.trim();
    body.args=$("#mfArgs").value.trim().split(/\s+/).filter(Boolean);
    body.env=parseKV($("#mfEnv").value);
  } else {
    if(!$("#mfUrl").value.trim()){ err.textContent=type+" 需要 URL"; return; }
    body.url=$("#mfUrl").value.trim();
    body.headers=parseKV($("#mfHeaders").value);
  }
  const r=await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.error){ err.textContent=d.error; return; }

  renderMcpPane();
}

async function delConv(conv){
  const idx=S.convs.findIndex(x=>x.conv===conv);
  if(idx<0) return;
  const removed=S.convs[idx], wasActive=(S.conv===conv);
  // 乐观假删:先从列表移除并立即重绘,不等服务器
  S.convs.splice(idx,1); delete S.histCache[conv]; delete S.live[conv]; markLive(); renderConvs();
  if(wasActive) openConv(S.convs[0]?S.convs[0].conv:"main");   // 删的是当前会话→切到最近一个
  // 纯本地会话(从未发过消息)服务端没有记录,删完即止
  if(String(conv).startsWith("local-")) return;
  try{
    await api("/conv/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv})});
  }catch(err){
    // 删除失败:回滚列表并提示
    S.convs.splice(idx,0,removed); renderConvs();
    alert("删除失败,已恢复该会话");
  }
}

// 把一组 turns 铺进消息区(切会话 / 缓存回填共用)
const SYS_MARK="⚙️[系统]";   // 与后端 selfops.SYS_MARKER 一致:系统注入的轮渲染成居中系统条
function addSysNote(text){
  const row=el("div","row sys"); const b=el("div","sysnote"); b.textContent=text;
  row.append(b); $("#wrap").append(row);
}
function renderTurns(turns){
  $("#wrap").innerHTML="";
  for(const t of turns){
    if(t.user && t.user.startsWith(SYS_MARK)) addSysNote(t.user.slice(SYS_MARK.length).trim());
    else addBubble("me", t.user, t.images);
    if(!t.pending){
      const b=addBubble("ai","");
      if(t.events && t.events.length){
        const flow=renderEventsFlow(t.events);
        // 时间线里一个字都没有(如被截断)→ 末尾补一段最终正文兜底
        if(!t.events.some(x=>x.type==="text") && t.assistant){
          const d=el("div","seg"); d.innerHTML=mdToHtml(t.assistant); flow.append(d);
        }
        b.append(flow);
      }else b.innerHTML=mdToHtml(t.assistant);   // 老数据没存时间线:只有最终正文
    }else if(t.draft){
      // 进行中但后端正流式写 draft:用部分内容起底兜底,避免刷新后空白;
      // SSE 恢复后 maybeReplayStream 会用同 seg 全文覆盖无缝续上
      const b=addBubble("ai","");
      b.innerHTML=mdToHtml(t.draft);
      const st=el("div","status"); st.textContent="回复中…"; b.append(st);
    }
  }
  updateEmpty(); scrollDown(true);
}
// 用落库的过程时间线重建一轮回复:文字段与工具卡按当时的真实顺序交错复现
function renderEventsFlow(events){
  const flow=el("div","flow");
  for(const blk of events){
    if(blk.type==="text"){
      if(!blk.text) continue;
      const d=el("div","seg"); d.innerHTML=mdToHtml(blk.text); flow.append(d); continue;
    }
    if(blk.type==="compact"){
      const d=el("div","compactline"); d.textContent="上下文已自动压缩,对话继续";
      flow.append(d); continue;
    }
    if(blk.type!=="tool") continue;
    const finished=("preview" in blk), failed=blk.ok===false;
    const det=(blk.detail||"").trim();
    let card=renderToolCard(blk.name, blk.input||{});
    if(!card){
      if(!failed && !det) continue;        // 无入参卡且成功无输出:与流式一致,不补卡
      card=toolCardShell(ic(failed?"warn":"wrench")+" "+esc(blk.name), "", el("div"), true);
    }
    if(card._sub && (blk.subs||[]).length){ // 子代理卡:恢复内部工具步 chips
      const list=blk.subs;
      const bits=['<span>'+ic("zap")+" "+list.length+' 步</span>'];
      for(const x of list.slice(-8)) bits.push('<span>'+esc(x.name)+(x.ok===false?" ✗":" ✓")+'</span>');
      card._sub.innerHTML=bits.join("");
    }
    if(finished) applyResult(card, {ok:!failed, preview:blk.preview||"", detail:blk.detail||""});
    flow.append(card);
  }
  return flow;
}
async function openConv(conv){
  S.conv=conv; S.stream=null;
  S.project=convProject(conv); S.expanded.add(grpKey(S.project)); saveExpanded();  // 活跃项目随打开的会话联动,并确保其分组展开
  const c=S.convs.find(x=>x.conv===conv);
  $("#convTitle").textContent = c ? (c.title||"新对话") : "新对话";
  setMeta(c || {}); $("#ctxPop").hidden=true;   // 切会话时收起明细弹层
  refreshGit(conv);                              // 项目会话 → 拉 git 状态点亮 ⎇ 按钮
  renderConvs(); closeSidebar(); drawPending();  // 待发送队列按会话独立,切回时重绘
  const cached = S.histCache[conv];
  const isLocal = String(conv).startsWith("local-");
  const hasMsgs = c && c.turns > 0;             // 侧栏记录里该会话有历史消息
  if(cached){ renderTurns(cached); }            // 命中缓存:立即渲染,消除"先闪空屏再出内容"
  else if(!isLocal && hasMsgs){                 // 只在「换到一个有历史、还没拉过的真实会话」时才铺骨架屏
    $("#wrap").innerHTML=""; $("#empty").style.display="none"; $("#convLoading").classList.add("on");
  }else{                                        // 新建会话 / 空会话:不闪骨架,清空后交给 updateEmpty 出欢迎屏
    $("#wrap").innerHTML=""; $("#convLoading").classList.remove("on");
  }
  if(conv && !String(conv).startsWith("local-")){
    try{
      const r=await api("/history?conv="+encodeURIComponent(conv)); const d=await r.json();
      if(S.conv!==conv) return;   // 拉取期间已切到别的会话 → 丢弃过期结果,避免内容错乱
      $("#convLoading").classList.remove("on");
      S.histCache[conv]=d.turns;
      // 仅当与已渲染的缓存不一致才重绘,避免命中缓存时白闪一下
      if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
    }catch(e){ $("#convLoading").classList.remove("on"); }
    maybeReplayStream(conv);   // 该会话仍在流式 → 用缓冲在历史下方重建流式气泡(切换不中断)
    if(S.conv===conv && S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);  // 切回带待审批的会话 → 补出按钮
    return;
  }
  if(S.conv!==conv) return;
  updateEmpty(); scrollDown(true);
  maybeReplayStream(conv);
  if(S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);
}

// ── 重加载历史(SSE 连接恢复后)──────────────────────────────────────────
async function reloadHistory(){
  const conv=S.conv;
  if(!conv || String(conv).startsWith("local-")) return;  // 只在非本地会话拉
  if(S.stream) return;  // 正在流式输出中 → 别用全量重绘冲掉流式气泡
  try{
    const r=await api("/history?conv="+encodeURIComponent(conv));
    const d=await r.json();
    if(S.conv!==conv || S.stream) return;  // await 期间切了会话/开了流 → 丢弃
    const cached=S.histCache[conv];
    S.histCache[conv]=d.turns;
    if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
  }catch(e){}
}

// ── 消息气泡 ─────────────────────────────────────────────────────────────
function addBubble(who, text, imgs){

// 带鉴权头拉图并显示;token 只在头里传,不进 URL(不泄露到日志/历史/Referer)
