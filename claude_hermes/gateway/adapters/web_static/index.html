<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f1e1d">
<title>Hermes</title>
<!-- 防闪烁:渲染前先套用上次选择的主题 -->
<script>(function(){try{var t=localStorage.getItem("hermes_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  /* ── 深色(默认)· Claude Code 暖炭灰 + 赤陶橙 ────────────────────────── */
  :root{
    --bg:#1f1e1d; --bg2:#262624; --panel:#1a1918; --panel2:#302f2c; --card:#2b2a27;
    --line:#3a3934; --line2:#4a4941;
    --text:#ecebe3; --dim:#a5a094; --dim2:#716d61;
    --accent:#d97757; --accent2:#c8613f;
    --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
    --ok:#5aa469; --err:#d1674a; --radius:16px;
    --bar-bg:rgba(31,30,29,.72);
    --login-bg:radial-gradient(120% 90% at 50% -10%,#2c2925 0%,#1f1e1d 60%);
    --code-bg:#1a1917; --code-fg:#d4d0c4; --code-inline:rgba(180,170,150,.15);
    --scroll:#3a3934; --scroll-h:#4a4941;
    --bubble-shadow:0 1px 2px rgba(0,0,0,.24);
    --shadow:0 10px 34px rgba(0,0,0,.45);
    --focus-ring:rgba(217,119,87,.2);
    --glow1:rgba(217,119,87,.4); --glow2:rgba(194,95,60,.4);
  }
  /* ── 浅色:系统偏好浅色且用户未手动固定时 · Claude Code 暖米色 ────────── */
  @media(prefers-color-scheme:light){
    :root:not([data-theme]){
      --bg:#f5f4ee; --bg2:#faf9f5; --panel:#efece3; --panel2:#e6e2d6; --card:#ffffff;
      --line:#e7e3d8; --line2:#dad5c7;
      --text:#29261f; --dim:#6d6757; --dim2:#9a9482;
      --accent:#bd5d3a; --accent2:#a84e2f;
      --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
      --bar-bg:rgba(250,249,245,.8);
      --login-bg:radial-gradient(120% 90% at 50% -10%,#f3ece2 0%,#f5f4ee 60%);
      --code-bg:#f3f1e9; --code-fg:#3a362c; --code-inline:rgba(120,100,70,.1);
      --scroll:#d8d3c5; --scroll-h:#c4bdab;
      --bubble-shadow:0 1px 2px rgba(60,50,30,.06);
      --shadow:0 10px 34px rgba(80,60,30,.14);
      --focus-ring:rgba(189,93,58,.16);
      --glow1:rgba(217,119,87,.3); --glow2:rgba(189,93,58,.28);
    }
  }
  /* ── 手动固定浅色 ────────────────────────────────────────────────────── */
  :root[data-theme="light"]{
    --bg:#f5f4ee; --bg2:#faf9f5; --panel:#efece3; --panel2:#e6e2d6; --card:#ffffff;
    --line:#e7e3d8; --line2:#dad5c7;
    --text:#29261f; --dim:#6d6757; --dim2:#9a9482;
    --accent:#bd5d3a; --accent2:#a84e2f;
    --user1:#d97757; --user2:#c25f3c; --on-user:#fff;
    --bar-bg:rgba(250,249,245,.8);
    --login-bg:radial-gradient(120% 90% at 50% -10%,#f3ece2 0%,#f5f4ee 60%);
    --code-bg:#f3f1e9; --code-fg:#3a362c; --code-inline:rgba(120,100,70,.1);
    --scroll:#d8d3c5; --scroll-h:#c4bdab;
    --bubble-shadow:0 1px 2px rgba(60,50,30,.06);
    --shadow:0 10px 34px rgba(80,60,30,.14);
    --focus-ring:rgba(189,93,58,.16);
    --glow1:rgba(217,119,87,.3); --glow2:rgba(189,93,58,.28);
  }
  /* data-theme="dark" 用根默认值即可,无需重复 */

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background-color .3s ease,color .3s ease}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:var(--accent)}

  /* 美化滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* 登录 */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--login-bg);z-index:50;padding:24px}
  #login .card{width:100%;max-width:340px;text-align:center;animation:pop .4s ease}
  #login .logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--user2));display:flex;align-items:center;justify-content:center;
    font-size:32px;color:#fff;box-shadow:0 8px 30px var(--glow1)}
  #login h1{font-size:28px;margin:0 0 6px;letter-spacing:.2px;font-weight:600;
    font-family:ui-serif,Georgia,"Times New Roman","Songti SC",serif}
  #login p{color:var(--dim);margin:0 0 26px;font-size:14px}
  #login input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);
    background:var(--card);color:var(--text);font-size:16px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
  #login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  #login button{width:100%;padding:15px;border-radius:14px;
    background:linear-gradient(135deg,var(--user1),var(--user2));color:#fff;font-weight:600;font-size:16px;
    transition:transform .12s,box-shadow .2s;box-shadow:0 4px 16px var(--glow2)}
  #login button:active{transform:scale(.97)}
  #login .err{color:var(--err);font-size:13px;height:18px;margin-top:10px}

  /* 布局 */
  #app{display:flex;overflow:hidden;
    position:fixed;top:var(--app-top,0);left:0;right:0;bottom:0;height:var(--app-h,auto)}
  #sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    transition:transform .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);z-index:30}
  #sidebar .shead{padding:16px 18px 8px;display:flex;align-items:center;gap:10px}
  #sidebar .shead .brand{flex:1;display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700}
  #sidebar .shead .brand .dot{width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--user2));display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;box-shadow:0 2px 10px var(--glow1)}
  /* 列表行统一规范:所有可点行(＋新对话 / 分组头 / 会话)共用同一内边距 + 圆角,
     hover 的灰底矩形尺寸与圆角完全一致 */
  #convList{flex:1;overflow-y:auto;padding:4px 12px 12px}
  #newBtn,.projgrp,.conv{padding:9px 12px;border-radius:9px;display:flex;align-items:center;
    cursor:pointer;transition:background .15s,color .15s}
  #newBtn:hover,.projgrp:hover,.conv:hover,.conv.active{background:var(--panel2)}
  /* ＋新对话:独立一行、无框,黑灰色,靠字重+间距区分 */
  #newBtn{margin:2px 12px 4px;gap:9px;color:var(--dim);font-size:14px;font-weight:600}
  #newBtn .np{font-size:16px;line-height:1}
  #newBtn:hover{color:var(--text)}
  /* 侧边栏收起按钮(仅桌面显示)*/
  #collapseBtn{display:none;width:30px;height:30px;border-radius:9px;flex-shrink:0;
    align-items:center;justify-content:center;font-size:18px;color:var(--dim);
    transition:background .16s,color .16s,transform .12s}
  #collapseBtn:hover{background:var(--panel2);color:var(--text)}
  #collapseBtn:active{transform:scale(.9)}
  .conv{margin-bottom:1px;gap:8px;color:var(--dim);position:relative}
  .conv:hover,.conv.active{color:var(--text)}
  .conv .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .conv .ctime{flex-shrink:0;color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums;transition:opacity .16s}  /* 会话时刻:名称右侧 */
  .conv .star{flex-shrink:0;color:var(--dim2);font-size:11px;transition:opacity .16s}   /* 主会话:弱化星标 */
  /* 「⋯」更多键绝对定位:不占布局宽度,hover 时浮现 */
  .conv .more{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;
    font-size:16px;line-height:1;color:var(--dim2);padding:2px 6px;border-radius:7px;transition:opacity .16s,color .16s,background .16s}
  .conv:hover .star,.conv:hover .ctime{opacity:0}
  .conv:hover .more{opacity:.6;pointer-events:auto}
  .conv .more:hover,.conv .more.on{color:var(--text);background:var(--card);opacity:1}
  /* 触屏无 hover:常驻显示「⋯」,否则点不到 */
  @media(hover:none){ .conv .more{opacity:.55;pointer-events:auto} }
  /* 会话「更多」浮层菜单(挂在 body 上,避开侧栏 overflow 裁剪) */
  .convmenu{position:fixed;z-index:40;min-width:130px;
    background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:5px;
    box-shadow:var(--shadow);animation:pop .14s ease}
  .convmenu .cmitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--text);transition:background .14s}
  .convmenu .cmitem:hover{background:var(--panel2)}
  .convmenu .cmitem.danger{color:var(--err)}
  .convmenu .cmitem.danger:hover{background:rgba(209,103,74,.12)}
  .sfoot{padding:9px 12px 9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim2);display:flex;align-items:center;gap:6px}
  .sfoot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex-shrink:0}
  .sfoot .sfoottxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 设置入口:状态栏最右一个齿轮图标 */
  .sfoicon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);transition:background .16s,color .16s}
  .sfoicon:hover{background:var(--panel2);color:var(--text)}
  .sfoicon:active{transform:scale(.9)}
  .sfoicon .ic{width:17px;height:17px;vertical-align:0}

  /* 项目分组(手风琴;行的内边距/圆角走上面的统一规范) */
  .projgrp{gap:6px;margin-top:2px;color:var(--dim);font-size:13px;font-weight:600;user-select:none}
  .projgrp:hover{color:var(--text)}
  .projgrp .pgcaret{margin-right:auto;color:var(--dim2)}  /* chevron 紧跟名称(间距走 projgrp 的 gap:6px),auto 外边距把按钮推到最右 */
  .projgrp .pgname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .projgrp .pgadd,.projgrp .pgrm{flex-shrink:0;opacity:0;background:none;border:none;cursor:pointer;
    color:var(--dim2);font-size:13px;padding:1px 5px;border-radius:6px;line-height:1}
  .projgrp:hover .pgadd,.projgrp:hover .pgrm{opacity:.6}
  .projgrp .pgadd:hover{opacity:1;color:var(--text);background:var(--card)}
  .projgrp .pgrm:hover{opacity:1;color:var(--err);background:rgba(209,103,74,.12)}
  .projgrp.projadd{color:var(--dim);font-weight:600;margin-top:4px}   /* 黑灰、无分割线、与分组同款行 */
  .conv.ingroup{margin-left:12px}   /* 分组下的会话缩进,体现层级 */

  /* 新建项目弹窗(服务端目录浏览器) */
  #projModal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #projModal[hidden]{display:none}   /* id+attr 优先级压过上面的 display:flex,hidden 才真生效 */
  #projModal .pmbox{width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
  #projModal .pmhead{padding:15px 18px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line)}
  #projModal .pmpathrow{display:flex;gap:8px;padding:12px 16px}
  #pmPath{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;
    color:var(--text);padding:8px 11px;font-size:13px}
  #projModal .pmgo{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:0 14px;cursor:pointer}
  #pmList{flex:1;overflow-y:auto;padding:4px 10px;min-height:120px}
  .pmrow{padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmrow:hover{background:var(--panel2)}
  .pmrow.pmup{color:var(--dim2)}
  #projModal .pmfoot{display:flex;gap:10px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line)}
  #projModal .pmfoot button{padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
  #projModal .pmfoot .pmok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* 设置弹窗 */
  #setModal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #setModal[hidden]{display:none}
  .setbox{width:min(820px,94vw);height:min(660px,88vh);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
  .sethead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sethead .settitle{flex:1;font-size:16px;font-weight:700}
  .setclose{width:32px;height:32px;border-radius:9px;color:var(--dim);font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:background .16s,color .16s}
  .setclose:hover{background:var(--panel2);color:var(--text)}
  .setbody{flex:1;display:flex;min-height:0}
  .settabs{flex-shrink:0;width:132px;padding:12px 10px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .settab{text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--dim);
    transition:background .15s,color .15s}
  .settab:hover{background:var(--panel2);color:var(--text)}
  .settab.active{background:var(--panel2);color:var(--text);font-weight:600}
  .setpane{flex:1;overflow-y:auto;padding:18px 20px;min-width:0}

  /* 分区标题 + 说明 */
  .setpane h3{margin:0 0 4px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .setpane h3 .ic{width:16px;height:16px;color:var(--accent)}
  .setpane .shint{margin:0 0 14px;font-size:12.5px;color:var(--dim);line-height:1.55}
  .setpane .sechd{margin:20px 0 8px;font-size:12px;font-weight:700;color:var(--dim2);
    text-transform:uppercase;letter-spacing:.5px}

  /* 开关(switch) */
  .sw{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .track{position:absolute;inset:0;background:var(--line2);border-radius:22px;transition:background .2s;cursor:pointer}
  .sw .track::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;
    background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .sw input:checked + .track{background:var(--accent)}
  .sw input:checked + .track::before{transform:translateX(16px)}

  /* 行:一条设置项(左内容 + 右开关) */
  .srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow .sinfo{flex:1;min-width:0}
  .srow .sname{font-size:14px;font-weight:600;color:var(--text);word-break:break-word}
  .srow .sdesc{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srow .sacts{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .srow .miniact{font-size:12px;color:var(--dim);padding:3px 7px;border-radius:7px;transition:background .15s,color .15s;white-space:nowrap}
  .srow .miniact:hover{background:var(--panel2);color:var(--text)}
  .srow .miniact.on{color:var(--accent)}
  .srow .miniact.danger:hover{color:var(--err);background:rgba(209,103,74,.12)}
  .srow.off .sname{color:var(--dim)}

  /* 技能搜索框 + 计数 */
  .skbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sksearch{flex:1;display:flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:9px;padding:7px 11px}
  .sksearch .ic{width:15px;height:15px;color:var(--dim2)}
  .sksearch input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:13.5px}
  .skcount{font-size:12px;color:var(--dim2);white-space:nowrap}

  /* 通用按钮 */
  .btn{padding:8px 14px;border-radius:9px;font-size:13.5px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--card)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:none;border-color:var(--line2)}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .setrowbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}

  /* 外部 MCP 添加表单 */
  .mcpform{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  .mcpform .fld{margin-bottom:10px}
  .mcpform .fld:last-child{margin-bottom:0}
  .mcpform label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .mcpform input,.mcpform textarea,.mcpform select{width:100%;background:var(--panel2);
    border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:8px 11px;font-size:13.5px;
    font-family:inherit}
  .mcpform textarea{resize:vertical;min-height:52px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .mcpform input:focus,.mcpform textarea:focus,.mcpform select:focus{outline:none;border-color:var(--accent)}
  .mcperr{color:var(--err);font-size:12.5px;margin-top:8px;min-height:16px}
  .mcptag{display:inline-block;font-size:11px;color:var(--dim2);border:1px solid var(--line2);
    border-radius:6px;padding:1px 6px;margin-left:8px;font-family:ui-monospace,Menlo,monospace}

  /* 文件列表 + 编辑器(记忆 / 人设) */
  .frow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .15s}
  .frow:hover .fname{color:var(--accent)}
  .frow .ic{width:16px;height:16px;color:var(--dim);flex-shrink:0}
  .frow .fname{flex:1;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .frow .fmiss{font-size:11px;color:var(--dim2)}
  .frow .fchev{color:var(--dim2);font-size:15px}
  .feditor{display:flex;flex-direction:column;height:100%}
  .feditor .fetop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .feditor .feback{font-size:13px;color:var(--dim);padding:5px 9px;border-radius:8px;transition:background .15s,color .15s}
  .feditor .feback:hover{background:var(--panel2);color:var(--text)}
  .feditor .fepath{flex:1;font-size:13px;font-weight:600;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feditor textarea{flex:1;width:100%;background:var(--code-bg);color:var(--code-fg);
    border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:13px;line-height:1.6;
    font-family:ui-monospace,Menlo,monospace;resize:none;outline:none}
  .feditor textarea:focus{border-color:var(--accent)}
  .fesave{display:flex;align-items:center;gap:10px;margin-top:12px}
  .fesave .festat{font-size:12.5px;color:var(--dim);flex:1}
  .fesave .festat.ok{color:var(--ok)}
  .setempty{text-align:center;color:var(--dim2);font-size:13px;padding:30px 10px}
  .setload{text-align:center;color:var(--dim2);font-size:13px;padding:24px}

  @media(max-width:640px){
    .setbox{width:100vw;height:100%;max-height:100%;border-radius:0;border:none}
    .setbody{flex-direction:column}
    .settabs{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);
      padding:8px 10px;gap:6px;overflow-x:auto}
    .settab{white-space:nowrap;flex-shrink:0}
    .setpane{padding:16px}
  }

  /* 主区 */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg2)}
  header.bar{padding:11px 16px;
    padding-top:calc(11px + env(safe-area-inset-top));
    background:var(--bar-bg);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
  header.bar .barwrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:var(--dim);flex-shrink:0;transition:background .16s,color .16s}
  .icon:hover{background:var(--panel2);color:var(--text)}
  .icon:active{transform:scale(.92)}
  header.bar .title{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
  header.bar .title #convTitle{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.bar .title .tdate{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.bar .title .tdate:empty{display:none}
  #ctxBox{position:relative;flex-shrink:0}
  #barMeta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);
    font-weight:500;font-variant-numeric:tabular-nums;padding:5px 9px;border-radius:9px;transition:background .16s}
  #barMeta:hover{background:var(--panel2)}
  #barMeta[hidden]{display:none}
  #barMeta .ctxbar{width:46px;height:5px;border-radius:4px;background:var(--panel2);overflow:hidden}
  #barMeta .ctxbar i{display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--accent),var(--user2));transition:width .45s ease,background .3s}
  #barMeta.warn .ctxbar i{background:var(--err)}
  #barMeta.warn #ctxPct{color:var(--err)}
  /* 上下文明细弹层(默认收起,点进度条展开)*/
  #ctxPop{position:absolute;top:calc(100% + 8px);right:0;width:248px;z-index:20;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);animation:pop .18s ease;font-variant-numeric:tabular-nums}
  #ctxPop[hidden]{display:none}
  #ctxPop .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
  #ctxPop .ph .t{font-size:12px;color:var(--dim)}
  #ctxPop .ph .m{font-size:13px;font-weight:600}
  #ctxPop .ph .m b{color:var(--accent)}
  #ctxPop.warn .ph .m b{color:var(--err)}
  #ctxPop .pbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-bottom:11px}
  #ctxPop .pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--user2))}
  #ctxPop.warn .pbar i{background:var(--err)}
  #ctxPop .pr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:4.5px 0;color:var(--text)}
  #ctxPop .pr .k{color:var(--dim)}
  #ctxPop .pr .v .pp{color:var(--dim2);margin-left:5px}
  #ctxPop .pr.sub .k{padding-left:12px;color:var(--dim2);font-size:12px}
  #ctxPop .pr.sep{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  #ctxPop .pr .mdl{font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
  #themeBtn{font-size:17px}
  #hamb{display:none}

  #messages{flex:1;overflow-y:auto;padding:18px 16px 8px;-webkit-overflow-scrolling:touch;position:relative}
  .wrap{max-width:820px;margin:0 auto}
  .row{display:flex;margin:10px 0;animation:pop .32s cubic-bezier(.2,.7,.3,1)}
  .row.me{justify-content:flex-end}
  .bubble{max-width:86%;padding:10px 14px;border-radius:var(--radius);white-space:normal;word-wrap:break-word;
    overflow-wrap:anywhere;box-shadow:var(--bubble-shadow)}
  .row.me .bubble{background:linear-gradient(135deg,var(--user1),var(--user2));color:var(--on-user);border-bottom-right-radius:6px}
  .row.ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .bubble.pending{color:var(--dim)}
  .status{font-size:13px;color:var(--dim);margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
  .status .chip{display:inline-flex;align-items:center}
  .status .chip.live{color:var(--accent)}
  .dots{display:inline-flex;gap:3px;margin-left:5px;align-items:center}
  .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.28;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.28} 30%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .think{font-size:13px;color:var(--dim);border-left:2px solid var(--line2);padding:2px 0 2px 10px;margin-bottom:8px;
    white-space:pre-wrap;max-height:140px;overflow:auto;display:none}
  .think.show{display:block}
  .thinktog{font-size:12px;color:var(--accent);margin-bottom:6px;display:none;align-items:center;gap:6px;cursor:pointer;user-select:none}

  /* markdown */
  .bubble p{margin:.5em 0}
  .bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:.7em 0 .4em;line-height:1.3}
  .bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3{font-size:1.08em}
  .bubble ul,.bubble ol{margin:.4em 0;padding-left:1.3em}
  .bubble li{margin:.2em 0}
  .bubble code{background:var(--code-inline);padding:.12em .4em;border-radius:6px;font-size:.9em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .row.me code{background:rgba(255,255,255,.2)}
  .bubble pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    overflow-x:auto;margin:.6em 0}
  .bubble pre.code code{background:none;padding:0;font-size:.86em;line-height:1.5;color:var(--code-fg)}
  .bubble blockquote{margin:.5em 0;padding:.2em .9em;border-left:3px solid var(--accent2);color:var(--dim)}
  .bubble table{border-collapse:collapse;margin:.6em 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
  .bubble th,.bubble td{border:1px solid var(--line);padding:7px 11px;text-align:left}
  .bubble th{background:var(--panel2);font-weight:600}
  .bubble a{word-break:break-all}
  .bubble img{max-width:100%;border-radius:10px}
  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .imgs img{width:120px;height:120px;object-fit:cover;border-radius:10px}

  /* 选项按钮(如 /model) */
  .choice{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .choice button{text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;
    transition:background .16s,border-color .16s,transform .12s}
  .choice button:hover{border-color:var(--accent)}
  .choice button:active{transform:scale(.98)}
  .choice button:disabled{opacity:.45;pointer-events:none}

  /* 工具卡片:diff / todo 清单 / 计划卡 / 命令预览(复刻 Claude Code 的结构化过程) */
  .toolbox{display:flex;flex-direction:column;gap:8px;margin:6px 0}
  .toolcard{border:1px solid var(--line2);border-radius:10px;overflow:hidden;font-size:13px}
  .tc-head{padding:6px 11px;background:var(--panel2);font-weight:600;display:flex;gap:7px;align-items:center;
    cursor:pointer;user-select:none}
  .tc-head .tc-path{font-weight:400;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-body{padding:8px 11px}
  .tc-body.collapsed{display:none}
  .tc-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;
    background:var(--panel2);padding:7px 9px;border-radius:7px;line-height:1.5}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;line-height:1.55;
    border-radius:7px;overflow:hidden}
  .diff .ln{display:block;padding:0 8px}
  .diff .del{background:rgba(220,70,70,.15)}
  .diff .add{background:rgba(70,180,100,.17)}
  .diff .del::before{content:"− ";opacity:.7}
  .diff .add::before{content:"+ ";opacity:.7}
  .todo{list-style:none;margin:0;padding:0;font-size:13px}
  .todo li{padding:3px 0;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
  .todo li.done{opacity:.5;text-decoration:line-through}
  .todo li.doing{font-weight:600;color:var(--accent)}
  .plan{font-size:13.5px;line-height:1.6}
  .plan h1,.plan h2,.plan h3{font-size:14.5px;margin:.5em 0 .3em}
  /* 工具结果块(⎿ 折叠展开,复刻 Claude Code 的结果预览) */
  .tc-res{border-top:1px solid var(--line2)}
  .tc-res-head{padding:5px 11px;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center;
    cursor:pointer;user-select:none}
  .tc-res-head .tc-res-prev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .tc-res.err .tc-res-head{color:#d94f4f}
  .tc-res-body{margin:0;padding:7px 11px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    white-space:pre-wrap;word-break:break-all;line-height:1.5;background:var(--panel2);max-height:340px;overflow-y:auto}
  .tc-res-body.collapsed{display:none}
  /* Task 卡片内的子代理实时动态(工具步数 chips) */
  .tc-sub{border-top:1px dashed var(--line2);padding:6px 11px;display:flex;flex-wrap:wrap;gap:4px 10px;
    font-size:12px;color:var(--dim);align-items:center}
  .tc-sub:empty{display:none}

  /* 空状态 / 欢迎屏 */
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:none}
  #empty .elogo{width:72px;height:72px;border-radius:22px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--accent),var(--user2));display:flex;align-items:center;justify-content:center;
    font-size:36px;color:#fff;box-shadow:0 10px 36px var(--glow1);animation:pop .5s ease}
  #empty h2{margin:0 0 6px;font-size:24px;font-weight:600;
    font-family:ui-serif,Georgia,"Times New Roman","Songti SC",serif}
  #empty p{margin:0 0 24px;color:var(--dim);font-size:14px}
  #empty .sugs{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:440px;pointer-events:auto}
  #empty .sug{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 16px;font-size:14px;
    color:var(--text);transition:background .16s,border-color .16s,transform .12s}
  #empty .sug:hover{border-color:var(--accent)}
  #empty .sug:active{transform:scale(.96)}

  /* 回到底部 */
  #scrollBtn{position:absolute;right:18px;bottom:16px;width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--line2);color:var(--text);font-size:19px;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:8;
    opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s}
  #scrollBtn.show{opacity:1;transform:none;pointer-events:auto}

  /* 输入区 */
  #composer{background:var(--bg2);padding:8px 12px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  #composer .cwrap{max-width:820px;margin:0 auto}
  /* 键盘弹出时:此刻已无 home indicator 留白,去掉安全区、缩小底部间距,让输入框贴近键盘 */
  body.kb #composer{padding-bottom:6px;padding-top:8px}
  /* 输入框底部工具条:左=上传,右=模型 + 发送 */
  .inbar{display:flex;align-items:center;gap:4px;margin-top:2px}
  .inbar .spacer{flex:1}
  /* 模型选择器(发送按钮左侧,无边框)*/
  #modelBox{position:relative}
  #modelBtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);font-weight:500;
    padding:6px 8px;border-radius:9px;max-width:150px;transition:color .16s,background .16s,transform .12s}
  #modelBtn #modelName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #modelBtn:hover{color:var(--text);background:var(--panel2)}
  #modelBtn:active{transform:scale(.96)}
  /* 折线箭头(chevron):border 描边 + 旋转,替代实心三角,略大;默认指向右,.down 转朝下 */
  .chev{flex-shrink:0;width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;
    transform:translateX(-1px) rotate(-45deg);transition:transform .15s}   /* 收起:朝右(向左补 1px 视觉居中) */
  .chev.down{transform:translateY(-1px) rotate(45deg)}                      /* 展开:朝下 */
  #modelBtn .caret{opacity:.6;flex-shrink:0}
  #modelPop{position:absolute;bottom:calc(100% + 8px);right:0;min-width:236px;z-index:20;
    background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;
    box-shadow:var(--shadow);animation:pop .16s ease}
  #modelPop[hidden]{display:none}
  #modelPop .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    text-align:left;padding:9px 11px;border-radius:10px;font-size:13px;color:var(--text);transition:background .14s}
  #modelPop .mi:hover{background:var(--panel2)}
  #modelPop .mi.on{color:var(--accent)}
  #modelPop .mi .mk{color:var(--accent);font-size:12px;flex-shrink:0}
  #thumbs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  #thumbs .t{position:relative}
  #thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
  #thumbs .x{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border-radius:50%;
    width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  /* 竖排输入框:文本区在上(默认约 2 行),工具条在下 */
  .inrow{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);
    border-radius:20px;padding:8px 10px 6px;transition:border-color .18s,box-shadow .18s}
  .inrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  #ta{width:100%;background:none;border:none;color:var(--text);resize:none;font:inherit;
    min-height:46px;max-height:180px;padding:2px 4px;outline:none;line-height:1.5}
  #ta::placeholder{color:var(--dim2)}
  #imgBtn{color:var(--dim);font-size:22px;width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:color .16s,background .16s}
  #imgBtn:hover{color:var(--text);background:var(--panel2)}
  #micBtn{position:relative;color:var(--dim);font-size:18px;width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:color .16s,background .16s,transform .12s}
  #micBtn:hover{color:var(--text);background:var(--panel2)}
  #micBtn:active{transform:scale(.9)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes recIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* 录音行:点 🎤 后整个输入框变成这一条,整行点按即完成(参考 iMessage) */
  #recRow{display:none;align-items:center;gap:11px;cursor:pointer;user-select:none;-webkit-user-select:none;
    background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:0 8px 0 12px;
    min-height:64px;animation:recIn .2s ease;transition:border-color .18s,transform .1s}
  #recRow.show{display:flex}
  #recRow:hover{border-color:var(--err)}
  #recRow:active{transform:scale(.995)}
  #recRow .rdot{width:9px;height:9px;border-radius:50%;background:var(--err);animation:blink 1s infinite;flex-shrink:0;pointer-events:none}
  #recRow #recWave{flex:1;height:36px;min-width:0;pointer-events:none}
  #recRow #recTime{color:var(--err);font-variant-numeric:tabular-nums;font-size:14px;flex-shrink:0;min-width:36px;text-align:right;pointer-events:none}
  #recRow #recHint{color:var(--dim);font-size:12.5px;flex-shrink:0;pointer-events:none}
  #recRow #recCancel{flex-shrink:0;width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:15px;
    display:flex;align-items:center;justify-content:center;background:var(--panel2);transition:color .16s,background .16s}
  #recRow #recCancel:hover{color:var(--text);background:var(--line2)}
  #recRow .busywrap{display:none;align-items:center;gap:9px;color:var(--dim);font-size:13px}
  #recRow .busywrap .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);
    border-top-color:var(--accent);animation:spin .7s linear infinite}
  /* 转写中:整行收起为 spinner 提示 */
  #recRow.busy{cursor:default;border-color:var(--line2)}
  #recRow.busy .rdot,#recRow.busy #recWave,#recRow.busy #recTime,#recRow.busy #recHint,#recRow.busy #recCancel{display:none}
  #recRow.busy .busywrap{display:flex}
  #sendBtn{background:linear-gradient(135deg,var(--user1),var(--user2));color:#fff;border-radius:50%;
    width:34px;height:34px;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:transform .12s,opacity .2s,box-shadow .2s;box-shadow:0 2px 10px var(--glow2)}
  #sendBtn:hover{box-shadow:0 4px 16px var(--glow1)}
  #sendBtn:active{transform:scale(.9)}
  #sendBtn:disabled{opacity:.4;box-shadow:none}

  #backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;backdrop-filter:blur(2px)}

  @media(max-width:760px){
    #sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
    #sidebar.open{transform:translateX(0);box-shadow:2px 0 30px rgba(0,0,0,.5)}
    #hamb{display:flex}
    #backdrop.show{display:block}
  }
  /* 桌面宽屏:基础字号调小(手机保持 16px 不变,避免 iOS 聚焦缩放) */
  @media(min-width:761px){
    html,body{font-size:14px;line-height:1.55}
    #collapseBtn{display:flex}
    /* 收起:侧边栏宽度归零,顶栏 ☰ 变身为"展开"入口 */
    body.sb-collapsed #sidebar{width:0;border-right-color:transparent;overflow:hidden}
    body.sb-collapsed #hamb{display:flex}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .ic{width:14px;height:14px;vertical-align:-2.5px;flex-shrink:0}
  #micBtn .ic{width:17px;height:17px;vertical-align:-4px}
  .pmrow .ic{width:15px;height:15px;vertical-align:-3px;margin-right:2px;color:var(--dim)}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">✻</div>
    <h1>Hermes</h1>
    <p>输入访问口令</p>
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password">
    <button id="loginBtn">进入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" hidden>
  <div id="backdrop"></div>
  <div id="projModal" hidden>
    <div class="pmbox">
      <div class="pmhead">新建项目 · 选一个文件夹当工作目录</div>
      <div class="pmpathrow">
        <input id="pmPath" placeholder="/Users/…(可点下方进入,也可直接粘贴路径)"/>

// ── 主题(深/浅)──────────────────────────────────────────────────────────
function curTheme(){
  const t=document.documentElement.getAttribute("data-theme");
  if(t) return t;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
}
function syncTheme(){
  const dark = curTheme()==="dark";
  $("#themeBtn").textContent = dark ? "☀" : "☾";   // 显示"点击后切到的"目标
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = document.querySelector('meta[name="theme-color"]'); if(m && bg) m.setAttribute("content", bg);
}
function toggleTheme(){
  const next = curTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("hermes_theme", next); }catch(e){}
  syncTheme();
}
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", ()=>{
    if(!document.documentElement.getAttribute("data-theme")) syncTheme();  // 仅在"跟随系统"时联动
  });
}

// ── API ─────────────────────────────────────────────────────────────────
async function api(path, opts={}){
  opts.headers = Object.assign({"X-Auth-Token": S.token}, opts.headers||{});
  const r = await fetch(path, opts);
  if(r.status===401){ showLogin(); throw new Error("401"); }
  return r;
}

    if(r.status===401){ $("#loginErr").textContent="口令错误"; return; }

// ── Markdown 渲染(内置,不依赖 CDN)────────────────────────────────────────
function inlineMd(t){
  t = esc(t);
  const links=[];                                   // 先把 [文字](url) 抠出来占位,避免下面裸链接二次包裹
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,txt,url)=>{
    links.push('<a href="'+url+'" target="_blank" rel="noopener">'+txt+'</a>'); return "L"+(links.length-1)+""; });
  t = t.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/L(\d+)/g,(m,i)=>links[+i]);   // 还原 Markdown 链接
  return t;
}
function mdToHtml(src){
  src = (src||"").replace(/\r\n/g,"\n");
  const codes=[];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codes.push('<pre class="code"><code>'+esc(code.replace(/\n$/,""))+"</code></pre>");
    return " C"+(codes.length-1)+" ";
  });
  const L = src.split("\n"); let out=""; let i=0; let para=[];
  const flush=()=>{ if(para.length){ out+="<p>"+para.map(inlineMd).join("<br>")+"</p>"; para=[]; } };
  const sepRe=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?\s*$/;
  while(i<L.length){
    let ln=L[i];
    const cm=ln.match(/^ C(\d+) $/);
    if(cm){ flush(); out+=codes[+cm[1]]; i++; continue; }
    if(!ln.trim()){ flush(); i++; continue; }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ flush(); const n=m[1].length; out+="<h"+n+">"+inlineMd(m[2])+"</h"+n+">"; i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){ flush(); out+="<hr>"; i++; continue; }
    // 表格
    if(ln.includes("|") && i+1<L.length && sepRe.test(L[i+1])){
      flush();
      const cells=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const head=cells(ln); i+=2; const rows=[];
      while(i<L.length && L[i].includes("|") && L[i].trim()){ rows.push(cells(L[i])); i++; }
      let t="<table><thead><tr>"+head.map(h=>"<th>"+inlineMd(h)+"</th>").join("")+"</tr></thead><tbody>";
      for(const r of rows){ t+="<tr>"+head.map((_,k)=>"<td>"+inlineMd(r[k]||"")+"</td>").join("")+"</tr>"; }
      out+=t+"</tbody></table>"; continue;
    }
    if(m=ln.match(/^\s*>\s?(.*)$/)){ flush(); const q=[]; while(i<L.length&&(m=L[i].match(/^\s*>\s?(.*)$/))){ q.push(m[1]); i++; } out+="<blockquote>"+q.map(inlineMd).join("<br>")+"</blockquote>"; continue; }
    if(/^\s*[-*+]\s+/.test(ln)){ flush(); let h="<ul>"; while(i<L.length&&(m=L[i].match(/^\s*[-*+]\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ul>"; continue; }
    if(/^\s*\d+\.\s+/.test(ln)){ flush(); let h="<ol>"; while(i<L.length&&(m=L[i].match(/^\s*\d+\.\s+(.*)$/))){ h+="<li>"+inlineMd(m[1])+"</li>"; i++; } out+=h+"</ol>"; continue; }
    para.push(ln); i++;
  }
  flush();
  return out;
}

function updateEmpty(){ $("#empty").style.display = $("#wrap").children.length ? "none" : "flex"; }

// ── 顶栏:上下文进度(默认)+ 点击展开 token 明细 ─────────────────────────
const CTX_WINDOW = 200000;  // 兜底窗口;实际以后端按模型回传的 ctx_window 为准
function fmtTok(n){ n=+n||0; if(n>=1000) return (n/1000).toFixed(n>=10000?0:1)+"k"; return String(n); }
// d 可以是会话对象或 done 事件,字段同名
function setMeta(d){
  d = d || {};
  S.meta = {
    ctx:+d.ctx_tokens||0, total:+d.total_tokens||0, win:+d.ctx_window||CTX_WINDOW,
    lin:+d.last_in||0, lc:+d.last_cache||0, lout:+d.last_out||0, model:d.model||"",
  };
  setModel(d.chosen_model||"");   // 胶囊显示"会话选定的模型",空则回落默认(不用带日期的实跑 id)
  renderMeta();
}

// ── 模型选择器 ────────────────────────────────────────────────────────────
async function loadModels(){
  try{ const r=await api("/models"); S.models=await r.json(); renderModelChip(); }catch(e){}
}
function modelShort(id){
  if(!id) return "模型";
  const ch=S.models.choices||[];
  // 精确命中,否则按前缀兜底(实跑 id 常带日期,如 claude-haiku-4-5-20251001)
  const c=ch.find(x=>x[0]===id) || ch.find(x=>id.indexOf(x[0])===0 || x[0].indexOf(id)===0);
  if(c) return c[1].split("·")[0].trim();   // 取 "Opus 4.8 · 最强" 里的短名
  return id.replace(/^claude-/,"").replace(/-\d{6,}$/,"");  // 去 claude- 前缀与日期后缀
}
function curModel(){ return S.model || S.models.default || ""; }
function setModel(id){ S.model=id||""; renderModelChip(); }
function renderModelChip(){ $("#modelName").textContent=modelShort(curModel()); }
function renderModelPop(){
  const pop=$("#modelPop"), cur=curModel();
  pop.innerHTML=(S.models.choices||[]).map(([id,label])=>
    '<button type="button" class="mi'+(id===cur?" on":"")+'" data-m="'+esc(id)+'">'+
    '<span class="ml">'+esc(label)+'</span>'+(id===cur?'<span class="mk">✓</span>':'')+'</button>'
  ).join("") || '<div style="padding:9px 11px;color:var(--dim);font-size:13px">暂无可选模型</div>';
  pop.querySelectorAll(".mi").forEach(b=>{ b.onclick=()=>pickModel(b.dataset.m); });
}
function pickModel(id){
  $("#modelPop").hidden=true;
  if(!id || id===curModel()) return;
  setModel(id);            // 乐观更新胶囊,下一轮 done 事件会与服务端对齐
  sendCmd("/model "+id);   // 复用后端 /model 命令,按会话切换
}
$("#modelBtn").onclick=e=>{ e.stopPropagation(); const p=$("#modelPop");
  if(p.hidden){ renderModelPop(); p.hidden=false; } else p.hidden=true; };
document.addEventListener("click", e=>{ const b=$("#modelBox"); if(b && !b.contains(e.target)) $("#modelPop").hidden=true; });
function metaRow(k, v, pp, cls){
  return '<div class="pr'+(cls?" "+cls:"")+'"><span class="k">'+k+'</span>'+
    '<span class="v">'+v+(pp?'<span class="pp">'+pp+'</span>':'')+'</span></div>';
}
function renderMeta(){
  const m=S.meta, bar=$("#barMeta"), pop=$("#ctxPop");
  if(!m || (!m.ctx && !m.total)){ bar.hidden=true; pop.hidden=true; return; }  // 全新会话不显示
  bar.hidden=false;
  const win=m.win||CTX_WINDOW, pct=Math.min(100, Math.round(m.ctx/win*100)), warn=pct>=80;
  $("#ctxFill").style.width=pct+"%"; $("#ctxPct").textContent=pct+"%";
  bar.classList.toggle("warn", warn); pop.classList.toggle("warn", warn);
  const free=Math.max(0,win-m.ctx), fpct=Math.max(0,100-pct);
  pop.innerHTML =
    '<div class="ph"><span class="t">上下文窗口</span><span class="m">'+fmtTok(m.ctx)+' / '+fmtTok(win)+' <b>'+pct+'%</b></span></div>'+
    '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
    metaRow("已用上下文", fmtTok(m.ctx), pct+"%")+
    metaRow("空闲", fmtTok(free), fpct+"%")+
    metaRow("本轮新增输入", fmtTok(m.lin), "", "sep")+
    metaRow("其中缓存复用", fmtTok(m.lc), "", "sub")+
    metaRow("本轮输出", fmtTok(m.lout), "")+
    metaRow("累计消耗", fmtTok(m.total), "")+
    (m.model ? '<div class="pr sep"><span class="k">模型</span><span class="mdl">'+esc(m.model)+'</span></div>' : "");
}
$("#barMeta").onclick = e=>{ e.stopPropagation(); const p=$("#ctxPop"); p.hidden=!p.hidden; };
document.addEventListener("click", e=>{ const b=$("#ctxBox"); if(b && !b.contains(e.target)) $("#ctxPop").hidden=true; });

// ── 会话列表 ─────────────────────────────────────────────────────────────
function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts*1000), n=new Date();
  const sameDay=d.toDateString()===n.toDateString();
  return sameDay ? d.toTimeString().slice(0,5) : (d.getMonth()+1)+"/"+d.getDate(); }
// 详情标题下显示的日期(今天只显时间,同年显月日,跨年带年份)
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts*1000), n=new Date(); const t=d.toTimeString().slice(0,5);
  if(d.toDateString()===n.toDateString()) return "今天 "+t;
  const md=(d.getMonth()+1)+"月"+d.getDate()+"日";
  return (d.getFullYear()===n.getFullYear()?"":d.getFullYear()+"年")+md+" "+t; }
function updateHeaderDate(){ const c=S.convs.find(x=>x.conv===S.conv); $("#convDate").textContent = c ? fmtDate(c.last_ts) : ""; }
async function loadConvs(){
  const r = await api("/conversations"); const d = await r.json();
  const main = d.main; main.conv="main"; main.title="主会话"; main.pinned=true;
  // 全部会话(含主会话)按最近活跃排序,最新的排最前面
  S.convs = [main, ...d.conversations].sort((a,b)=>(b.last_ts||0)-(a.last_ts||0));
  renderConvs(); updateHeaderDate();   // 会话刷新后同步标题栏日期(如刚落一轮 last_ts 变了)
}
// 从 conv id 解析它属于哪个项目:p<hash>:<convid> → hash;否则 null(默认项目)
function convProject(conv){
  const m = String(conv).replace(/^local-/,"").match(/^p([0-9a-f]+):/);
  return m ? m[1] : null;
}
// 分组的存储键:默认项目用固定串,项目用其 hash
function grpKey(hash){ return hash===null ? "__default__" : hash; }
function saveExpanded(){ try{ localStorage.setItem("hermes_expanded", JSON.stringify([...S.expanded])); }catch(e){} }
function loadExpanded(){ try{ S.expanded=new Set(JSON.parse(localStorage.getItem("hermes_expanded")||"[]")); }catch(e){ S.expanded=new Set(); } }

function convsInGroup(hash){
  return S.convs.filter(c => c.pinned ? hash===null : convProject(c.conv)===hash);
}
// 手风琴:默认项目 + 每个项目一个可折叠分组,展开后列出其会话;末尾一行「新建项目」
function renderConvs(){
  const box=$("#convList"); box.innerHTML="";
  const groups=[{hash:null,name:"默认项目"}].concat(S.projects.map(p=>({hash:p.hash,name:p.name})));
  for(const g of groups){
    const convs=convsInGroup(g.hash);
    const open=S.expanded.has(grpKey(g.hash));
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent=g.name; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);   // 折线箭头,展开时旋转朝下
    const add=el("button","pgadd"); add.textContent="＋"; add.title="在此项目下新建会话";
    add.onclick=ev=>{ ev.stopPropagation(); newChatIn(g.hash); }; h.append(add);
    if(g.hash!==null){
      const rm=el("button","pgrm"); rm.textContent="✕"; rm.title="移除项目(不删文件夹,可再加回)";
      rm.onclick=ev=>{ ev.stopPropagation(); removeProject(g.hash); }; h.append(rm);
    }
    h.onclick=()=>toggleGroup(g.hash);
    box.append(h);
    if(!open) continue;
    for(const c of convs){
      const e=el("div","conv ingroup"+(c.conv===S.conv?" active":"")+(c.pinned?" pinned":""));
      const ct=el("div","ct"); ct.textContent=c.title||"新对话"; e.append(ct);
      const tm=fmtTime(c.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; e.append(tmEl); }   // 会话时刻:名称右侧
      if(c.pinned){ const star=el("span","star"); star.textContent="★"; e.append(star); }   // 主会话:右侧弱化星标
      else { const more=el("button","more"); more.textContent="⋯"; more.title="更多"; more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,c.conv);}; e.append(more); }
      e.onclick=()=>openConv(c.conv);
      box.append(e);
    }
  }
  const addp=el("div","projgrp projadd"); addp.textContent="＋ 新建项目…"; addp.onclick=openProjModal; box.append(addp);
}

// ── 项目 ─────────────────────────────────────────────────────────────────
async function loadProjects(){
  try{ const r=await api("/projects"); S.projects=(await r.json()).projects||[]; }
  catch(e){ S.projects=[]; }
}
function toggleGroup(hash){
  const k=grpKey(hash);
  if(S.expanded.has(k)) S.expanded.delete(k); else S.expanded.add(k);
  saveExpanded(); renderConvs();
}
// 在指定项目下开新会话(顶部 ＋新对话 用当前活跃项目;分组 ＋ 用该分组)
function newChatIn(hash){
  S.project=hash; S.expanded.add(grpKey(hash)); saveExpanded();
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const conv="local-"+(hash?("p"+hash+":"):"")+id;
  S.convs.unshift({conv,title:"新对话",turns:0,last_ts:null});
  openConv(conv); $("#ta").focus();
}
function newChat(){ newChatIn(S.project); }

async function removeProject(hash){
  try{ await api("/projects/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hash})}); }
  catch(e){ alert("移除失败"); return; }
  S.expanded.delete(hash); saveExpanded();
  const activeGone = convProject(S.conv)===hash;   // 当前会话属于被移除项目 → 回落主会话
  if(S.project===hash) S.project=null;
  await loadProjects();
  if(activeGone){ openConv("main"); } else { renderConvs(); }
}

async function browseTo(dir){
  let d;
  try{ const r=await api("/browse"+(dir?("?dir="+encodeURIComponent(dir)):"")); d=await r.json(); }
  catch(e){ return; }
  S.browseDir=d.dir; $("#pmPath").value=d.dir;

  if(d.parent){ const up=el("div","pmrow pmup"); up.textContent="⬆ 上一级"; up.onclick=()=>browseTo(d.parent); box.append(up); }
  for(const e of d.entries){ const row=el("div","pmrow"); row.innerHTML=ic("folder")+" "+esc(e.name); row.onclick=()=>browseTo(e.path); box.append(row); }

async function createProject(path){
  path=(path||"").trim(); if(!path){ alert("请先选或输入一个目录"); return; }
  try{
    const r=await api("/projects/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path})});

    (descHtml?'<div class="sdesc">'+descHtml+'</div>':'')+'</div>'+

    (canDelete?'<button class="miniact danger" data-mdel="'+esc(id)+'">删除</button>':'')+

function mcpFormHtml(){
  return '<div class="mcpform" id="mcpForm">'+
    '<div class="fld"><label>名称(唯一标识)</label><input id="mfName" placeholder="filesystem"></div>'+
    '<div class="fld"><label>类型</label><select id="mfType"><option value="stdio">stdio(本地命令)</option><option value="sse">sse(远程)</option><option value="http">http(远程)</option></select></div>'+
    '<div id="mfStdio">'+
      '<div class="fld"><label>命令 command</label><input id="mfCmd" placeholder="npx"></div>'+

    '</div>'+

      '<div class="fld"><label>URL</label><input id="mfUrl" placeholder="https://example.com/mcp"></div>'+

  '</div>';

function bindMcpPane(){
  $("#setPane").querySelectorAll("[data-mtgl]").forEach(inp=>{
    inp.onchange = async()=>{
      const key=inp.dataset.mtgl, on=inp.checked;
      inp.closest(".srow").classList.toggle("off", !on);
      if(key==="hermes"){ await api("/settings/mcp/hermes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:on})}); SET.data.mcp.hermes_enabled=on; }
      else if(key.startsWith("ext:")){ const name=key.slice(4); await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"toggle",name,enabled:on})}); const x=SET.data.mcp.external.find(e=>e.name===name); if(x)x.enabled=on; }
    };
  });
  $("#setPane").querySelectorAll("[data-mdel]").forEach(b=>{
    b.onclick = async()=>{
      const name=b.dataset.mdel;
      if(!confirm("删除外部 MCP「"+name+"」?")) return;
      await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"remove",name})});
      SET.data.mcp.external = SET.data.mcp.external.filter(e=>e.name!==name);
      renderMcpPane();
    };
  });
  const addBtn=$("#mcpAddBtn"); if(addBtn) addBtn.onclick=()=>{ SET.mcpFormOpen=true; renderMcpPane(); };
  const typeSel=$("#mfType");
  if(typeSel){
    const sync=()=>{ const t=typeSel.value; $("#mfStdio").hidden=(t!=="stdio"); $("#mfRemote").hidden=(t==="stdio"); };
    typeSel.onchange=sync; sync();
    $("#mfCancel").onclick=()=>{ SET.mcpFormOpen=false; renderMcpPane(); };
    $("#mfSave").onclick=saveMcpForm;
  }
}
function parseKV(text){ const o={}; (text||"").split("\n").forEach(l=>{ l=l.trim(); if(!l) return; const i=l.indexOf("="); if(i>0) o[l.slice(0,i).trim()]=l.slice(i+1).trim(); }); return o; }
async function saveMcpForm(){
  const err=$("#mfErr"); err.textContent="";
  const name=$("#mfName").value.trim();
  if(!name){ err.textContent="请填名称"; return; }
  const type=$("#mfType").value;
  const body={action:"add", name, type, enabled:true};
  if(type==="stdio"){
    if(!$("#mfCmd").value.trim()){ err.textContent="stdio 需要 command"; return; }
    body.command=$("#mfCmd").value.trim();
    body.args=$("#mfArgs").value.trim().split(/\s+/).filter(Boolean);
    body.env=parseKV($("#mfEnv").value);
  } else {
    if(!$("#mfUrl").value.trim()){ err.textContent=type+" 需要 URL"; return; }
    body.url=$("#mfUrl").value.trim();
    body.headers=parseKV($("#mfHeaders").value);
  }
  const r=await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.error){ err.textContent=d.error; return; }
  SET.mcpFormOpen=false;
  const rr=await api("/settings"); SET.data=await rr.json();  // 拉回最新列表
  renderMcpPane();
}

// 会话「更多」浮层菜单(单例):点 ⋯ 弹出,目前只放「删除」,点即执行(不再二次确认)
let convMenuEl=null, convMenuBtn=null;
function closeConvMenu(){
  if(convMenuBtn){ convMenuBtn.classList.remove("on"); convMenuBtn=null; }
  if(convMenuEl){ convMenuEl.remove(); convMenuEl=null; }
}
function openConvMenu(btn, conv){
  if(convMenuBtn===btn){ closeConvMenu(); return; }   // 再点一次同一个 → 收起
  closeConvMenu();
  convMenuBtn=btn; btn.classList.add("on");
  const m=el("div","convmenu"); m.style.visibility="hidden";
  const del=el("button","cmitem danger"); del.innerHTML=ic("trash")+" 删除";
  del.onclick=ev=>{ ev.stopPropagation(); closeConvMenu(); delConv(conv); };
  m.append(del); document.body.append(m); convMenuEl=m;
  // 右对齐按钮,默认显示在其下方;贴到视口底部时自动上翻
  const r=btn.getBoundingClientRect();
  let top=r.bottom+4, left=r.right-m.offsetWidth;
  if(top+m.offsetHeight>window.innerHeight) top=r.top-4-m.offsetHeight;
  m.style.top=Math.max(6,top)+"px"; m.style.left=Math.max(6,left)+"px"; m.style.visibility="visible";
}

async function delConv(conv){
  const idx=S.convs.findIndex(x=>x.conv===conv);
  if(idx<0) return;
  const removed=S.convs[idx], wasActive=(S.conv===conv);
  // 乐观假删:先从列表移除并立即重绘,不等服务器
  S.convs.splice(idx,1); delete S.histCache[conv]; renderConvs();
  if(wasActive) openConv(S.convs[0]?S.convs[0].conv:"main");   // 删的是当前会话→切到最近一个
  // 纯本地会话(从未发过消息)服务端没有记录,删完即止
  if(String(conv).startsWith("local-")) return;
  try{
    await api("/conv/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv})});
  }catch(err){
    // 删除失败:回滚列表并提示
    S.convs.splice(idx,0,removed); renderConvs();
    alert("删除失败,已恢复该会话");
  }
}

// ── 打开 / 切换会话 ──────────────────────────────────────────────────────
// 把一组 turns 铺进消息区(切会话 / 缓存回填共用)
function renderTurns(turns){
  $("#wrap").innerHTML="";
  for(const t of turns){ addBubble("me", t.user); const b=addBubble("ai",""); b.innerHTML=mdToHtml(t.assistant); }
  updateEmpty(); scrollDown();
}
async function openConv(conv){
  S.conv=conv; S.stream=null;
  S.project=convProject(conv); S.expanded.add(grpKey(S.project)); saveExpanded();  // 活跃项目随打开的会话联动,并确保其分组展开
  const c=S.convs.find(x=>x.conv===conv);
  $("#convTitle").textContent = c ? (c.title||"新对话") : "新对话";
  updateHeaderDate();                            // 标题下显示该会话日期
  setMeta(c || {}); $("#ctxPop").hidden=true;   // 切会话时收起明细弹层
  renderConvs(); closeSidebar();
  const cached = S.histCache[conv];
  if(cached){ renderTurns(cached); }            // 命中缓存:立即渲染,消除"先闪空屏再出内容"
  else { $("#wrap").innerHTML=""; updateEmpty(); }
  if(conv && !String(conv).startsWith("local-")){
    try{
      const r=await api("/history?conv="+encodeURIComponent(conv)); const d=await r.json();
      if(S.conv!==conv) return;   // 拉取期间已切到别的会话 → 丢弃过期结果,避免内容错乱
      S.histCache[conv]=d.turns;
      // 仅当与已渲染的缓存不一致才重绘,避免命中缓存时白闪一下
      if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
    }catch(e){}
    return;
  }
  if(S.conv!==conv) return;
  updateEmpty(); scrollDown();
}

// ── 重加载历史(SSE 连接恢复后)──────────────────────────────────────────
async function reloadHistory(){
  if(!S.conv || String(S.conv).startsWith("local-")) return;  // 只在非本地会话拉
  try{
    const r=await api("/history?conv="+encodeURIComponent(S.conv));
    const d=await r.json();
    if(S.conv!==S.conv) return;  // 拉取期间已切会话 → 丢弃
    const cached=S.histCache[S.conv];
    S.histCache[S.conv]=d.turns;
    if(!cached || JSON.stringify(cached)!==JSON.stringify(d.turns)) renderTurns(d.turns);
  }catch(e){}
}

// ── 消息气泡 ─────────────────────────────────────────────────────────────

function scrollDown(){ const m=$("#messages"); requestAnimationFrame(()=>{ m.scrollTop=m.scrollHeight; }); }

// ── SSE 流式接收 ─────────────────────────────────────────────────────────
function connect(){
  if(S.es) S.es.close();
  S.es = new EventSource("/events?token="+encodeURIComponent(S.token));
  S.es.onmessage = ev=>{ try{
    const d=JSON.parse(ev.data);
    if(d.id){ if(d.id<=S.lastId) return; S.lastId=d.id; }  // 补发/重复的老事件直接丢弃
    handleEvent(d);
  }catch(e){} };
  S.es.onerror = ()=>{
    // EventSource 会自动重连,但重连后的历史消息可能丢失(缓冲转圈或服务端重启)
    // 延迟一下,待连接稳定后拉一下历史,确保没漏消息(特别是重启后的系统消息)
    setTimeout(()=>{ if(S.es&&S.es.readyState===1) reloadHistory(); }, 1500);
  };
}
function ensureStream(){
  // 为当前会话准备一个流式 assistant 气泡(含状态行/思考/正文)
  if(S.stream) return S.stream;
  const row=el("div","row ai");
  const bubble=el("div","bubble");
  const status=el("div","status");
  const thinktog=el("div","thinktog"); const tcv=el("span","chev");
  thinktog.append(tcv, document.createTextNode("思考过程"));
  const think=el("div","think");
  const toolbox=el("div","toolbox");   // diff / todo / 计划卡 / 命令预览挂这里
  const body=el("div"); body.dataset.raw="";
  bubble.append(thinktog,think,toolbox,body,status);  // 状态行(工作中…)放气泡底部,像 TG 的打字指示
  row.append(bubble); $("#wrap").append(row); updateEmpty();
  thinktog.onclick=()=>{ const on=think.classList.toggle("show"); tcv.classList.toggle("down", on); };
  S.stream={row,bubble,status,think,thinktog,toolbox,body,tools:[],cards:{},subs:{},t0:Date.now()};
  // 状态行的耗时计数每秒走字;流被任何路径丢弃(完成/切会话)都会自行停表,不泄漏
  const tm=setInterval(()=>{ if(!S.stream||S.stream.timer!==tm){ clearInterval(tm); return; } renderStatus(); }, 1000);
  S.stream.timer=tm;
  renderStatus();  // 初始即显示"💭 思考中…"动画
  scrollDown(); return S.stream;
}
let renderPending=false;
function renderBody(){
  if(renderPending||!S.stream) return; renderPending=true;
  requestAnimationFrame(()=>{ renderPending=false; if(S.stream){ S.stream.body.innerHTML=mdToHtml(S.stream.body.dataset.raw); scrollDown(); } });
}
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';
function renderStatus(){
  if(!S.stream) return;
  const t=S.stream.tools, hasBody=!!S.stream.body.dataset.raw;
  // 工具 chip 已下放到 toolbox 卡片,这里不再重复;只留一条持续的"工作中/思考中"指示
  const secs=Math.max(0, Math.round((Date.now()-(S.stream.t0||Date.now()))/1000));
  const tick=secs>=1?(" · "+(secs>=60?Math.floor(secs/60)+"m"+(secs%60)+"s":secs+"s")):"";
  // 有正文 或 有工具在跑 → 工作中;纯思考(啥都没出)→ 思考中(始终带动画,像 TG)
  const working = hasBody || t.some(x=>!x.done);
  const label = working ? "工作中" : "思考中";
  S.stream.status.innerHTML = '<span class="chip live">'+label+DOTS+esc(tick)+'</span>';
}
function finalizeStream(finalText){
  if(!S.stream) return;
  if(S.stream.timer) clearInterval(S.stream.timer);
  S.stream.status.remove(); S.stream.thinktog.remove(); S.stream.think.remove();
  // 回合已结束:还没点的审批按钮全部失效(点了也只会收到"已过期")
  S.stream.bubble.querySelectorAll(".choice button").forEach(b=>{ b.disabled=true; });
  S.stream.body.innerHTML = mdToHtml(finalText!==undefined?finalText:S.stream.body.dataset.raw);
  S.stream=null; scrollDown();
}
function handleEvent(e){
  // 会话有新回合 → 历史已变,作废其缓存,下次打开会重新拉取
  if(e.type==="done"||e.type==="message") delete S.histCache[e.conv];
  if(e.conv!==S.conv){ // 别的会话在后台完成 → 刷新侧边栏,不打断当前视图
    if(e.type==="done"||e.type==="message") loadConvs();
    return;
  }
  switch(e.type){
    case "start": ensureStream(); break;
    case "thinking": { const s=ensureStream(); s.thinktog.style.display="flex"; s.think.textContent=e.text; renderStatus(); break; }
    case "text": { const s=ensureStream(); s.body.dataset.raw=e.text; renderBody(); renderStatus(); break; }
    case "tool_start": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:false, ok:true}); }
      else s.tools.push({name:e.name, id:e.tool_id, done:false, ok:true, subN:0});
      renderStatus(); break; }
    case "tool_input": { const s=ensureStream();
      if(e.parent) break;   // 子代理内部工具的入参不展大卡片(动态在 Task 卡里),避免刷屏
      const card=renderToolCard(e.name, e.input||{});
      if(card){ if(e.tool_id) s.cards[e.tool_id]=card; s.toolbox.append(card); scrollDown(); } break; }
    case "tool_end": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:true, ok:e.ok}); renderStatus(); break; }
      // 优先按 tool_id 配对(并行同名工具不会错标),回退按名字
      const it=(e.tool_id&&s.tools.find(x=>x.id===e.tool_id&&!x.done))
        ||s.tools.find(x=>x.name===e.name&&!x.done)||s.tools[s.tools.length-1];
      if(it){it.done=true;it.ok=e.ok;}
      attachResult(s, e); renderStatus(); break; }
    case "done": finalizeStream(e.text); setMeta(e); loadConvs(); break;
    case "message": // 命令回复 / 报错 / cron 推送
      if(S.stream && !S.stream.body.dataset.raw){ finalizeStream(e.text); }
      else { S.stream=null; addBubble("ai", e.text); }
      loadConvs(); break;
    case "choice": renderChoice(e); break;
  }
}
function renderChoice(e){
  const box=el("div","choice");
  for(const [cmd,label] of e.options){ const btn=el("button"); btn.textContent=label; btn.onclick=()=>{ box.remove(); send(cmd, label); }; box.append(btn); }
  if(S.stream){
    // 回合进行中(审批闸/追问):嵌进当前流式气泡的过程区,绝不能删掉正在渲染的工具卡
    const card=el("div","toolcard");
    const head=el("div","tc-head"); head.innerHTML=ic("lock")+" 需要你的确认";
    const bodyw=el("div","tc-body");
    const p=el("div"); p.innerHTML=mdToHtml(e.prompt);
    bodyw.append(p, box);
    card.append(head, bodyw);
    S.stream.toolbox.append(card); scrollDown();
    return;
  }
  // 无进行中的回合(如 /model 选择):独立气泡
  const b=addBubble("ai", e.prompt);
  b.append(box); scrollDown();
}

// ── 工具卡片渲染(diff / todo 清单 / 计划卡 / 命令预览)──────────────────────
function toolCardShell(title, pathText, bodyEl, collapsed){
  const card=el("div","toolcard");
  const head=el("div","tc-head");
  head.innerHTML='<span>'+title+'</span>'+(pathText?'<span class="tc-path">'+esc(pathText)+'</span>':'');
  const bodyWrap=el("div","tc-body"+(collapsed?" collapsed":""));
  bodyWrap.append(bodyEl);
  head.onclick=()=>bodyWrap.classList.toggle("collapsed");
  card.append(head,bodyWrap);
  return card;
}
function diffEl(oldStr, newStr){
  const d=el("div","diff");
  if(oldStr){ for(const l of oldStr.split("\n")){ const s=el("span","ln del"); s.textContent=l; d.append(s); } }
  if(newStr){ for(const l of newStr.split("\n")){ const s=el("span","ln add"); s.textContent=l; d.append(s); } }
  return d;
}
// ── 子代理(Task)动态:嵌进 Task 卡片的实时工具 chips ──────────────────────
function subUpsert(s, pid, item){
  const st = s.subs[pid] || (s.subs[pid]={list:[]});
  let t = item.id ? st.list.find(x=>x.id===item.id) : null;
  if(!t && item.done) t = [...st.list].reverse().find(x=>x.name===item.name && !x.done);
  if(t){ Object.assign(t, item); }
  else {
    st.list.push(item);
    const p=s.tools.find(x=>x.id===pid); if(p) p.subN=(p.subN||0)+1;  // Task chip 上的步数
  }
  renderSub(s, pid);
}
function renderSub(s, pid){
  const card=s.cards[pid]; if(!card||!card._sub) return;
  const list=(s.subs[pid]||{list:[]}).list;
  const bits=['<span>'+ic("zap")+" "+list.length+' 步</span>'];
  for(const x of list.slice(-8))
    bits.push('<span>'+esc(x.name)+(x.done?(x.ok?" ✓":" ✗"):DOTS)+'</span>');
  card._sub.innerHTML=bits.join("");
}
// ── 工具结果块(⎿ 折叠展开):挂在入参卡下方;没有卡的工具出错/有结果时补一张 ──
function resultEl(e){
  const w=el("div","tc-res"+(e.ok?"":" err"));
  const head=el("div","tc-res-head");
  const cv=el("span","chev");
  head.append(cv, document.createTextNode(e.ok?"结果":"出错"));
  if(e.preview){ const pv=el("span","tc-res-prev"); pv.textContent=e.preview; head.append(pv); }
  const body=el("pre","tc-res-body collapsed");
  body.textContent=(e.detail||"").trim()||"(无输出)";
  head.onclick=()=>{ const c=body.classList.toggle("collapsed"); cv.classList.toggle("down", !c); };
  w.append(head, body);
  return w;
}
function attachResult(s, e){
  const det=(e.detail||"").trim();
  let card=e.tool_id ? s.cards[e.tool_id] : null;
  if(!card){
    if(e.ok && !det) return;              // 成功且无输出:chip 的 ✓ 已表达,不补卡
    card=toolCardShell(ic(e.ok?"wrench":"warn")+" "+esc(e.name), "", el("div"), true);
    if(e.tool_id) s.cards[e.tool_id]=card;
    s.toolbox.append(card);
  }
  card.append(resultEl(e));
  scrollDown();
}
function renderToolCard(name, inp){
  try{
    if(name==="Task"){
      // 子代理卡片:标题=描述,收起的正文=完整指令;动态区(_sub)实时滚动工具步
      const meta=el("div","tc-code");
      meta.textContent=(inp.subagent_type?("类型:"+inp.subagent_type+"\n\n"):"")+(inp.prompt||"");
      const card=toolCardShell(ic("bot")+" 子代理", inp.description||"", meta, true);
      const sub=el("div","tc-sub"); card.append(sub); card._sub=sub;
      return card;
    }
    if(name==="TodoWrite"){
      const todos=inp.todos||[]; if(!todos.length) return null;
      const ul=el("ul","todo");
      for(const t of todos){
        const st=t.status||"pending";
        const li=el("li", st==="completed"?"done":(st==="in_progress"?"doing":""));
        const mark=st==="completed"?"☑":(st==="in_progress"?"◐":"☐");
        li.innerHTML='<span>'+mark+'</span><span>'+esc(t.content||t.activeForm||"")+'</span>';
        ul.append(li);
      }
      return toolCardShell(ic("clip")+" 待办清单","",ul,false);
    }
    if(name==="ExitPlanMode"){
      const p=el("div","plan"); p.innerHTML=mdToHtml(inp.plan||"(空计划)");
      return toolCardShell(ic("compass")+" 执行计划","",p,false);
    }
    if(name==="Write")     return toolCardShell(ic("doc")+" 写文件", inp.file_path||"", diffEl("", inp.content||""), true);
    if(name==="Edit")      return toolCardShell(ic("edit")+" 编辑", inp.file_path||"", diffEl(inp.old_string||"", inp.new_string||""), false);
    if(name==="MultiEdit"){
      const wrap=el("div");
      for(const ed of (inp.edits||[])) wrap.append(diffEl(ed.old_string||"", ed.new_string||""));
      return toolCardShell(ic("edit")+" 多处编辑", inp.file_path||"", wrap, false);
    }
    if(name==="Bash"){
      const c=el("div","tc-code"); c.textContent=inp.command||"";
      return toolCardShell("⌘ 命令", inp.description||"", c, false);
    }
    // 其余工具:有明显目标参数才给个折叠预览,避免刷屏
    const hint=inp.file_path||inp.path||inp.pattern||inp.query||inp.url||"";
    if(hint){ const c=el("div","tc-code"); c.textContent=hint; return toolCardShell(ic("wrench")+" "+esc(name), "", c, true); }
    return null;
  }catch(e){ return null; }
}

// ── 发送 ────────────────────────────────────────────────────────────────
async function send(text, display){
  text=(text||"").trim(); if(!text && !S.images.length) return;
  const imgs=S.images.map(x=>x.url);
  // display:点按钮时传选项文字,气泡显示友好文字而非原始命令(如 /clarify id 0)
  const shown=(display!=null)?display:text;
  if(shown || imgs.length) addBubble("me", shown||"(图片)", imgs);
  // 非命令消息:立刻挂一个"💭 思考中…"气泡,不等服务器 start 事件,反馈更即时(像 TG 秒回 typing)
  if(!text.startsWith("/") && !S.stream){ ensureStream(); }
  const payload={conv:S.conv, text, images:S.images.map(x=>({data:x.data,media_type:x.media_type}))};
  // 新会话:发出第一条后,把本地临时会话转正
  const wasLocal=String(S.conv).startsWith("local-");
  if(wasLocal){ S.conv=S.conv.replace("local-",""); payload.conv=S.conv; }
  S.images=[]; renderThumbs(); $("#ta").value=""; autoGrow();
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}
// 静默发命令(如 /model 切换):不渲染用户气泡,回执由服务端 message 事件带回
async function sendCmd(cmd){
  const payload={conv:S.conv, text:cmd, images:[]};
  const wasLocal=String(S.conv).startsWith("local-");
  if(wasLocal){ S.conv=S.conv.replace("local-",""); payload.conv=S.conv; }
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}
$("#composer").onsubmit = e=>{ e.preventDefault(); send($("#ta").value); };
$("#ta").addEventListener("keydown", e=>{
  // 输入法组合中(中文/日文等候选未上屏)的回车只上屏,不发送
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Enter" && !e.shiftKey && window.innerWidth>760){ e.preventDefault(); send($("#ta").value); }
});
function autoGrow(){ const t=$("#ta"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,160)+"px"; }
$("#ta").addEventListener("input", autoGrow);
// 欢迎屏快捷入口:点击直接发送
document.querySelectorAll("#empty .sug").forEach(b=>{ b.onclick=()=>send(b.dataset.s); });

// ── 图片 ────────────────────────────────────────────────────────────────
// 读一个图片文件 → base64 并入待发送队列(选择/粘贴复用)
function addImageFile(f){
  if(!f || !(f.type||"").startsWith("image/")) return;
  const rd=new FileReader();
  rd.onload=()=>{ const url=rd.result; S.images.push({data:url.split(",")[1],media_type:f.type||"image/png",url}); renderThumbs(); };
  rd.readAsDataURL(f);
}
$("#imgBtn").onclick = ()=>$("#file").click();
$("#file").onchange = e=>{ for(const f of e.target.files) addImageFile(f); e.target.value=""; };
// 粘贴:聊天框内 Ctrl/⌘+V 粘贴剪贴板里的图片(可多张),并入队列;纯文本粘贴不受影响
$("#ta").addEventListener("paste", e=>{
  const items = e.clipboardData && e.clipboardData.items; if(!items) return;
  let got=false;
  for(const it of items){
    if(it.kind==="file" && (it.type||"").startsWith("image/")){ const f=it.getAsFile(); if(f){ addImageFile(f); got=true; } }
  }
  if(got) e.preventDefault();   // 有图才拦截,让纯文本粘贴走默认行为
});
function renderThumbs(){
  const box=$("#thumbs"); box.innerHTML="";
  S.images.forEach((im,idx)=>{ const w=el("div","t"); const g=el("img"); g.src=im.url; const x=el("button","x"); x.textContent="×"; x.onclick=()=>{S.images.splice(idx,1);renderThumbs();}; w.append(g,x); box.append(w); });
}

// ── 语音输入(录音 → 后端 SenseVoice 转写 → 填进输入框)────────────────────
// Claude 不吃音频,故先在后端转成文字。点一下开录(实时声波动效)、再点结束,转好的文字并入输入框可编辑再发。
const REC = { state:"idle", mr:null, chunks:[], stream:null, mime:"", t0:0, timer:null, cancel:false,
  actx:null, analyser:null, dataArr:null, raf:null, levels:[], waveColor:"#ef4444", _lastPush:0 };
function setRecUI(){
  // 录音/转写时:整个输入框(.inrow)收起,换成整行录音条(#recRow)
  const rec=REC.state==="recording", busy=REC.state==="transcribing", active=rec||busy;
  const row=$("#recRow"), inrow=document.querySelector(".inrow");
  row.classList.toggle("show", active);
  row.classList.toggle("busy", busy);
  if(inrow) inrow.style.display = active ? "none" : "";
}
function recTick(){ const s=Math.max(0,Math.floor((Date.now()-REC.t0)/1000)); $("#recTime").textContent=(s/60|0)+":"+String(s%60).padStart(2,"0"); }
// 滚动声波:采样(取音量)节流到约每 75ms 一次,但渲染每帧都画——用采样间隔内的时间差
// 算出平滑偏移量,让柱子连续向左滑而不是每 75ms 才跳一格(避免低帧率卡顿感)
function drawWave(){
  if(REC.state!=="recording" || !REC.analyser){ return; }
  REC.raf=requestAnimationFrame(drawWave);
  const now=Date.now();
  const PUSH_MS=75;
  if(now - REC._lastPush >= PUSH_MS){   // 节流:只控制"多久取一次样",不影响绘制帧率
    REC._lastPush=now;
    REC.analyser.getByteTimeDomainData(REC.dataArr);
    let sum=0; for(let i=0;i<REC.dataArr.length;i++){ const x=(REC.dataArr[i]-128)/128; sum+=x*x; }
    REC.levels.push(Math.min(1, Math.sqrt(sum/REC.dataArr.length)*3.4));
  }
  const cv=$("#recWave"); if(!cv) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||1, H=cv.clientHeight||1;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const barW=3, step=5, maxBars=Math.floor(W/step)+2;
  if(REC.levels.length>maxBars) REC.levels.splice(0, REC.levels.length-maxBars);
  const offset=step*Math.min(1, (now-REC._lastPush)/PUSH_MS);   // 采样间隔内的连续滚动偏移
  ctx.fillStyle=REC.waveColor;
  const n=REC.levels.length;
  for(let i=0;i<n;i++){
    const h=Math.max(3, REC.levels[i]*(H-4)), x=W-(n-i)*step-offset, y=(H-h)/2;
    if(x+barW<0) continue;
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,barW,h,barW/2); ctx.fill(); }
    else ctx.fillRect(x,y,barW,h);
  }
}
function cleanupAudio(){
  if(REC.raf){ cancelAnimationFrame(REC.raf); REC.raf=null; }
  try{ if(REC.actx && REC.actx.state!=="closed") REC.actx.close(); }catch(e){}
  REC.actx=null; REC.analyser=null; REC.levels=[];
  const cv=$("#recWave"); if(cv){ const c=cv.getContext("2d"); if(c) c.clearRect(0,0,cv.width,cv.height); }
}
// 复用同一个麦克风流:首次授权后就一直留着,避免每次录音都重新 getUserMedia 触发系统弹窗(尤其 iOS)
async function getMic(){
  if(REC.stream && REC.stream.getAudioTracks().some(t=>t.readyState==="live")) return REC.stream;
  REC.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  return REC.stream;
}
function releaseMic(){ if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; } }
async function startRec(){
  if(REC.state!=="idle") return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert("此浏览器不支持录音"); return; }
  try{ await getMic(); }
  catch(e){ alert("麦克风权限被拒绝或不可用"); return; }
  REC.chunks=[]; REC.cancel=false; REC._lastPush=0; REC.mr=new MediaRecorder(REC.stream);
  REC.mime = REC.mr.mimeType || "audio/webm";
  REC.mr.ondataavailable=e=>{ if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=onRecStop;
  try{   // 实时声波(失败不影响录音本身)
    const AC=window.AudioContext||window.webkitAudioContext;
    REC.actx=new AC(); if(REC.actx.state==="suspended") await REC.actx.resume();
    REC.analyser=REC.actx.createAnalyser(); REC.analyser.fftSize=512;
    REC.actx.createMediaStreamSource(REC.stream).connect(REC.analyser);
    REC.dataArr=new Uint8Array(REC.analyser.fftSize); REC.levels=[];
    REC.waveColor=(getComputedStyle(document.documentElement).getPropertyValue("--err").trim())||"#ef4444";
  }catch(e){ REC.analyser=null; }
  REC.mr.start(); REC.state="recording"; REC.t0=Date.now(); recTick();
  REC.timer=setInterval(recTick,500); setRecUI();
  if(REC.analyser) drawWave();
}
function stopRec(cancel){
  if(REC.state!=="recording") return;
  REC.cancel=!!cancel; clearInterval(REC.timer); REC.timer=null;
  try{ REC.mr.stop(); }catch(e){}
}
async function onRecStop(){
  cleanupAudio();   // 只停声波分析,保留麦克风流(REC.stream)供下次复用,不再反复请求权限
  const blob=new Blob(REC.chunks,{type:REC.mime}); const mime=REC.mime;
  REC.mr=null;
  if(REC.cancel || blob.size<1200){ REC.state="idle"; setRecUI(); return; }
  REC.state="transcribing"; setRecUI();
  try{
    const ext = mime.includes("mp4")||mime.includes("mpeg")?"mp4":mime.includes("ogg")?"ogg":mime.includes("wav")?"wav":"webm";
    const fd=new FormData(); fd.append("audio", blob, "voice."+ext);
    const r=await api("/transcribe",{method:"POST",body:fd});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.text) insertToInput(d.text);
    else alert(d.error||"没识别到内容,再说一次试试");
  }catch(e){ alert("转写失败:"+e.message); }
  REC.state="idle"; setRecUI();
}
function insertToInput(t){
  const ta=$("#ta");
  ta.value = ta.value.trim() ? (ta.value.replace(/\s+$/,"")+" "+t) : t;
  autoGrow(); ta.focus();
}
$("#micBtn").onclick = ()=>{ if(REC.state==="idle") startRec(); };          // 麦克风:开录
$("#recRow").onclick = ()=>{ if(REC.state==="recording") stopRec(false); }; // 整行任意处:完成
$("#recRow").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ")&&REC.state==="recording"){ e.preventDefault(); stopRec(false); } });
$("#recCancel").onclick = e=>{ e.stopPropagation(); stopRec(true); };        // 左侧 ✕:取消(不触发整行完成)
// 切后台/关页面时释放麦克风(空闲时才放,避免录音中被掐);回来再录会重新拿(通常已授权,不再弹窗)
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && REC.state==="idle") releaseMic(); });

// ── 新会话 / 侧边栏 / 主题 ───────────────────────────────────────────────
$("#newBtn").onclick = newChat;
$("#themeBtn").onclick = toggleTheme;
// 顶栏 ☰:桌面(收起态)= 展开侧边栏;移动端 = 抽屉式打开
$("#hamb").onclick = ()=>{
  if(window.innerWidth>760){ setSidebarCollapsed(false); }
  else { $("#sidebar").classList.add("open"); $("#backdrop").classList.add("show"); }
};
$("#collapseBtn").onclick = ()=> setSidebarCollapsed(true);   // 侧边栏内「«」:收起
$("#backdrop").onclick = closeSidebar;
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("show"); }
// 桌面侧边栏折叠态(记忆到 localStorage)
function setSidebarCollapsed(v){
  document.body.classList.toggle("sb-collapsed", v);
  try{ localStorage.setItem("hermes_sb", v?"1":"0"); }catch(e){}
}

// ── 回到底部按钮 ─────────────────────────────────────────────────────────
$("#messages").addEventListener("scroll", ()=>{
  const m=$("#messages");
  const nearBottom = m.scrollHeight - m.scrollTop - m.clientHeight < 120;
  $("#scrollBtn").classList.toggle("show", !nearBottom);
});
$("#scrollBtn").onclick = scrollDown;

// ── 键盘/视口自适应 ──────────────────────────────────────────────────────
// 把 #app 高度绑定到「可视视口」而非布局视口:键盘弹出时整体缩短,
// 输入框自动贴在键盘上方,既不被遮挡、间距也不会过大。
function fitViewport(){
  const vv = window.visualViewport; if(!vv) return;
  const st = document.documentElement.style;
  const kbOpen = (window.innerHeight - vv.height) > 120;  // 视口缩水超阈值 → 判定键盘弹出
  document.body.classList.toggle("kb", kbOpen);
  if(kbOpen){
    st.setProperty("--app-h", vv.height + "px");
    st.setProperty("--app-top", vv.offsetTop + "px");
    scrollDown();
  }else{
    // 键盘收起时交还布局视口(100%):iOS 独立 PWA 下 visualViewport 高度
    // 常偏小且不再触发 resize,固定绑定会在底部留一条空白
    st.removeProperty("--app-h");
    st.removeProperty("--app-top");
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
  fitViewport();
}

// ── 启动 ────────────────────────────────────────────────────────────────
try{ if(localStorage.getItem("hermes_sb")==="1") document.body.classList.add("sb-collapsed"); }catch(e){}
syncTheme();
if(S.token){ tryEnter(); } else { $("#pw").focus(); }
</script>
