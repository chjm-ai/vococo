// 刷新/新开页面后,IndexedDB 里可能没有(或已过期)最近会话的历史,第一次点开要等一趟
// 跨境网络(重会话 gzip 后 70~145KB,实测 4s+)。这里在首屏安顿好之后,悄悄把最近几个
// 会话的 /history 拉进缓存——配合服务端 ETag/304,已缓存且没变的只花一个空包,成本很低。
// 每次页面加载只跑一轮;串行拉,别跟当前会话/SSE 抢那 ~50KB/s 的隧道带宽。
var _prefetchedHist = false;
async function prefetchHistories(){
  if(_prefetchedHist) return;
  _prefetchedHist = true;
  await new Promise(r=>setTimeout(r, 2500));   // 让当前会话历史 + SSE 先就位
  const tops = S.convs.filter(c=>c.turns>0 && !String(c.conv).startsWith("local-")).slice(0,5);
  for(const c of tops){
    if(S.conv===c.conv) continue;              // 正开着的会话 openConv 自己拉过了
    try{
      const r=await api("/history?conv="+encodeURIComponent(c.conv));
      const d=await r.json();
      S.histCache[c.conv]=d.turns;
      idbSetHist(c.conv, d.turns);
    }catch(e){ break; }                        // 网络不给力就收手,下次刷新再预热
  }
}
// 从 conv id 解析它属于哪个项目:p<hash>:<convid> → hash;否则 null(默认项目)
function convProject(conv){
  const m = String(conv).replace(/^local-/,"").match(/^p([0-9a-f]+):/);
  return m ? m[1] : null;
}
// 分组的存储键:默认项目用固定串,项目用其 hash
function grpKey(hash){ return hash===null ? "__default__" : hash; }
function saveExpanded(){ try{ localStorage.setItem("hermes_expanded", JSON.stringify([...S.expanded])); }catch(e){} }
function loadExpanded(){ try{ S.expanded=new Set(JSON.parse(localStorage.getItem("hermes_expanded")||"[]")); }catch(e){ S.expanded=new Set(); } }

function projName(hash){
  if(!hash) return "默认项目";
  const p=(S.projects||[]).find(x=>x.hash===hash);
  return p ? p.name : "默认项目";
}
// 项目选择胶囊只在草稿态(local- 会话,还没发过消息)出现:发出第一条后这会话已归属到
// 侧栏对应项目分组,不再需要重复标记(见 send()/sendCmd() 里转正后的 renderProjSelChip 调用)
function renderProjSelChip(){
  const box=$("#projSel"); if(!box) return;
  const show = String(S.conv||"").startsWith("local-");
  box.hidden = !show;
  if(show) $("#projSelName").textContent = projName(S.project);
}
function renderProjSelPop(){
  const pop=$("#projSelPop"), cur=S.project;
  const items=[{hash:null,name:"默认项目"}, ...(S.projects||[])];
  pop.innerHTML=items.map(p=>
    '<button type="button" class="mi'+(p.hash===cur?" on":"")+'" data-h="'+esc(p.hash||"")+'">'+
    '<span class="ml">'+esc(p.name)+'</span>'+(p.hash===cur?'<span class="mk">✓</span>':'')+'</button>'
  ).join("");
  pop.querySelectorAll(".mi").forEach(b=>{ b.onclick=()=>pickDraftProject(b.dataset.h||null); });
}
// 切换草稿会话归属的项目:conv id 里的 p<hash>: 前缀重新拼一遍,内容(时间戳+随机串)不变
function pickDraftProject(hash){
  $("#projSelPop").hidden=true;
  if(!String(S.conv||"").startsWith("local-")) return;  // 安全兜底:已转正的会话不可切项目
  if(hash===S.project) return;
  const idPart = S.conv.replace(/^local-(?:p[0-9a-f]+:)?/, "");
  const newConv = "local-"+(hash?("p"+hash+":"):"")+idPart;
  const idx = S.convs.findIndex(x=>x.conv===S.conv);
  if(idx>=0) S.convs[idx]={...S.convs[idx], conv:newConv};
  S.project=hash; S.conv=newConv;
  S.expanded.add(grpKey(hash)); saveExpanded();
  renderConvs(); renderProjSelChip();
}
$("#projSelBtn").onclick=e=>{ e.stopPropagation(); const p=$("#projSelPop");
  if(p.hidden){ renderProjSelPop(); p.hidden=false; } else p.hidden=true; };
document.addEventListener("click", e=>{ const b=$("#projSel"); if(b && !b.contains(e.target)) $("#projSelPop").hidden=true; });

function convsInGroup(hash){
  return S.convs.filter(c => c.pinned ? hash===null : convProject(c.conv)===hash);
}
// 语音对话主行(通话入口),与主会话一起置顶在根目录最前(不属于任何分组,数据来自 /voice/sidebar)。
// 通话视图开着时不看 S.conv(那还停在离开前的聊天会话上没变),由调用方传进来的 inCall
// (= #callView 是否显示)决定「语音对话」这一行是否高亮成"你现在就在这儿"。
function buildVoiceMainRow(inCall){
  const vs = S.voiceSidebar;
  if(!vs || !vs.main) return null;  // 还没拉到数据(如刚登录那一瞬)先不渲染,避免空行闪一下
  const mainRow=el("div","conv"+(inCall?" active":""));
  const mainBody=el("div","cvbody");
  mainBody.innerHTML=ic("mic");
  const mainCt=el("div","ct"); mainCt.textContent=vs.main.title||"语音对话"; mainBody.append(mainCt);
  const tm=fmtTime(vs.main.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; mainBody.append(tmEl); }   // 与其他会话行统一:右侧补上时刻
  mainRow.append(mainBody);
  mainRow.onclick=()=>{ openCallView(); };
  return mainRow;
}
// 语音后台任务的单条行(与普通会话行同构);archived 筛选不通过时返回 null。
// 拆成单条构建是为了跟普通会话按时间混排(见 renderConvs 里默认项目分组的合并排序)。
// 归档/删除按钮 + 左滑手势:普通会话行(非置顶)与语音任务行共用的一段
// (2026-07-23 从 buildConvRow/buildVoiceTaskRow 里近乎逐行重复的代码收口)
function bindRowSwipeActions(row, body, conv, archived){
  const act=el("div","cvact");
  const archBtn=el("button","cvarch"); archBtn.innerHTML=ic("folder"); archBtn.title=archived?"取消归档":"归档";
  archBtn.onclick=ev=>{ ev.stopPropagation(); closeSwipe(row); toggleArchive(conv); };
  const del=el("button","cvdel"); del.innerHTML=ic("trash"); del.title="删除";
  del.onclick=ev=>{ ev.stopPropagation(); closeSwipe(row); delConv(conv); };
  act.append(archBtn,del); row.append(act);
  bindSwipe(row, body, act);
}
function buildVoiceTaskRow(t, inCall){
  const arch=!!t.archived;
  if(S.convFilter==="archived"&&!arch) return null;
  if(S.convFilter==="active"&&arch) return null;
  const row=el("div","conv ingroup"+(!inCall && t.conv===S.conv?" active":""));
  row.dataset.conv=t.conv;
  const body=el("div","cvbody");
  // 任务还在跑(queued/running)→ 复用普通会话行的闪烁圆点;终态不挂点(ab77594 去掉已读提醒的决定不变)
  if(S.live[t.conv]){
    const dot=el("span","livedot"); dot.title="AI 正在回复中"; body.append(dot);
  } else if(t.task_status==="queued"||t.task_status==="running"){
    const dot=el("span","livedot"); dot.title=t.task_status==="running"?"任务进行中":"排队中"; body.append(dot);
  }
  const ct=el("div","ct"); ct.textContent=t.title||"新对话"; body.append(ct);
  const tm=fmtTime(t.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; body.append(tmEl); }
  const more=el("button","more"); more.textContent="⋯"; more.title="更多";
  more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,t.conv);}; body.append(more);
  row.append(body);
  bindRowSwipeActions(row, body, t.conv, arch);
  if(t.conv===S.swipedConv) row.classList.add("swiped");
  row.onclick=()=>{
    if(row._justSwiped){ row._justSwiped=false; return; }
    if(row.classList.contains("swiped")){ closeSwipe(row); return; }
    openConv(t.conv);
  };
  return row;
}
// 单条会话行(置顶主会话与普通会话通用)
function buildConvRow(c, inCall){
  const e=el("div","conv"+(c.pinned?"":" ingroup")+(!inCall && c.conv===S.conv?" active":"")+(c.pinned?" pinned":""));
  e.dataset.conv=c.conv;
  const body=el("div","cvbody");
  if(c.pinned) body.innerHTML=ic("star");   // 主会话:左侧线性星标图标,呼应语音对话左侧的麦克风图标
  if(S.live[c.conv]){ const dot=el("span","livedot"); dot.title="AI 正在回复中"; body.append(dot); }
  else if(c.pending_review || S.pendingReview[c.conv]){ const dot=el("span","reviewdot"); dot.title="有新内容"; body.append(dot); }   // 完成未读:灰色圆点
  const ct=el("div","ct"); ct.textContent=c.title||"新对话"; body.append(ct);
  const tm=fmtTime(c.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; body.append(tmEl); }   // 会话时刻:名称右侧
  if(!c.pinned){ const more=el("button","more"); more.textContent="⋯"; more.title="更多"; more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,c.conv);}; body.append(more); }
  e.append(body);
  if(!c.pinned){
    bindRowSwipeActions(e, body, c.conv, c.archived);   // 触屏:左滑露出归档/删除,不用长按(iOS 用户少用长按)
    if(c.conv===S.swipedConv) e.classList.add("swiped");   // 重建 DOM 后补回展开状态,别被后台事件触发的重渲染冲掉
  }
  e.onclick=()=>{
    if(e._justSwiped){ e._justSwiped=false; return; }   // 刚滑动完的这次 click 不触发切换
    if(e.classList.contains("swiped")){ closeSwipe(e); return; }   // 已展开:点一下先收起
    openConv(c.conv);
  };
  return e;
}
const CONV_SHOW_MAX = 5;   // 每个分组默认最多展示的会话数(置顶行不计入),超出折进「展开更多」
const RECENT_KEY = "__recent__";
const RECENT_SHOW_MAX = 10;   // 「最近会话」分组:展开更多≠显示全部,这里封顶 10 条(纯快捷入口,不是完整列表)
// 手风琴:默认项目 + 每个项目一个可折叠分组,展开后列出其会话;末尾一行「新建项目」
function renderConvs(){
  const box=$("#convList"); box.innerHTML="";
  const inCall = !$("#callView").hidden;  // 通话中:普通会话行都不高亮,高亮权让给「语音对话」那一行
  // 根目录置顶区:主会话 + 语音对话,恒排在最顶端(在「默认项目」分组头上面一层),
  // 不属于任何分组、不受分组展开/折叠影响,也不参与时间排序或「展开更多」的名额。
  for(const c of convsInGroup(null)) if(c.pinned) box.append(buildConvRow(c, inCall));
  const vm=buildVoiceMainRow(inCall); if(vm) box.append(vm);
  // 「最近会话」分组:汇总所有项目分组(含语音任务)的会话,按最后活跃时间混排,不看归属项目。
  // 默认 5 条,展开最多 10 条——纯快捷入口,不是"展开更多=显示全部"的完整列表。
  {
    const open=S.expanded.has(RECENT_KEY);
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent="最近会话"; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);
    h.onclick=()=>toggleGroup(RECENT_KEY);
    box.append(h);
    if(open){
      const passesArchFilter = arch => !(S.convFilter==="archived"&&!arch) && !(S.convFilter==="active"&&arch);
      const taskItems = ((S.voiceSidebar&&S.voiceSidebar.tasks)||[]).map(t=>({ts:t.last_ts||0, build:()=>buildVoiceTaskRow(t, inCall)}));
      const convItems = S.convs.filter(c=>!c.pinned && passesArchFilter(!!c.archived)).map(c=>({ts:c.last_ts||0, build:()=>buildConvRow(c, inCall)}));
      const rows = [...taskItems, ...convItems].sort((a,b)=>b.ts-a.ts).slice(0, RECENT_SHOW_MAX).map(it=>it.build()).filter(Boolean);
      const shown = S.moreShown.has(RECENT_KEY) ? rows : rows.slice(0, CONV_SHOW_MAX);
      for(const r of shown) box.append(r);
      if(rows.length > shown.length){
        const more=el("div","conv ingroup convmore");
        const mct=el("div","ct"); mct.textContent="展开更多"; more.append(mct);
        more.onclick=()=>{ S.moreShown.add(RECENT_KEY); renderConvs(); };
        box.append(more);
      }
    }
  }
  const groups=[{hash:null,name:"默认项目"}].concat(S.projects.map(p=>({hash:p.hash,name:p.name})));
  for(const g of groups){
    const convs=convsInGroup(g.hash);
    const open=S.expanded.has(grpKey(g.hash));
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent=g.name; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);   // 折线箭头,展开时旋转朝下
    if(g.hash!==null){
      const more=el("button","pgmore"); more.textContent="⋯"; more.title="更多";
      more.onclick=ev=>{ ev.stopPropagation(); openProjMenu(more, g.hash); }; h.append(more);
    }
    const add=el("button","pgadd"); add.textContent="＋"; add.title="在此项目下新建会话";
    add.onclick=ev=>{ ev.stopPropagation(); newChatIn(g.hash); }; h.append(add);
    if(g.hash!==null){
      bindProjDrag(h, g.hash);   // 默认项目/末尾「新建项目」不可拖,仅真实项目分组可排序
    }
    h.onclick=()=>{ if(S.dragMoved){ S.dragMoved=false; return; } toggleGroup(g.hash); };  // 拖拽落地那一下别顺带触发展开/收起
    box.append(h);
    if(!open) continue;
    let rows;
    if(g.hash===null){
      // 默认项目:语音后台任务不区分项目,统一落这里,跟普通会话按最后活跃时间混排
      // 再截前 CONV_SHOW_MAX 条——避免"语音任务永远排最前"把新会话挤出首屏
      // (2026-07-22 反馈:几十条老语音任务霸占默认项目前 5 条,当天新会话反而看不见)。
      const passesArchFilter = arch => !(S.convFilter==="archived"&&!arch) && !(S.convFilter==="active"&&arch);
      const taskItems = ((S.voiceSidebar&&S.voiceSidebar.tasks)||[]).map(t=>({ts:t.last_ts||0, build:()=>buildVoiceTaskRow(t, inCall)}));
      const convItems = convs.filter(c=>!c.pinned && passesArchFilter(!!c.archived)).map(c=>({ts:c.last_ts||0, build:()=>buildConvRow(c, inCall)}));
      rows = [...taskItems, ...convItems].sort((a,b)=>b.ts-a.ts).map(it=>it.build()).filter(Boolean);
    } else {
      rows=[];
      for(const c of convs){
        if(c.pinned) continue;
        const arch=!!c.archived;
        if(S.convFilter==="archived"&&!arch)continue;
        if(S.convFilter==="active"&&arch)continue;
        rows.push(buildConvRow(c, inCall));
      }
    }
    // 每组默认最多展示 CONV_SHOW_MAX 条,余下折进「展开更多」(点开后本次会话内保持展开)
    const shown = S.moreShown.has(grpKey(g.hash)) ? rows : rows.slice(0, CONV_SHOW_MAX);
    for(const r of shown) box.append(r);
    if(rows.length > shown.length){
      const k=grpKey(g.hash);
      const more=el("div","conv ingroup convmore");
      const mct=el("div","ct"); mct.textContent="展开更多"; more.append(mct);
      more.onclick=()=>{ S.moreShown.add(k); renderConvs(); };
      box.append(more);
    }
  }
  // 定时任务分组:只有真有任务时才出现(见 renderConvs 上方数据源 S.cronJobs)
  if(S.cronJobs.length){
    const CRON_KEY="__cron__";
    const open=S.expanded.has(CRON_KEY);
    const h=el("div","projgrp");
    const nm=el("span","pgname"); nm.textContent="定时任务"; h.append(nm);
    const caret=el("span","pgcaret chev"+(open?" down":"")); h.append(caret);
    const add=el("button","pgadd"); add.textContent="＋"; add.title="新建定时任务";
    add.onclick=ev=>{ ev.stopPropagation(); openCronModal(null); }; h.append(add);
    h.onclick=()=>toggleGroup(CRON_KEY);
    box.append(h);
    if(open){
      const rows=S.cronJobs.map(buildCronJobRow);
      const shown=S.moreShown.has(CRON_KEY)?rows:rows.slice(0,CONV_SHOW_MAX);
      for(const r of shown) box.append(r);
      if(rows.length>shown.length){
        const more=el("div","conv ingroup convmore");
        const mct=el("div","ct"); mct.textContent="展开更多"; more.append(mct);
        more.onclick=()=>{ S.moreShown.add(CRON_KEY); renderConvs(); };
        box.append(more);
      }
    }
  }
  const addp=el("div","projgrp projadd"); addp.textContent="＋ 新建项目…"; addp.onclick=openProjModal; box.append(addp);
  // 同步标题栏:loadConvs 刷新 S.convs 后调 renderConvs,标题可能已更新
  const activeConv=S.convs.find(c=>c.conv===S.conv);
  if(activeConv) $("#convTitle").textContent=activeConv.title||"新对话";
}

  catch(e){ S.projects=[]; }
}

// ── 语音任务:侧边栏固定分组(主语音会话 + 各后台任务会话)────────────────────
async function loadVoiceSidebar(){
  try{ const r=await api("/voice/sidebar"); S.voiceSidebar=await r.json(); }
  catch(e){ S.voiceSidebar={main:null, tasks:[]}; }
  renderConvs();
  if($("#empty").style.display==="flex") renderEmptyRecent();  // 欢迎屏正开着 → 语音任务到位后补一次最近对话

// SSE task_update → 同步侧边栏任务行的状态点:状态没变(纯进度文案)不重绘,
// 新派发的任务侧栏还没有这行则整个重拉一次
function syncSidebarTaskStatus(t){
  const row=(S.voiceSidebar.tasks||[]).find(x=>x.conv==="voice-task:"+t.id);
  if(!row){ loadVoiceSidebar(); return; }
  if(row.task_status===t.status) return;
  row.task_status=t.status; renderConvs();
}
// ── 定时任务:侧边栏固定分组(每个任务一条专属会话)────────────────────────────
async function loadCronSidebar(){
  try{ const r=await api("/cron/sidebar"); S.cronJobs=(await r.json()).jobs||[]; }
  catch(e){ S.cronJobs=[]; }
  renderConvs();
  syncCronHeader();   // 正开着某条任务会话时,启停开关的状态要跟上最新数据
}
// 标题栏右侧的任务操作区(启停开关/编辑/「⋯」):只在 cron-task 会话显示,开关状态取自 S.cronJobs
function syncCronHeader(){
  const job=String(S.conv||"").startsWith("cron-task:") ? S.cronJobs.find(x=>x.conv===S.conv) : null;
  const hide=!job;
  $("#convCronToggle").hidden=$("#convCronEditBtn").hidden=$("#convCronMore").hidden=hide;
  if(job){
    $("#convCronToggle").classList.toggle("on", !!job.enabled);
    $("#convCronToggle").title=job.enabled?"已启用 · 点击停用":"已停用 · 点击启用";
  }
}
// 单条定时任务行:点进去看该任务的历次运行记录(它就是一条普通会话);「⋯」跟普通
// 会话行同一套 openConvMenu,点开是编辑/启停/删除(见 openConvMenu 里的 isCron 分支)
function buildCronJobRow(j){
  const row=el("div","conv ingroup"+(j.conv===S.conv?" active":""));
  row.dataset.conv=j.conv;
  const body=el("div","cvbody");
  if(j.pending_review || S.pendingReview[j.conv]) { const dot=el("span","reviewdot"); dot.title="有新内容"; body.append(dot); }
  const ct=el("div","ct"); ct.textContent=j.title||"定时任务";
  if(!j.enabled) ct.style.opacity="0.5";
  body.append(ct);
  const tm=fmtTime(j.last_ts); if(tm){ const tmEl=el("span","ctime"); tmEl.textContent=tm; body.append(tmEl); }  // 最近一次运行时刻,与普通会话行统一
  const more=el("button","more"); more.textContent="⋯"; more.title="更多";
  more.onclick=ev=>{ev.stopPropagation();openConvMenu(more,j.conv);}; body.append(more);
  row.append(body);
  row.onclick=()=>openConv(j.conv);
  return row;
}
// 项目分组拖拽排序(原生 HTML5 DnD:桌面拖起手感好,鼠标移动量够才触发,不影响原有点击展开)
function bindProjDrag(h, hash){
  h.draggable = true;
  h.ondragstart = ev=>{
    if(ev.target.closest(".pgadd,.pgmore")){ ev.preventDefault(); return; }   // 加号/更多按钮不触发拖拽
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", hash);
    S.dragSrc = hash;
    setTimeout(()=>h.classList.add("dragging"), 0);   // 下一 tick 加,免得拖拽预览图也变半透明
  };
  h.ondragend = ()=>{ h.classList.remove("dragging"); S.dragSrc=null; };
  h.ondragover = ev=>{ if(!S.dragSrc || S.dragSrc===hash) return; ev.preventDefault(); ev.dataTransfer.dropEffect="move"; h.classList.add("dragover"); };
  h.ondragleave = ()=> h.classList.remove("dragover");
  h.ondrop = ev=>{
    ev.preventDefault(); h.classList.remove("dragover");
    const src = ev.dataTransfer.getData("text/plain");
    S.dragMoved = true;   // 拖拽落地这一下,别顺带触发 h.onclick 里的展开/收起
    if(src && src!==hash) reorderProject(src, hash);
  };
}
function reorderProject(srcHash, targetHash){
  const arr=S.projects;
  const si=arr.findIndex(p=>p.hash===srcHash), ti=arr.findIndex(p=>p.hash===targetHash);
  if(si<0 || ti<0) return;
  const [item]=arr.splice(si,1); arr.splice(ti,0,item);
  renderConvs();
  api("/projects/reorder",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order:arr.map(p=>p.hash)})}).catch(()=>{});
}
function toggleGroup(hash){
  const k=grpKey(hash);
  if(S.expanded.has(k)){ S.expanded.delete(k); S.moreShown.delete(k); }  // 折叠时清掉「展开更多」态,下次打开回到默认 5 条
  else S.expanded.add(k);
  saveExpanded(); renderConvs();
}
// 在指定项目下开新会话(顶部 ＋新对话 用当前活跃项目;分组 ＋ 用该分组)。
// focus=false 用于 APP 启动时静默落地到一个新对话——不弹键盘打扰用户。
// expand=false 同样只用于 APP 启动时的静默落地:别把用户上次手动折叠的分组重新展开。
function newChatIn(hash, focus, expand){
  S.project=hash;
  if(expand!==false){ S.expanded.add(grpKey(hash)); saveExpanded(); }
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const conv="local-"+(hash?("p"+hash+":"):"")+id;
  S.convs.unshift({conv,title:"新对话",turns:0,last_ts:null});
  openConv(conv, expand===false);
  if(focus!==false) $("#ta").focus();
}

async function removeProject(hash){
  try{ await api("/projects/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hash})}); }

// ── Web Push 底座:注册 SW + 订阅 VAPID ────────────────────────────────────
// 装了 Service Worker + 订阅公钥后,页面关了/锁屏也能收到系统通知。
// 服务端未配 VAPID 时 /push/config 返回 enabled:false,通知 tab 显示未配置提示。
const PUSH = { pubKey:"", enabled:false, ready:false };
function b64ToU8(base64){
  const pad="=".repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(b), arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
// 固定设备号:iOS 订阅失效后重新 subscribe() 会拿到全新 endpoint,单靠 endpoint 去重会让
// 同一台设备在服务端越攒越多。存一个不变的 deviceId 让服务端"认设备"而不是"认 endpoint"。
function getDeviceId(){
  try{
    let id=localStorage.getItem("hermes_device_id");
    if(!id){ id=(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2))); localStorage.setItem("hermes_device_id", id); }
    return id;
  }catch(e){ return ""; }
}
// SW 外壳缓存让页面秒开(可能是旧版);后台发现新版后弹这个提示条,点了才刷新——
// 不自动 reload,免得把正在输入的草稿冲掉
function showShellUpdated(){
  if(document.getElementById("shellUpd")) return;
  const b=document.createElement("div");
  b.id="shellUpd";
  b.textContent="界面已更新 · 点击刷新";
  b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:9999;"+
    "padding:8px 14px;border-radius:18px;font-size:13px;cursor:pointer;"+
    "background:var(--accent,#d97757);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)";
  b.onclick=()=>location.reload();
  document.body.appendChild(b);
}
var pushMsgListenerInited = false;  // 防重入:挡重登录时监听器重复叠加
async function initPush(){
  if(!("serviceWorker" in navigator)) return;
  try{ await navigator.serviceWorker.register("/sw.js"); }catch(e){ return; }
  if(!pushMsgListenerInited){
    pushMsgListenerInited = true;
    // 点系统通知 → SW 让页面切到对应会话
    navigator.serviceWorker.addEventListener("message", ev=>{
      const m=ev.data||{};
      if(m.type==="open" && m.conv){ try{ openConv(m.conv); }catch(e){} }
      if(m.type==="shell-updated"){ try{ showShellUpdated(); }catch(e){} }
    });
  }
  try{
    const cfg = await (await api("/push/config")).json();
    PUSH.enabled=!!cfg.enabled; PUSH.pubKey=cfg.vapidPublicKey||"";
  }catch(e){ return; }
  PUSH.ready=true;
}
async function currentSub(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function enableNotify(){
  // 每一步失败都抛带原因的错误,交给 onchange 的 catch 弹出来——别再静默失败让人盲猜。
  if(isIOSNonStandalone())
    throw new Error("现在不是主屏模式。iPhone 需先把本页「添加到主屏幕」,再从主屏图标打开才能开启。");
  if(typeof Notification==="undefined")
    throw new Error("此浏览器不支持通知 API(Notification 未定义)。");
  let perm = Notification.permission;
  if(perm==="default") perm=await Notification.requestPermission();
  if(perm==="denied")
    throw new Error("通知权限被拒。iOS 需删掉主屏图标 + 清掉网站数据后,重新加主屏再试。");
  if(perm!=="granted")
    throw new Error("未获得通知权限(perm="+perm+")。");
  if(!PUSH.pubKey)
    throw new Error("服务端没返回 VAPID 公钥,推送未配置。");
  const reg=await navigator.serviceWorker.ready;
  let sub;
  try{
    sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(PUSH.pubKey) });
  }catch(e){
    throw new Error("订阅失败(pushManager.subscribe):"+(e&&e.message||e));
  }
  const payload=Object.assign(sub.toJSON?sub.toJSON():JSON.parse(JSON.stringify(sub)), {ua:navigator.userAgent, deviceId:getDeviceId()});
  const r=await api("/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!r.ok)
    throw new Error("订阅已建立但保存到服务端失败(HTTP "+r.status+")。");
}
async function disableNotify(){
  const sub=await currentSub();
  if(sub){
    try{ await api("/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}); }catch(e){}
    try{ await sub.unsubscribe(); }catch(e){}
  }
}

function renderMcpPane(){

// 通用「设置行」外壳:.srow > .sinfo(.sname/.sdesc) + .sacts(调用方自己拼具体内容)。
// 2026-07-23:mcpRow 曾是唯一命名了这套外壳的函数,renderSkillPane/renderNotifyPane(×2)/
// loadNotifyDevices 各自手写复刻了一遍,收口成这一处共享骨架——.sacts 里装什么(开关/
// 按钮/两者都有/都没有)每处差异真实存在,不强行统一,交给调用方自己拼 actsHtml。
function settingsRow(rowAttr, rowKey, nameHtml, descHtml, off, actsHtml){
  return '<div class="srow'+(off?" off":"")+'"'+(rowAttr?' '+rowAttr+'="'+esc(rowKey)+'"':'')+'>'+
    '<div class="sinfo"><div class="sname">'+nameHtml+'</div>'+
    (descHtml?'<div class="sdesc">'+descHtml+'</div>':'')+'</div>'+
    '<div class="sacts">'+actsHtml+'</div></div>';
}
function mcpRow(id, nameHtml, descHtml, on, key, canDelete){
  const acts=(canDelete?'<button class="miniact danger" data-mdel="'+esc(id)+'">删除</button>':'')+
    '<label class="sw"><input type="checkbox" data-mtgl="'+esc(key)+'"'+(on?" checked":"")+'><span class="track"></span></label>';
  return settingsRow("data-mrow", key, nameHtml, descHtml, !on, acts);
}
function mcpFormHtml(){
  return '<div class="mcpform" id="mcpForm">'+
    '<div class="fld"><label>名称(唯一标识)</label><input id="mfName" placeholder="filesystem"></div>'+
    '<div class="fld"><label>类型</label><select id="mfType"><option value="stdio">stdio(本地命令)</option><option value="sse">sse(远程)</option><option value="http">http(远程)</option></select></div>'+
    '<div id="mfStdio">'+
      '<div class="fld"><label>命令 command</label><input id="mfCmd" placeholder="npx"></div>'+
      '<div class="fld"><label>参数 args(空格分隔)</label><input id="mfArgs" placeholder="-y @modelcontextprotocol/server-filesystem /path/to/dir"></div>'+
      '<div class="fld"><label>环境变量 env(每行 KEY=VALUE,可空)</label><textarea id="mfEnv" placeholder="API_KEY=xxx"></textarea></div>'+
    '</div>'+
    '<div id="mfRemote" hidden>'+
      '<div class="fld"><label>URL</label><input id="mfUrl" placeholder="https://example.com/mcp"></div>'+
      '<div class="fld"><label>请求头 headers(每行 KEY=VALUE,可空)</label><textarea id="mfHeaders" placeholder="Authorization=Bearer xxx"></textarea></div>'+
    '</div>'+
    '<div class="mcperr" id="mfErr"></div>'+
    '<div class="setrowbtns"><button class="btn primary sm" id="mfSave">保存</button><button class="btn ghost sm" id="mfCancel">取消</button></div>'+
  '</div>';
}
function bindMcpPane(){
  $("#setPane").querySelectorAll("[data-mtgl]").forEach(inp=>{
    inp.onchange = async()=>{
      const key=inp.dataset.mtgl, on=inp.checked;
      inp.closest(".srow").classList.toggle("off", !on);
      if(key==="hermes"){ await api("/settings/mcp/hermes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:on})}); SET.data.mcp.hermes_enabled=on; }
      else if(key.startsWith("ext:")){ const name=key.slice(4); await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"toggle",name,enabled:on})}); const x=SET.data.mcp.external.find(e=>e.name===name); if(x)x.enabled=on; }
    };
  });
  $("#setPane").querySelectorAll("[data-mdel]").forEach(b=>{
    b.onclick = async()=>{
      const name=b.dataset.mdel;
      if(!confirm("删除外部 MCP「"+name+"」?")) return;
      await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"remove",name})});
      SET.data.mcp.external = SET.data.mcp.external.filter(e=>e.name!==name);
      renderMcpPane();
    };
  });
  const addBtn=$("#mcpAddBtn"); if(addBtn) addBtn.onclick=()=>{ SET.mcpFormOpen=true; renderMcpPane(); };
  const typeSel=$("#mfType");
  if(typeSel){
    const sync=()=>{ const t=typeSel.value; $("#mfStdio").hidden=(t!=="stdio"); $("#mfRemote").hidden=(t==="stdio"); };
    typeSel.onchange=sync; sync();
    $("#mfCancel").onclick=()=>{ SET.mcpFormOpen=false; renderMcpPane(); };
    $("#mfSave").onclick=saveMcpForm;
  }
}
function parseKV(text){ const o={}; (text||"").split("\n").forEach(l=>{ l=l.trim(); if(!l) return; const i=l.indexOf("="); if(i>0) o[l.slice(0,i).trim()]=l.slice(i+1).trim(); }); return o; }
async function saveMcpForm(){
  const err=$("#mfErr"); err.textContent="";
  const name=$("#mfName").value.trim();
  if(!name){ err.textContent="请填名称"; return; }
  const type=$("#mfType").value;
  const body={action:"add", name, type, enabled:true};
  if(type==="stdio"){
    if(!$("#mfCmd").value.trim()){ err.textContent="stdio 需要 command"; return; }
    body.command=$("#mfCmd").value.trim();
    body.args=$("#mfArgs").value.trim().split(/\s+/).filter(Boolean);
    body.env=parseKV($("#mfEnv").value);
  } else {
    if(!$("#mfUrl").value.trim()){ err.textContent=type+" 需要 URL"; return; }
    body.url=$("#mfUrl").value.trim();
    body.headers=parseKV($("#mfHeaders").value);
  }
  const r=await api("/settings/mcp/external",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.error){ err.textContent=d.error; return; }
  SET.mcpFormOpen=false;
  const rr=await api("/settings"); SET.data=await rr.json();  // 拉回最新列表
  renderMcpPane();
}

function renderSkillPane(){
  const sk=SET.data.skills;
  const q=SET.skq.toLowerCase();
  let items=sk.items.slice();
  if(q) items=items.filter(x=>x.name.toLowerCase().includes(q)||(x.description||"").toLowerCase().includes(q));
  // 未隐藏在前,隐藏的沉底
  items.sort((a,b)=>(a.hidden?1:0)-(b.hidden?1:0));
  const onCount=sk.items.filter(x=>x.enabled).length;
  let h='<h3>'+ic("zap")+'技能 Skills</h3>'+
    '<p class="shint">关闭 = 不挂给 AI(省 token、不会被调用);隐藏 = 仅在此列表折叠。共 '+sk.items.length+' 个,已开启 '+onCount+' 个。'+
    (sk.mode==="custom"?'<b>(自定义名单)</b>':'<b>(跟随默认)</b>')+'</p>';
  h+='<div class="skbar"><div class="sksearch">'+ic("search")+'<input id="skSearch" placeholder="搜索技能…" value="'+esc(SET.skq)+'"></div>'+
     '<button class="btn ghost sm" id="skReset">恢复默认名单</button></div>';
  if(!items.length){ h+='<div class="setempty">没有匹配的技能</div>'; }
  items.forEach(x=>{
    const acts='<button class="miniact'+(x.hidden?" on":"")+'" data-skhide="'+esc(x.name)+'">'+(x.hidden?"显示":"隐藏")+'</button>'+
      '<label class="sw"><input type="checkbox" data-sken="'+esc(x.name)+'"'+(x.enabled?" checked":"")+'><span class="track"></span></label>';
    h += settingsRow("data-sk", x.name, esc(x.name), x.description?esc(x.description):"", !x.enabled||x.hidden, acts);
  });
  $("#setPane").innerHTML=h;
  bindSkillPane();
}
function bindSkillPane(){
  const s=$("#skSearch");
  if(s){ s.oninput=()=>{ SET.skq=s.value; const pos=s.selectionStart; renderSkillPane(); const n=$("#skSearch"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }; }
  $("#skReset").onclick=async()=>{
    await api("/settings/skills/reset",{method:"POST"});
    const r=await api("/settings"); SET.data=await r.json(); renderSkillPane();
  };
  $("#setPane").querySelectorAll("[data-sken]").forEach(inp=>{
    inp.onchange=async()=>{
      const name=inp.dataset.sken, on=inp.checked;
      const r=await api("/settings/skill",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,enabled:on})});
      const d=await r.json(); SET.data.skills.mode=d.mode||SET.data.skills.mode;
      const it=SET.data.skills.items.find(x=>x.name===name); if(it)it.enabled=on;
      renderSkillPane();
    };
  });
  $("#setPane").querySelectorAll("[data-skhide]").forEach(b=>{
    b.onclick=async()=>{
      const name=b.dataset.skhide;
      const it=SET.data.skills.items.find(x=>x.name===name); const nv=!(it&&it.hidden);
      await api("/settings/skill",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,hidden:nv})});
      if(it)it.hidden=nv; renderSkillPane();
    };
  });
}

function renderFileList(group){
  const files=(SET.data.files||[]).filter(f=>f.group===group);
  if(group==="agents"){
    // 人设只有一个文件,直接进编辑器
    const f=files[0]; if(f){ openFileEditor(f.rel, "agents"); return; }
  }
  let h;
  if(group==="memory"){
    h='<h3>'+ic("book")+'长期记忆</h3>'+
      '<p class="shint">这些文件会注入 AI 的系统提示(索引 + 画像),点开可查看/编辑。改完保存,下一轮生效。</p>';
    h+='<div class="setrowbtns" style="margin:0 0 6px"><button class="btn ghost sm" id="memNew">'+ic("plus")+' 新建记忆</button></div>';
  } else {
    h='<h3>'+ic("person")+'人设 AGENTS.md</h3>';
  }
  files.forEach(f=>{
    h+='<div class="frow" data-frel="'+esc(f.rel)+'">'+ic("doc")+
       '<span class="fname">'+esc(f.rel)+'</span>'+
       (f.exists?'':'<span class="fmiss">未创建</span>')+
       '<span class="fchev">›</span></div>';
  });
  $("#setPane").innerHTML=h;
  $("#setPane").querySelectorAll("[data-frel]").forEach(row=>{
    row.onclick=()=>openFileEditor(row.dataset.frel, group);
  });
  const mn=$("#memNew");
  if(mn) mn.onclick=()=>{
    let name=prompt("新记忆文件名(会存到 memory/ 下,自动加 .md):");
    if(!name) return;
    name=name.trim().replace(/\.md$/i,"").replace(/[^\w一-龥-]/g,"-");
    if(!name) return;
    openFileEditor("memory/"+name+".md", "memory", true);
  };
}
async function openFileEditor(rel, group, isNew){
  $("#setPane").innerHTML='<div class="setload">加载中…</div>';
  let content="";
  if(!isNew){
    try{ const r=await api("/file/read?rel="+encodeURIComponent(rel)); content=(await r.json()).content||""; }
    catch(e){ $("#setPane").innerHTML='<div class="setempty">读取失败</div>'; return; }
  }
  const backable = group==="memory";
  $("#setPane").innerHTML=
    '<div class="feditor">'+
      '<div class="fetop">'+
        (backable?'<button class="feback" id="feBack">‹ 返回</button>':'')+
        '<span class="fepath">'+esc(rel)+'</span>'+
      '</div>'+
      '<textarea id="feText" spellcheck="false"></textarea>'+
      '<div class="fesave"><span class="festat" id="feStat"></span>'+
        '<button class="btn primary sm" id="feSave">'+ic("save")+' 保存</button></div>'+
    '</div>';
  $("#feText").value=content;

// 触屏左滑会话行露出归档/删除(iOS 邮件同款手势,比长按更符合触屏习惯)
const SWIPE_W=72;   // 需与 CSS .cvact 宽度一致
function closeSwipe(row){ row.classList.remove("swiped"); if(S.swipedConv===row.dataset.conv) S.swipedConv=null; }

  $("#convList").querySelectorAll(".conv.swiped").forEach(r=>{ if(r!==except) closeSwipe(r); });
}
function bindSwipe(row, body, act){
  let startX=0, startY=0, dx=0, lock=null, dragging=false;
  row.addEventListener("touchstart", ev=>{
    if(ev.touches.length!==1) return;
    startX=ev.touches[0].clientX; startY=ev.touches[0].clientY;
    dx=0; lock=null; dragging=false;
    row.classList.add("swiping");
  }, {passive:true});
  row.addEventListener("touchmove", ev=>{
    if(ev.touches.length!==1) return;
    const x=ev.touches[0].clientX, y=ev.touches[0].clientY, ddx=x-startX, ddy=y-startY;
    if(lock===null) lock = Math.abs(ddx)>Math.abs(ddy)+4 ? "x" : (Math.abs(ddy)>Math.abs(ddx)+4 ? "y" : null);
    if(lock!=="x") return;   // 竖向滑动交给列表滚动,不拦截
    dragging=true;
    const base = row.classList.contains("swiped") ? -SWIPE_W : 0;
    dx = Math.max(-SWIPE_W, Math.min(0, base+ddx));
    body.style.transform="translateX("+dx+"px)"; act.style.transform="translateX("+(SWIPE_W+dx)+"px)";
  }, {passive:true});
  const end=()=>{
    row.classList.remove("swiping");
    body.style.transform=""; act.style.transform="";
    if(dragging){
      row._justSwiped=true;
      if(dx<=-SWIPE_W/2){ closeAllSwipes(row); row.classList.add("swiped"); S.swipedConv=row.dataset.conv; } else closeSwipe(row);
    }
    dragging=false;
  };
  row.addEventListener("touchend", end);
  row.addEventListener("touchcancel", end);
}

function findConv(conv){

async function delConv(conv){
  // 语音任务行不在 S.convs 里,从各自所在的列表里乐观移除
  const list = S.convs.some(x=>x.conv===conv) ? S.convs : ((S.voiceSidebar.tasks||[]).some(x=>x.conv===conv) ? S.voiceSidebar.tasks : null);
  if(!list) return;
  const idx=list.findIndex(x=>x.conv===conv);
  const removed=list[idx], wasActive=(S.conv===conv);
  // 乐观假删:先从列表移除并立即重绘,不等服务器
  list.splice(idx,1); delete S.histCache[conv]; idbDel("hist:"+conv); delete S.live[conv]; delete S.streamSnap[conv]; markLive(); renderConvs();
  if(wasActive) openConv(S.convs[0]?S.convs[0].conv:"main");   // 删的是当前会话→切到最近一个
  // 纯本地会话(从未发过消息)服务端没有记录,删完即止
  if(String(conv).startsWith("local-")) return;
  try{
    await api("/conv/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv})});
  }catch(err){
    // 删除失败:回滚列表并提示
    list.splice(idx,0,removed); renderConvs();
    alert("删除失败,已恢复该会话");
  }
}

const SYS_MARK="⚙️[系统]";   // 与后端 selfops.SYS_MARKER 一致:系统注入的轮渲染成居中系统条

// 每轮渲染成一块 <div class="turn-block" data-tid data-sig>,供 renderTurns 按轮 diff 复用 DOM
function buildTurnBlock(t, conv){
  const wrap=el("div","turn-block");
  if(t.user && t.user.startsWith(SYS_MARK)) wrap.append(buildSysNote(t.user.slice(SYS_MARK.length).trim()));
  else wrap.append(buildBubble("me", t.user, t.images).row);
  if(!t.pending){
    const {row,b}=buildBubble("ai","");
    if(t.events && t.events.length){
      const flow=renderEventsFlow(t.events, {conv, tid:t.id});
      // 时间线里一个字都没有(如被截断)→ 末尾补一段最终正文兜底
      if(!t.events.some(x=>x.type==="text") && t.assistant){
        const d=el("div","seg"); d.innerHTML=mdToHtml(t.assistant); flow.append(d);
      }
      b.append(flow);
    }else b.innerHTML=mdToHtml(t.assistant);   // 老数据没存时间线:只有最终正文
    wrap.append(row);
  }else if(t.draft){
    // 进行中但后端正流式写 draft:用部分内容起底兜底,避免刷新后空白;
    // SSE 恢复后 maybeReplayStream 会用同 seg 全文覆盖无缝续上
    const {row,b}=buildBubble("ai","");
    b.innerHTML=mdToHtml(t.draft);
    const st=el("div","status"); st.textContent="回复中…"; b.append(st);
    wrap.append(row);
  }
  return wrap;
}
// 切会话/历史刷新的铺屏:按 turn id 逐条 diff,内容没变的轮直接复用旧 DOM——
// 否则「进行中那一轮的草稿文字每 0.7s 变一次」会拖着前面几十轮历史一起全量重建
// (mdToHtml 解析 + 工具卡片重建),这是切换到长对话时最直接的卡顿来源。
// conv 必传:diff 只在同一会话内的连续两次渲染之间才有意义——换了会话哪怕
// turns[].id 偶然对不上也不该指望复用旧 DOM,这里强制先清空再铺,避免旧会话
// 内容残留(2026-07-24 曾因跳过这层 conv 判断,导致切会话瞬间看到上一个会话的
// 正文残留在新会话下方——本该在 conv 变化时硬清空却漏了)。
let _wrapConv=null;
function renderTurns(turns, conv){
  const wrap=$("#wrap");
  if(conv!==_wrapConv){ wrap.innerHTML=""; _wrapConv=conv; }
  const existing=new Map();
  for(const node of wrap.children){ if(node.dataset && node.dataset.tid) existing.set(node.dataset.tid, node); }
  let anchor=null;
  turns.forEach((t,idx)=>{
    // id 理论上都有(turns 表主键);兜底给个按位置区分的 key,防止万一没有时
    // 多轮全撞在同一个 key 上、互相顶掉导致陈旧节点删不干净。
    const tid=t.id!=null?String(t.id):("i"+idx);
    const sig=JSON.stringify(t);
    let node=existing.get(tid);
    if(!node || node.dataset.sig!==sig){
      const fresh=buildTurnBlock(t, conv);
      fresh.dataset.tid=tid; fresh.dataset.sig=sig;
      if(node) node.replaceWith(fresh); else wrap.insertBefore(fresh, anchor?anchor.nextSibling:wrap.firstChild);
      node=fresh;
    }else if(anchor ? anchor.nextSibling!==node : wrap.firstChild!==node){
      wrap.insertBefore(node, anchor?anchor.nextSibling:wrap.firstChild);  // 顺序变了(罕见)才挪
    }
    existing.delete(tid);
    anchor=node;
  });
  for(const node of existing.values()) node.remove();  // 剩下的是不在新列表里的旧轮(如清空会话)
  updateEmpty(); scrollDown(true);
}
// 工具卡片懒加载:整轮 events 只在用户点开这一轮里任意一张卡片时才拉一次(见 wireLazyToolCard)
async function lazyFetchTurnEvents(ctx){
  if(!ctx || ctx.tid==null) return null;
  if(S.turnEventsCache[ctx.tid]) return S.turnEventsCache[ctx.tid];
  if(S._turnEventsPending && S._turnEventsPending[ctx.tid]) return S._turnEventsPending[ctx.tid];
  const pending=(async()=>{
    try{
      const r=await api("/turn_events?conv="+encodeURIComponent(ctx.conv)+"&id="+encodeURIComponent(ctx.tid));
      const d=await r.json();
      S.turnEventsCache[ctx.tid]=d.events||[];
      return S.turnEventsCache[ctx.tid];
    }catch(e){ return null; }
  })();
  (S._turnEventsPending||(S._turnEventsPending={}))[ctx.tid]=pending;
  const result=await pending;
  delete S._turnEventsPending[ctx.tid];
  return result;
}
// 子代理动态区 chips 渲染,历史重放(有 subs)与懒加载补全共用
function fillSubChips(card, subs){
  const list=subs||[]; if(!card._sub || !list.length) return;
  const bits=['<span>'+ic("zap")+" "+list.length+' 步</span>'];
  for(const x of list.slice(-8)) bits.push('<span>'+esc(x.name)+(x.ok===false?" ✗":" ✓")+'</span>');
  card._sub.innerHTML=bits.join("");
}
// 空壳工具卡首次点开:去拉整轮完整 events,按 tool_id 配对后原地换成真正渲染的卡片
function wireLazyToolCard(card, ctx, blk){
  let loaded=false;
  card._head.onclick=async ()=>{
    const c=card._body.classList.toggle("collapsed"); card._chev.classList.toggle("down",!c);
    if(loaded) return;
    loaded=true;
    const full=await lazyFetchTurnEvents(ctx);
    const fullBlk=full && blk.id!=null ? full.find(x=>x.type==="tool"&&x.id===blk.id) : null;
    if(!fullBlk) return;  // 拉取失败/对不上:保留空壳,不报错刷屏
    const failed=fullBlk.ok===false;
    let real=renderToolCard(fullBlk.name, fullBlk.input||{});
    if(!real){
      if(!failed && !(fullBlk.detail||"").trim()) return;  // 与非懒加载路径一致:无卡且成功无输出就不补
      real=toolCardShell(ic(failed?"warn":"wrench")+" "+esc(fullBlk.name), "", el("div"), true);
    }
    fillSubChips(real, fullBlk.subs);
    if("preview" in fullBlk) applyResult(real, {ok:!failed, preview:fullBlk.preview||"", detail:fullBlk.detail||""});
    real._body.classList.remove("collapsed"); real._chev.classList.add("down");  // 保持刚点开的展开态
    card.replaceWith(real);
  };
}
// 用落库的过程时间线重建一轮回复:文字段与工具卡按当时的真实顺序交错复现。
// ctx({conv,tid})非空时,tool 块若是懒加载空壳(无 input 字段)则渲染占位卡,
// 点开时才去 /turn_events 拉这一轮的完整版——历史 /history 默认只带空壳,省掉大头体积。
function renderEventsFlow(events, ctx){
  const flow=el("div","flow");
  let toolCards=[];
  function flushTools(){
    if(!toolCards.length) return;
    flow.append(makeToolGroup(toolCards, toolCards.length));
    toolCards=[];
  }
  for(const blk of events){
    if(blk.type==="text"){
      flushTools();  // 正文前的指令卡先收组,保持穿插顺序
      if(!blk.text) continue;
      const d=el("div","seg"); d.innerHTML=mdToHtml(blk.text); flow.append(d); continue;
    }
    if(blk.type==="compact"){
      flushTools();
      const d=el("div","compactline"); d.textContent="上下文已自动压缩,对话继续";
      flow.append(d); continue;
    }
    if(blk.type!=="tool") continue;
    const failed=blk.ok===false;
    const light=!("input" in blk);  // 懒加载空壳:没有 input 字段(/history 默认剥掉了)
    let card;
    if(light){
      // hasCard 由后端算好(session_store._strip_tool_block),跟全量路径的
      // 「renderToolCard 有卡 || 失败 || 有输出」判断保持一致,没卡就跳过不占位
      if(!blk.hasCard) continue;
      const finished=!!blk.done;
      card=toolCardShell(ic(failed?"warn":"wrench")+" "+esc(blk.name), blk.hint||"", null, true);
      fillSubChips(card, blk.subs);
      wireLazyToolCard(card, ctx, blk);
      if(!finished) card._path.textContent="…";  // 还没结束的空壳给个占位,别看着像卡死
    }else{
      const finished=("preview" in blk);
      const det=(blk.detail||"").trim();
      card=renderToolCard(blk.name, blk.input||{});
      if(!card){
        if(!failed && !det) continue;        // 无入参卡且成功无输出:与流式一致,不补卡
        card=toolCardShell(ic(failed?"warn":"wrench")+" "+esc(blk.name), "", el("div"), true);
      }
      fillSubChips(card, blk.subs);
      if(finished) applyResult(card, {ok:!failed, preview:blk.preview||"", detail:blk.detail||""});
    }
    toolCards.push(card);
  }
  flushTools();  // 末尾剩余的指令卡也收组

  return flow;
}
async function openConv(conv, silentGroup){

  $("#convTitle").textContent = c ? (c.title||"新对话") : "新对话";
  syncCronHeader();   // 定时任务会话 → 标题栏亮出启停开关/编辑/「⋯」
  setMeta(c || {}); $("#ctxPop").hidden=true;   // 切会话时收起明细弹层
  refreshGit(conv);                              // 项目会话 → 拉 git 状态点亮 ⎇ 按钮
  renderConvs(); closeSidebar(); drawPending();  // 待发送队列按会话独立,切回时重绘
  const isLocal = String(conv).startsWith("local-");
  let cached = S.histCache[conv];
  if(!cached && !isLocal){
    cached = await idbGet("hist:"+conv);        // 内存没有(刷新页面后的第一次打开)→ 试磁盘
    if(S.conv!==conv) return;                    // 等磁盘的功夫用户切走了 → 丢弃,避免内容错乱
    if(cached) S.histCache[conv]=cached;
  }
  const hasMsgs = c && c.turns > 0;             // 侧栏记录里该会话有历史消息
  if(cached){ renderTurns(cached, conv); }      // 命中缓存:立即渲染,消除"先闪空屏再出内容"
  else if(!isLocal && hasMsgs){                 // 只在「换到一个有历史、还没拉过的真实会话」时才铺骨架屏
    $("#wrap").innerHTML=""; $("#empty").style.display="none"; $("#convLoading").classList.add("on");
  }else{                                        // 新建会话 / 空会话:不闪骨架,清空后交给 updateEmpty 出欢迎屏
    $("#wrap").innerHTML=""; $("#convLoading").classList.remove("on");
  }
  if(S.voiceRec[conv]) renderVoicePending(conv);  // 切回时该会话仍在转写 → 补出占位气泡,不然像是丢了
  if(conv && !isLocal){
    try{
      const r=await api("/history?conv="+encodeURIComponent(conv)); const d=await r.json();
      if(S.conv!==conv) return;   // 拉取期间已切到别的会话 → 丢弃过期结果,避免内容错乱
      $("#convLoading").classList.remove("on");
      S.histCache[conv]=d.turns;
      idbSetHist(conv, d.turns);  // 落盘,下次刷新页面这个会话也能秒开
      // renderTurns 内部按轮 diff,没变的轮直接跳过——不用再在这里整包比对一次
      renderTurns(d.turns, conv);
    }catch(e){ $("#convLoading").classList.remove("on"); }
    maybeReplayStream(conv);   // 该会话仍在流式 → 用缓冲在历史下方重建流式气泡(切换不中断)
    if(S.conv===conv && S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);  // 切回带待审批的会话 → 补出按钮
    return;
  }
  if(S.conv!==conv) return;
  updateEmpty(); scrollDown(true);
  maybeReplayStream(conv);
  if(S.pendingChoice[conv]) renderChoice(S.pendingChoice[conv]);
}

// ── 重加载历史(SSE 连接恢复后)──────────────────────────────────────────
// force=true:强制核对一次(用于"流式气泡疑似卡死"场景——例如重连时环形缓冲已把 done 事件
// 挤出去,前端永远等不到收尾)。核对时只信服务端:该轮在 /history 里已落库完成才收气泡改用
// 权威历史重绘;服务端也认为还在跑就绝不打断,只是重置一下卡住计时,过会再核对一次。
async function reloadHistory(force){
  const conv=S.conv;
  if(!conv || String(conv).startsWith("local-")) return;  // 只在非本地会话拉
  if(S.stream && !force) return;  // 正在流式输出中 → 别用全量重绘冲掉流式气泡
  try{
    const r=await api("/history?conv="+encodeURIComponent(conv));
    const d=await r.json();
    if(S.conv!==conv) return;  // await 期间切了会话 → 丢弃
    if(S.stream){
      const last=d.turns[d.turns.length-1];
      if(!last || last.pending){ S.stream.lastEvt=Date.now(); return; }  // 服务端也还在跑,别打断
      finalizeStream();  // 服务端已收尾,前端漏接了 → 收掉卡住的流式气泡,改用下面的权威历史重绘
    }
    S.histCache[conv]=d.turns;
    idbSetHist(conv, d.turns);
    renderTurns(d.turns, conv);  // 内部按轮 diff,没变的轮直接跳过
  }catch(e){}
}

// ── SSE 流式接收 ─────────────────────────────────────────────────────────
// 用 fetch 流式读 SSE,替代原生 EventSource。原因:iOS Safari 只要有活跃的 EventSource
// 长连接,地址栏就【一直转圈】(把没结束的长连接当成"页面还在加载")。fetch 读流不占这个
// "页面加载"语义,转圈消失;且重连完全握在自己手里(回前台立即重连、断线退避重连)。
// 服务端仍是标准 SSE,无需改动。对外暴露与 EventSource 兼容的接口:readyState / close()。
class FetchSSE {
  constructor(url, token){
    this.url=url; this.token=token;
    this.readyState=0;        // 0=连接中 1=已连 2=已关闭
    this.lastId=null;         // 最后收到的 SSE id,重连时带 Last-Event-ID 让服务端补发漏掉的
    this.lastBeat=Date.now(); // 最后收到任何数据(含心跳)的时刻,看门狗据此判断假死
    this.onopen=null; this.onmessage=null;
    this._closed=false; this._ctrl=null; this._wake=null;
    this._loop();
  }
  async _loop(){
    let firstOpen=true;
    while(!this._closed){
      this.readyState=0; this._ctrl=new AbortController();
      try{
        const headers={"X-Auth-Token":this.token};
        if(this.lastId!=null) headers["Last-Event-ID"]=String(this.lastId);
        const resp=await fetch(this.url,{headers, signal:this._ctrl.signal, cache:"no-store"});
        if(resp.status===401){ this.close(); showLogin(); return; }
        if(!resp.ok || !resp.body) throw new Error("http "+resp.status);
        this.readyState=1; this.lastBeat=Date.now();
        if(this.onopen) this.onopen(firstOpen);   // 传首连标志:首连不补历史(openConv 已拉),重连才补
        firstOpen=false;
        const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
        while(!this._closed){
          const {value,done}=await reader.read();
          if(done) break;                          // 服务端关流 → 跳出去重连
          buf+=dec.decode(value,{stream:true});
          let sep;
          while((sep=buf.indexOf("\n\n"))>=0){ const block=buf.slice(0,sep); buf=buf.slice(sep+2); this._emit(block); }
        }
      }catch(e){ /* abort / 网络断,落到下面退避重连 */ }
      if(this._closed) break;
      this.readyState=0; await this._sleep(3000);  // 退避 3s(reconnectNow 可提前唤醒)
    }
    this.readyState=2;
  }
  _emit(block){
    this.lastBeat=Date.now();                      // 收到任何块(含 ": ping")= 连接活着
    let id=null,data=null;
    for(const line of block.split("\n")){
      if(line.startsWith(":")) continue;           // ": ping" / ": connected" 注释行,忽略
      if(line.startsWith("id:")) id=line.slice(3).trim();
      else if(line.startsWith("data:")) data=line.slice(5).trim();
    }
    if(id!=null) this.lastId=id;
    if(data!=null && this.onmessage) this.onmessage({data});
  }
  _sleep(ms){ return new Promise(res=>{ const t=setTimeout(res,ms); this._wake=()=>{ clearTimeout(t); this._wake=null; res(); }; }); }
  reconnectNow(){ if(this._closed) return; if(this._ctrl) try{this._ctrl.abort();}catch(e){} if(this._wake) this._wake(); } // 立刻断开重连(跳过退避)
  close(){ this._closed=true; this.readyState=2; if(this._ctrl) try{this._ctrl.abort();}catch(e){} if(this._wake) this._wake(); }
}
function connect(){
  if(S.es) S.es.close();
  const es = S.es = new FetchSSE("/events", S.token);
  es.onopen = (firstOpen)=>{
    // 首连/重连都拉一次历史:首连补回上次刷新前进行中轮的部分内容(draft_text);
    // 重连补回断连期间漏掉的消息(尤其服务端自我重启后注入的系统消息)。force:重连这一刻
    // 恰是最容易出现"流式气泡卡死"的时候(断线期间 done 被环形缓冲挤掉),顺带核对一次。
    reloadHistory(true);
  };
  es.onmessage = ev=>{ try{
    const d=JSON.parse(ev.data);
    if(d.id){ if(d.id<=S.lastId) return; S.lastId=d.id; }  // 补发/重复的老事件直接丢弃
    handleEvent(d);
  }catch(e){} };
}
// 手机救命稻草:iOS 切后台/锁屏会挂起连接,回前台后连接多半已【假死】(既不报错也不来数据)。
// 页面重新可见 / 重新联网 / 窗口聚焦时,主动 reconnectNow() 强制重连,并直接走 HTTP 拉一次历史
// (不等 SSE 恢复)。8s 看门狗兜底:超过 20s 没收到任何数据(含心跳)就判定假死并强制重连。
function reviveSSE(){
  if(document.hidden) return;
  if(!S.es) connect(); else S.es.reconnectNow();
  reloadHistory(true);          // 强制核对:回前台/回网络时最可能出现"卡在思考中"的漏接
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reviveSSE(); });
window.addEventListener("online", reviveSSE);
window.addEventListener("focus", reviveSSE);
setInterval(()=>{
  if(document.hidden || !S.es) return;
  if(S.es.readyState===2) connect();                                   // 被关掉了 → 重建
  else if(Date.now()-(S.es.lastBeat||0) > 20000) S.es.reconnectNow();  // 20s 无心跳=假死 → 强制重连
  // 连接活着,但当前会话的流式气泡超过 25s 没收到任何新事件 → 疑似卡住(如反复切换多个
  // 正在streaming的会话期间发生过短暂重连,漏接了这条的某帧),强制核对一次历史自愈
  else if(S.stream && Date.now()-(S.stream.lastEvt||S.stream.t0||0) > 25000) reloadHistory(true);
}, 8000);
function ensureStream(t0){
  // 为当前会话准备一个流式 assistant 气泡(含状态行/思考/过程区)
  if(S.stream) return S.stream;
  const row=el("div","row ai");
  const bubble=el("div","bubble");
  const status=el("div","status");
  const thinktog=el("div","thinktog"); const tcv=el("span","chev");
  thinktog.append(tcv, document.createTextNode("思考过程"));
  const think=el("div","think");
  // flow:文字段与工具卡按到达顺序交错追加(复刻 Claude Code 的边说边干)
  const flow=el("div","flow");
  bubble.append(thinktog,think,flow,status);  // 状态行(工作中…)放气泡底部,像 TG 的打字指示
  row.append(bubble); $("#wrap").append(row); updateEmpty();
  thinktog.onclick=()=>{ const on=think.classList.toggle("show"); tcv.classList.toggle("down", on); };
  S.stream={row,bubble,status,think,thinktog,flow,segs:{},tools:[],cards:{},subs:{},activeCard:null,tgroup:null,toolCount:0,t0:t0||Date.now(),lastEvt:Date.now()};
  resumeStreamTimer(S.stream);  // 状态行的耗时计数每秒走字;流被任何路径丢弃(完成/切会话)都会自行停表,不泄漏
  renderStatus();  // 初始即显示"💭 思考中…"动画
  updateSendBtn();
  scrollDown(true); return S.stream;
}
// 给流式状态对象挂一个走字计时器(新建/从快照接回来都用这个),旧表已在挂之前 clearInterval 过
function resumeStreamTimer(s){
  const tm=setInterval(()=>{ if(!S.stream||S.stream.timer!==tm){ clearInterval(tm); return; } renderStatus(); }, 1000);
  s.timer=tm;
}
// 取/建某文字段的 div(按首次出现顺序挂进 flow,与工具卡自然交错)
function segDiv(s, seg){
  seg=seg||0;
  let d=s.segs[seg];
  if(!d){ d=el("div","seg"); d.dataset.raw=""; s.segs[seg]=d; s.flow.append(d); }
  return d;
}
// 全部文字段拼起来(判断"这轮有没有正文"用)
function streamText(s){
  return Object.keys(s.segs).sort((a,b)=>a-b).map(k=>s.segs[k].dataset.raw).join("");
}
let renderPending=false; const dirtySegs=new Set();
function userSelecting(){
  const s=window.getSelection();
  return s && s.rangeCount>0 && !s.isCollapsed;
}
// 用户松手时触发:清理卡住的 renderPending,让积压的 dirtySegs 能渲出来
document.addEventListener("selectionchange", ()=>{
  if(!userSelecting() && renderPending && dirtySegs.size){
    renderPending=false;
    const first=dirtySegs.values().next().value;
    if(first) renderSeg(first);
  }
});
function renderSeg(d){
  dirtySegs.add(d);
  if(renderPending) return; renderPending=true;
  requestAnimationFrame(()=>{ renderPending=false;
    // 用户在选文字时不替换 innerHTML(会销毁选中 DOM,使 iOS 选择菜单闪退),
    // dirtySegs 不清,下次收到 text 事件会继续尝试。
    if(userSelecting()){ renderPending=true; return; }
    for(const x of dirtySegs) x.innerHTML=mdToHtml(x.dataset.raw);
    dirtySegs.clear(); scrollDown(); });
}
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';
function renderStatus(){
  if(!S.stream) return;
  const t=S.stream.tools, hasBody=!!streamText(S.stream);
  // 工具 chip 已下放到 flow 卡片,这里不再重复;只留一条持续的"工作中/思考中"指示
  const secs=Math.max(0, Math.round((Date.now()-(S.stream.t0||Date.now()))/1000));
  const tick=secs>=1?(" · "+(secs>=60?Math.floor(secs/60)+"m"+(secs%60)+"s":secs+"s")):"";
  // 有正文 或 有工具在跑 → 工作中;纯思考(啥都没出)→ 思考中(始终带动画,像 TG)
  const working = hasBody || t.some(x=>!x.done);
  const label = working ? "工作中" : "思考中";
  S.stream.status.innerHTML = '<span class="chip live">'+label+DOTS+esc(tick)+'</span>'
    + '<button type="button" class="statusstop" title="停止回复" aria-label="停止回复"><span class="sq"></span></button>';
}
function finalizeStream(finalText){
  if(!S.stream) return;
  if(S.stream.timer) clearInterval(S.stream.timer);
  S.stream.status.remove(); S.stream.thinktog.remove(); S.stream.think.remove();
  // 回合已结束:还没点的审批按钮全部失效(点了也只会收到"已过期")
  S.stream.bubble.querySelectorAll(".choice button").forEach(b=>{ b.disabled=true; });
  // 交错排布保持原样;只有整轮没渲出任何正文时才用 done 的全文兜底(防丢帧空泡)
  if(finalText!==undefined && !streamText(S.stream)){
    const d=segDiv(S.stream, 0); d.dataset.raw=finalText; d.innerHTML=mdToHtml(finalText);
  }else{
    for(const k in S.stream.segs){ const d=S.stream.segs[k]; d.innerHTML=mdToHtml(d.dataset.raw); }
  }
  S.stream=null; updateSendBtn(); scrollDown();
}
// 构成一个"进行中回合"的流式事件类型(可重放以重建气泡)。done/message/choice 不在此列。
const STREAMY = ["user","start","thinking","text","tool_start","tool_input","tool_end","compact"];
// 每会话缓冲进行中回合的事件;text/thinking 是全量快照:thinking 全局只留最后一条,
// text 按段(seg)各留最后一条 —— 段的先后顺序就是与工具卡交错的顺序,不能压掉。
function bufPush(conv, e){
  const b = S.live[conv] || (S.live[conv]=[]);
  if(e.type==="start" && !e._t0) e._t0=Date.now(); // 记录真实开始时刻,切回重放时恢复计时
  if(e.type==="text"||e.type==="thinking"){
    for(let i=b.length-1;i>=0;i--){
      if(b[i].type!==e.type) continue;
      if(e.type==="text" && (b[i].seg||0)!==(e.seg||0)) continue;
      b[i]=e; return;
    }
  }
  b.push(e);
}
// 仅当"正在回复的会话集合"变化时才重绘列表(圆点靠 CSS 动画常闪,不需逐帧 JS)。
let _liveSig="";
function markLive(){
  const sig=Object.keys(S.live).sort().join(",");
  if(sig===_liveSig) return;
  _liveSig=sig; renderConvs();
}
function handleEvent(e){
  // 服务端进程重启标识:变了说明断线期间进程重启过,环形缓冲/_live 全清空了,
  // 靠事件补发这条路救不回来 —— 主动整体核对一次(侧栏 + 当前会话历史),别等用户自己发现内容旧了
  if(e.type==="hello"){
    const prev=S.bootId; S.bootId=e.boot_id;
    if(prev && prev!==e.boot_id){ loadConvs(); reloadHistory(true); }
    return;
  }
  // 后台标题总结完成 → 刷新侧边栏/标题栏(loadConvs 会顺带同步顶栏标题),无论前后台会话
  if(e.type==="title"){ loadConvs(); return; }
  // 会话有新回合 → 历史已变,作废其缓存(含磁盘),下次打开会重新拉取
  if(e.type==="done"||e.type==="message"){ delete S.histCache[e.conv]; idbDel("hist:"+e.conv); }
  // 维护每会话"进行中"缓冲:无论前台/后台都记录,切回该会话时可完整重建流式气泡
  if(STREAMY.indexOf(e.type)>=0){ bufPush(e.conv, e); markLive();
    // voice-task 起跑事件来自 notify 桥接(主 SSE) → 侧栏此行可能还不存在
    // (首次触发,loadVoiceSidebar 还没拉过最新数据),在这里拉一次确保渲染。
    // 不是每帧都拉:只 start 且行不在侧栏数据里时才触发。
    if(e.type==="start" && String(e.conv).startsWith("voice-task:") &&
       !(S.voiceSidebar.tasks||[]).find(x=>x.conv===e.conv)){
      loadVoiceSidebar();
    }
  }
  if(e.type==="done"||e.type==="message"){
    // 未读标记要在 delete S.live 触发的这次重绘【之前】就位,否则会先渲一帧"没有点"
    // 再渲一帧"灰点冒出来",看着像跳动;这里把橙点摘掉和灰点挂上做成同一次渲染。
    // 定时任务跑完推来的消息:顺带刷新任务列表(last_status/enabled 这些字段不在
    // /conversations 里,得单独拉 /cron/sidebar)
    const isCron = String(e.conv).startsWith("cron-task:");
    const isVoiceTask = String(e.conv).startsWith("voice-task:");
    if(e.conv===S.conv){
      S.pendingReview[e.conv]=false; const c=S.convs.find(x=>x.conv===e.conv); if(c) c.pending_review=false;
      delete S.live[e.conv]; delete S.streamSnap[e.conv]; markLive();
      // 后端不知道"用户正盯着这个会话看",完成时统一先标为未读;这里既然正在看,
      // 主动清一次服务端标记再拉 loadConvs——顺序不能反,否则 loadConvs 抢先拉到
      // 服务端还没清的"未读",又把本地清零覆盖回去。
      api("/conv/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conv:e.conv})})
        .catch(()=>{}).then(loadConvs);
    } else {
      S.pendingReview[e.conv]=true; const c=S.convs.find(x=>x.conv===e.conv); if(c) c.pending_review=true;
      delete S.live[e.conv]; delete S.streamSnap[e.conv]; markLive();
      // voice-task 行来自 /voice/sidebar(非 /conversations),done 后刷新 task_status
      if(isVoiceTask){ loadVoiceSidebar(); } else { loadConvs(); }
    }
    if(isCron) loadCronSidebar();
  }

  if(e.conv!==S.conv){ // 别的会话在后台的事件 → 不打断当前视图(已缓冲,圆点已更新)
    // 审批发给非当前会话:直接弹出全屏确认窗,不让用户漏掉
    if(e.type==="choice"){ S.pendingChoice[e.conv]=e; openChoiceModal(e.conv, e); return; }
    // 该会话这一轮结束了 → 之前暂存的审批已作废,清掉
    if(e.type==="done"||e.type==="message"){ delete S.pendingChoice[e.conv]; }
    if(e.type==="done") flushPending(e.conv);  // 后台会话任务完成 → 补发其待发送队列
    return;
  }
  // 当前会话本轮结束 → 清掉可能残留的暂存审批
  if(e.type==="done"||e.type==="message") delete S.pendingChoice[e.conv];
  if(STREAMY.indexOf(e.type)>=0){ applyStreamEvent(e); if(S.stream) S.stream.lastEvt=Date.now(); return; }
  switch(e.type){
    case "done": {
      const errBubble = S.stream ? S.stream.bubble : null;
      finalizeStream(e.text);
      if(e.is_error){
        if(errBubble) errBubble.classList.add("err");
        // 有 api_error_status(429/529/5xx等)= 后端已确认是模型服务商那边的错,
        // 直接按状态码分类;没有才退回关键词猜测(网络/进程异常等)
        const st=e.api_error_status;
        if(st===429) setRateStatus("warn", "最近遇到限额/过载", e.error);
        else if(st===529) setRateStatus("warn", "Claude 服务过载", e.error);
        else if(st) setRateStatus("err", `Claude 服务出错(${st})`, e.error);
        else {
          const el=(e.error||"").toLowerCase();
          if(/rate|429|quota|limit|overloaded/i.test(el)) setRateStatus("warn", "最近遇到限额/过载", e.error);
          else setRateStatus("err", "", e.error);
        }
      }else{ setRateStatus("ok","",""); }
      setMeta(e); loadConvs(); flushPending(e.conv); break; }
    case "message": // 命令回复 / 报错 / cron 推送
      if(S.stream && !streamText(S.stream)){ finalizeStream(e.text); }
      else { S.stream=null; addBubble("ai", e.text); }
      // 后端推送的报错也更新侧栏状态
      if(e.text&&e.text.includes("⚠️")){
        const el2=e.text.toLowerCase();
        if(/rate|429|quota|limit|overloaded/i.test(el2)) setRateStatus("warn", "最近遇到限额/过载", e.text);
        else setRateStatus("err", "", e.text);
      }
      loadConvs(); flushPending(e.conv); break;
    case "choice": delete S.pendingChoice[e.conv]; renderChoice(e); break;
  }
}
// 创建一个"已执行 N 条命令"可展开折叠组,内放 toolCards
function makeToolGroup(cards, count){
  const grp=el("div","tgroup");
  const head=el("div","tg-head");
  const chev=el("span","chev");
  const label=el("span","tg-label");
  label.textContent="已执行 "+(count||cards.length)+" 条命令";
  head.append(chev, label);
  const body=el("div","tg-body collapsed");
  for(const c of cards) body.append(c);
  grp.append(head, body);
  head.onclick=()=>{ const c=body.classList.toggle("collapsed"); chev.classList.toggle("down", !c); };
  grp._head=head; grp._body=body; grp._label=label; grp._chev=chev;
  return grp;

// 把已完成的指令卡片折叠进"已执行 N 条命令"可展开组
function foldToGroup(s, card){
  let grp = s.tgroup;
  if(!grp){
    // 记下卡在 flow 里的位置再移动,保证折叠组替换原位而非扔到末尾
    const anchor = card ? card.nextSibling : null;
    grp = makeToolGroup([], 0);
    s.tgroup = grp;
    if(card){
      card.classList.remove("tc-active");
      grp._body.append(card);
      s.toolCount = 1;
      grp._label.textContent = "已执行 1 条命令";
      if(!grp.parentNode){
        if(anchor && anchor.parentNode === s.flow){
          s.flow.insertBefore(grp, anchor);
        } else {
          s.flow.append(grp);
        }
      }
    }
  } else if(card){
    card.classList.remove("tc-active");
    grp._body.append(card);
    s.toolCount = (s.toolCount || 0) + 1;
    grp._label.textContent = "已执行 " + s.toolCount + " 条命令";
  }
}
// 把单个流式事件落到 DOM(供前台实时渲染 + 切回会话时按缓冲重放两用)
function applyStreamEvent(e){
  switch(e.type){
    case "user":
      if(S.localSent){ S.localSent=false; break; }  // 本客户端发的,气泡已在 send() 里加了
      // 无活跃流式气泡 = 不是本轮发送 → 历史已渲染过该消息,跳过避免重复
      if(!S.stream) break;
      addBubble("me", e.text); break;
    case "start": ensureStream(e._t0); break;
    case "thinking": { const s=ensureStream(); s.thinktog.style.display="flex"; s.think.textContent=e.text; renderStatus(); break; }
    case "text": { const s=ensureStream(); const d=segDiv(s, e.seg); d.dataset.raw=e.text; renderSeg(d); if(s.activeCard){ foldToGroup(s, s.activeCard); s.activeCard=null; s.tgroup=null; s.toolCount=0; } renderStatus(); break; }
    case "tool_start": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:false, ok:true}); }
      else s.tools.push({name:e.name, id:e.tool_id, done:false, ok:true, subN:0});
      renderStatus(); break; }
    case "tool_input": { const s=ensureStream();
      if(e.parent) break;   // 子代理内部工具的入参不展大卡片(动态在子代理卡里),避免刷屏
      const card=renderToolCard(e.name, e.input||{});
      if(card){
        if(e.tool_id) s.cards[e.tool_id]=card;
        // 上一条活跃指令折叠进组,新指令置为活跃(呼吸灯)
        if(s.activeCard && s.activeCard!==card){ foldToGroup(s, s.activeCard); }
        s.activeCard=card; card.classList.add("tc-active");
        s.flow.append(card); scrollDown();
        // 子代理卡片刚建好:若它的内部工具事件已先到(存在 s.subs),补渲染一次动态区
        if(card._sub && e.tool_id && s.subs[e.tool_id]) renderSub(s, e.tool_id);
      } break; }
    case "tool_end": { const s=ensureStream();
      if(e.parent){ subUpsert(s, e.parent, {name:e.name, id:e.tool_id, done:true, ok:e.ok}); renderStatus(); break; }
      // 优先按 tool_id 配对(并行同名工具不会错标),回退按名字
      const it=(e.tool_id&&s.tools.find(x=>x.id===e.tool_id&&!x.done))
        ||s.tools.find(x=>x.name===e.name&&!x.done)||s.tools[s.tools.length-1];
      if(it){it.done=true;it.ok=e.ok;}
      attachResult(s, e);
      // 呼吸灯不因工具结束而停——持续到下条指令或正文出现才移除
      renderStatus(); break; }
    case "compact": { const s=ensureStream();
      const d=el("div","compactline"); d.textContent="上下文已自动压缩,对话继续";
      s.flow.append(d); scrollDown(); break; }
  }
}
// 切回某会话:若它有进行中的缓冲,重建流式气泡。命中快照(离开前摘下的 DOM)就直接接回来,
// 只补上离开期间新增的那几条事件;没有快照(如页面刚刷新)才从头重放整段缓冲。
function maybeReplayStream(conv){
  if(S.conv!==conv) return;
  const buf=S.live[conv]; if(!buf||!buf.length) return;
  // renderTurns 可能已用 draft 渲染了部分内容;不管接下来走哪条重建路径,都先清掉,
  // 避免出现两个 AI 气泡(草稿+流式)
  // rows 现在可能套在 turn-block 容器里(见 renderTurns),不能再假定是 #wrap 的直接子节点
  const rows=$("#wrap").querySelectorAll(".row.ai");
  for(let i=rows.length-1;i>=0;i--){
    if(rows[i].querySelector(".status")){ rows[i].remove(); break; }
  }
  const snap=S.streamSnap[conv];
  delete S.streamSnap[conv];
  if(snap && snap.asOf<=buf.length){
    S.stream=snap.state;
    $("#wrap").append(S.stream.row);
    resumeStreamTimer(S.stream);
    for(let i=snap.asOf;i<buf.length;i++){         // 只补离开期间新增的事件,已建好的工具卡不重建
      const e=buf[i]; if(e.type==="user") continue;
      applyStreamEvent(e);
    }
    scrollDown(true);  // 接回来的内容跟在刚渲染完的历史后面,补一次滚到底
  }else{
    S.stream=null;
    for(const e of buf){
      if(e.type==="user") continue;   // 用户消息已由历史渲染,重放跳过避免重复气泡
      applyStreamEvent(e);
    }
  }
  if(S.stream) S.stream.lastEvt=Date.now();  // 按当前时刻起算卡住检测,不用缓冲里事件的旧时间
}
// 提示音:Web Audio 现生成两声轻响,不依赖外部音频文件;页面从没交互过(无 AudioContext
// 授权)时 resume 会静默失败,吞掉即可——反正这类场景系统推送那条通知本身也会响。
function playChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const beep = (t, freq) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.24);
    };
    const t0 = ctx.currentTime;
    beep(t0, 880); beep(t0 + 0.14, 1175);
    setTimeout(()=>ctx.close(), 500);
  }catch(e){}
}

// ── 发送 ────────────────────────────────────────────────────────────────
async function send(text, display, opts){
  opts=opts||{};
  closeCmdMenu();
  text=(text||"").trim(); if(!text && !S.images.length) return;
  // 上一个任务还没结束 → 不打断,排进待发送队列,任务完成后自动发(审批/语音走 forceSend 立即发)
  if(S.stream && !opts.forceSend){ if(queuePending(text, S.images.slice())){ S.images=[]; renderThumbs(); $("#ta").value=""; autoGrow(); } return; }
  const imgs=S.images.map(x=>x.url);
  // display:点按钮时传选项文字,气泡显示友好文字而非原始命令(如 /clarify id 0)
  const shown=(display!=null)?display:text;
  // opts.reuseBubble:语音已先冒了占位气泡并回填文字,这里不再重复冒泡
  if(!opts.reuseBubble && (shown || imgs.length)) addBubble("me", shown||"(图片)", imgs);
  // 标记本轮由本客户端发出,避免收到 "user" 事件时渲染重复气泡
  if(!text.startsWith("/")) S.localSent = true;
  // 非命令消息:立刻挂一个"💭 思考中…"气泡,不等服务器 start 事件,反馈更即时(像 TG 秒回 typing)
  if(!text.startsWith("/") && !S.stream){ ensureStream(); }
  const payload={conv:S.conv, text, images:S.images.map(x=>({data:x.data,media_type:x.media_type}))};
  // 新会话:发出第一条后,把本地临时会话转正
  const wasLocal=String(S.conv).startsWith("local-");
  if(wasLocal){ S.conv=S.conv.replace("local-",""); payload.conv=S.conv; renderProjSelChip(); }
  S.images=[]; renderThumbs(); $("#ta").value=""; autoGrow();
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}
// 静默发命令(如 /model 切换):不渲染用户气泡,回执由服务端 message 事件带回
async function sendCmd(cmd, conv){
  conv = conv || S.conv;
  const isCurrent = conv===S.conv;
  const payload={conv:conv, text:cmd, images:[]};
  const wasLocal=String(conv).startsWith("local-");
  if(wasLocal){ conv=conv.replace("local-",""); payload.conv=conv; if(isCurrent){ S.conv=conv; renderProjSelChip(); } }
  try{
    await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(wasLocal) setTimeout(loadConvs, 400);
  }catch(err){ addBubble("ai","⚠️ 发送失败:"+err.message); }
}

// ── 待发送队列 ────────────────────────────────────────────────────────────
function queuePending(text, images){
  if(!text && !(images||[]).length) return;
  const q = S.pending[S.conv] || (S.pending[S.conv]=[]);
  if(q.length>=3){ pendFull(); return false; }  // 满 3 条不再排队,抖一下提示
  q.push({id:++S.pendId, text, images:images||[]});
  drawPending();
  return true;
}
// 队列已满:让待发送区抖一下,给个"到上限了"的即时反馈
function pendFull(){
  const box=$("#pending"); if(!box) return;
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
}
function drawPending(){
  const box=$("#pending"); if(!box) return;
  box.innerHTML="";
  for(const it of (S.pending[S.conv]||[])){
    const row=el("div","pi");
    const clk=el("span","clock"); clk.textContent="⏳";
    const tx=el("span","ptext"); tx.textContent=it.text||"(图片)";
    const del=el("button","pdel"); del.type="button"; del.title="删除"; del.textContent="×";
    del.onclick=()=>removePending(it.id);
    row.append(clk,tx,del); box.append(row);
  }
}
function removePending(id){
  const q=S.pending[S.conv]; if(!q) return;
  const i=q.findIndex(x=>x.id===id); if(i<0) return;
  q.splice(i,1); if(!q.length) delete S.pending[S.conv]; drawPending();
}
// 任务完成 → 发出该会话待发送队列的第一条(逐条发:发一条,等它 done 再发下一条)
function flushPending(conv){
  const q=S.pending[conv]; if(!q || !q.length) return;
  const item=q.shift(); if(!q.length) delete S.pending[conv];
  if(conv===S.conv){
    drawPending();
    S.images=(item.images||[]).slice(); renderThumbs();
    send(item.text, null, {forceSend:true});
    return;
  }
  // 后台会话:直接发,不渲染,靠 SSE 缓冲在切回时重建
  const payload={conv, text:item.text, images:(item.images||[]).map(x=>({data:x.data,media_type:x.media_type}))};
  api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(loadConvs).catch(()=>{});
}

// ── 图片 ────────────────────────────────────────────────────────────────
// 读一个图片文件 → 必要时前端先压缩 → base64 并入待发送队列(选择/粘贴复用)。
// 压缩策略:长边超 1568px(Claude 视觉输入的有效上限)或体积超 300KB 时,
// 缩到 1568px 内并重编码 JPEG(q=0.85);GIF 保动画不压;压完更大则退回原图。
const IMG_MAX_EDGE=1568, IMG_KEEP_BYTES=300*1024;
function addImageFile(f){
  if(!f || !(f.type||"").startsWith("image/")) return;
  compressImage(f).then(im=>{ S.images.push(im); renderThumbs(); });
}
async function compressImage(f){
  const raw=await new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.onerror=rej; rd.readAsDataURL(f); });
  const orig={data:raw.split(",")[1], media_type:f.type||"image/png", url:raw};
  if(f.type==="image/gif") return orig;
  if(f.size<=IMG_KEEP_BYTES){
    // 小文件只在尺寸也不超时才免压(有些截图体积小但像素巨大)
    try{ const im=await loadImgEl(raw); if(Math.max(im.naturalWidth,im.naturalHeight)<=IMG_MAX_EDGE) return orig; }catch(e){ return orig; }
  }
  try{
    const im=await loadImgEl(raw);
    const long=Math.max(im.naturalWidth,im.naturalHeight)||1;
    const scale=Math.min(1, IMG_MAX_EDGE/long);
    const w=Math.max(1,Math.round(im.naturalWidth*scale)), h=Math.max(1,Math.round(im.naturalHeight*scale));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);   // JPEG 无透明通道,垫白底
    ctx.drawImage(im,0,0,w,h);
    const out=cv.toDataURL("image/jpeg",0.85);
    if(out.length>=raw.length) return orig;
    return {data:out.split(",")[1], media_type:"image/jpeg", url:out};
  }catch(e){ return orig; }   // 解码失败(如 heic 某些浏览器不认)兜底发原图
}
function loadImgEl(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
$("#imgBtn").onclick = ()=>$("#file").click();
$("#file").onchange = e=>{ for(const f of e.target.files) addImageFile(f); e.target.value=""; };
// 粘贴:聊天框内 Ctrl/⌘+V 粘贴剪贴板里的图片(可多张),并入队列;纯文本粘贴不受影响
$("#ta").addEventListener("paste", e=>{
  const items = e.clipboardData && e.clipboardData.items; if(!items) return;
  let got=false;
  for(const it of items){
    if(it.kind==="file" && (it.type||"").startsWith("image/")){ const f=it.getAsFile(); if(f){ addImageFile(f); got=true; } }
  }
  if(got) e.preventDefault();   // 有图才拦截,让纯文本粘贴走默认行为
});
function renderThumbs(){
  const box=$("#thumbs"); box.innerHTML="";
  S.images.forEach((im,idx)=>{ const w=el("div","t"); const g=el("img"); g.src=im.url; const x=el("button","x"); x.textContent="×"; x.onclick=()=>{S.images.splice(idx,1);renderThumbs();}; w.append(g,x); box.append(w); });
}

// ── 图片大图查看器:点聊天里的图放大,←/→ 或按钮切换,Esc/✕/点背景关闭 ─────
const IV={list:[], idx:0};
// 历史图的 blob: URL 在 loadAuthedImg 显示后已被 revoke,不能直接复制 src;
// 从仍持有解码数据的 <img> 经 canvas 重新导出,并缓存在元素上避免重复导出。
function ivSrc(im){
  if(!im.src.startsWith("blob:")) return im.src;
  if(im._ivurl) return im._ivurl;
  try{
    const cv=document.createElement("canvas"); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
    cv.getContext("2d").drawImage(im,0,0);
    im._ivurl=cv.toDataURL("image/png"); return im._ivurl;
  }catch(e){ return im.src; }
}
function openImgViewer(img){
  IV.list=Array.from(document.querySelectorAll("#wrap .imgs img")).filter(g=>g.src && g.naturalWidth);
  if(!IV.list.length) return;
  IV.idx=Math.max(0, IV.list.indexOf(img));
  renderImgViewer();
  $("#imgViewer").hidden=false;
}
function renderImgViewer(){
  const n=IV.list.length;
  IV.idx=(IV.idx+n)%n;
  $("#ivImg").src=ivSrc(IV.list[IV.idx]);
  $("#ivCount").textContent=(IV.idx+1)+" / "+n;
  $("#ivPrev").style.display=$("#ivNext").style.display=$("#ivCount").style.display = n>1?"":"none";
}
function closeImgViewer(){ $("#imgViewer").hidden=true; $("#ivImg").removeAttribute("src"); IV.list=[]; }
$("#ivClose").onclick=closeImgViewer;
$("#ivPrev").onclick=e=>{ e.stopPropagation(); IV.idx--; renderImgViewer(); };
$("#ivNext").onclick=e=>{ e.stopPropagation(); IV.idx++; renderImgViewer(); };
$("#imgViewer").onclick=e=>{ if(e.target.id==="imgViewer") closeImgViewer(); };  // 点图片本身不关
document.addEventListener("keydown", e=>{
  if($("#imgViewer").hidden) return;
  if(e.key==="Escape") closeImgViewer();
  else if(e.key==="ArrowLeft"){ IV.idx--; renderImgViewer(); }
  else if(e.key==="ArrowRight"){ IV.idx++; renderImgViewer(); }
});

// ── 语音输入(录音 → 后端 SenseVoice 转写 → 填进输入框)────────────────────
// Claude 不吃音频,故先在后端转成文字。点一下开录(实时声波动效)、再点结束,转好的文字并入输入框可编辑再发。
const REC = { state:"idle", mr:null, chunks:[], stream:null, mime:"", t0:0, timer:null, cancel:false,
  actx:null, analyser:null, dataArr:null, raf:null, levels:[], waveColor:"#ef4444", _lastPush:0 };
function setRecUI(){
  // 只在"录音中"显示录音条;点发送后立即收起录音条、恢复输入框,转写状态改由聊天区占位气泡承载
  const rec=REC.state==="recording";
  const row=$("#recRow"), inrow=document.querySelector(".inrow");
  row.classList.toggle("show", rec);
  if(inrow) inrow.style.display = rec ? "none" : "";
}
function recTick(){ const s=Math.max(0,Math.floor((Date.now()-REC.t0)/1000)); $("#recTime").textContent=(s/60|0)+":"+String(s%60).padStart(2,"0"); }
// 滚动声波:采样(取音量)节流到约每 75ms 一次,但渲染每帧都画——用采样间隔内的时间差
// 算出平滑偏移量,让柱子连续向左滑而不是每 75ms 才跳一格(避免低帧率卡顿感)
function drawWave(){
  if(REC.state!=="recording" || !REC.analyser){ return; }
  REC.raf=requestAnimationFrame(drawWave);
  const now=Date.now();
  const PUSH_MS=75;
  if(now - REC._lastPush >= PUSH_MS){   // 节流:只控制"多久取一次样",不影响绘制帧率
    REC._lastPush=now;
    REC.analyser.getByteTimeDomainData(REC.dataArr);
    let sum=0; for(let i=0;i<REC.dataArr.length;i++){ const x=(REC.dataArr[i]-128)/128; sum+=x*x; }
    REC.levels.push(Math.min(1, Math.sqrt(sum/REC.dataArr.length)*3.4));
  }
  const cv=$("#recWave"); if(!cv) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||1, H=cv.clientHeight||1;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const barW=3, step=5, maxBars=Math.floor(W/step)+2;
  if(REC.levels.length>maxBars) REC.levels.splice(0, REC.levels.length-maxBars);
  const offset=step*Math.min(1, (now-REC._lastPush)/PUSH_MS);   // 采样间隔内的连续滚动偏移
  ctx.fillStyle=REC.waveColor;
  const n=REC.levels.length;
  for(let i=0;i<n;i++){
    const h=Math.max(3, REC.levels[i]*(H-4)), x=W-(n-i)*step-offset, y=(H-h)/2;
    if(x+barW<0) continue;
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,barW,h,barW/2); ctx.fill(); }
    else ctx.fillRect(x,y,barW,h);
  }
}
function cleanupAudio(){
  if(REC.raf){ cancelAnimationFrame(REC.raf); REC.raf=null; }
  try{ if(REC.actx && REC.actx.state!=="closed") REC.actx.close(); }catch(e){}
  REC.actx=null; REC.analyser=null; REC.levels=[];
  const cv=$("#recWave"); if(cv){ const c=cv.getContext("2d"); if(c) c.clearRect(0,0,cv.width,cv.height); }
}
// 每次录音结束即释放麦克风流(见 onRecStop),这里负责按需重新获取;权限按站点记住,不会反复弹框
async function getMic(){
  if(REC.stream && REC.stream.getAudioTracks().some(t=>t.readyState==="live")) return REC.stream;
  REC.stream = await navigator.mediaDevices.getUserMedia({audio:true});
  return REC.stream;
}
function releaseMic(){ if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; } }
async function startRec(){
  if(REC.state!=="idle") return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert("此浏览器不支持录音"); return; }
  try{ await getMic(); }
  catch(e){ alert("麦克风权限被拒绝或不可用"); return; }
  // 限码率:识别不需要高音质,压低码率能大幅缩短手机上传耗时(实测上传经常比转写本身还慢)
  REC.chunks=[]; REC.cancel=false; REC._lastPush=0; REC.mr=new MediaRecorder(REC.stream,{audioBitsPerSecond:24000});
  REC.mime = REC.mr.mimeType || "audio/webm";
  REC.mr.ondataavailable=e=>{ if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=onRecStop;
  try{   // 实时声波(失败不影响录音本身)
    const AC=window.AudioContext||window.webkitAudioContext;
    REC.actx=new AC(); if(REC.actx.state==="suspended") await REC.actx.resume();
    REC.analyser=REC.actx.createAnalyser(); REC.analyser.fftSize=512;
    REC.actx.createMediaStreamSource(REC.stream).connect(REC.analyser);
    REC.dataArr=new Uint8Array(REC.analyser.fftSize); REC.levels=[];
    REC.waveColor=(getComputedStyle(document.documentElement).getPropertyValue("--err").trim())||"#ef4444";
  }catch(e){ REC.analyser=null; }
  REC.mr.start(); REC.state="recording"; REC.t0=Date.now(); recTick();
  REC.timer=setInterval(recTick,500); setRecUI();
  if(REC.analyser) drawWave();
}
function stopRec(cancel){
  if(REC.state!=="recording") return;
  REC.cancel=!!cancel; clearInterval(REC.timer); REC.timer=null;
  try{ REC.mr.stop(); }catch(e){}
}
// 转写中占位气泡:按"录音发起时所属会话"存进 S.voiceRec,切走再切回能补出来(否则像是丢了)
function renderVoicePending(conv){
  const st=S.voiceRec[conv]; if(!st) return;
  const b=addBubble("me","");
  b.classList.add("voicebub");
  b.innerHTML='<span class="vwait"><span class="sp"></span>转写中…</span>';
  st.bubble=b;
}
async function onRecStop(){
  cleanupAudio();   // 停声波分析
  releaseMic();     // 立刻停掉麦克风流,灭掉 iOS 状态栏录音指示灯(权限已按站点记住,下次不再弹框)
  const blob=new Blob(REC.chunks,{type:REC.mime}); const mime=REC.mime;
  REC.mr=null;
  if(REC.cancel || blob.size<1200){ REC.state="idle"; setRecUI(); return; }
  // 记住录音发起时所在的会话:转写这段时间用户可能已切到别的会话,完成后要发到这个会话而非当前会话
  const conv=S.conv;
  // 点发送:立即收起录音条,在聊天区冒一个"我"的占位气泡(转写中…),不等结果
  REC.state="transcribing"; setRecUI();
  S.voiceRec[conv]={};
  renderVoicePending(conv);
  try{
    const ext = mime.includes("mp4")||mime.includes("mpeg")?"mp4":mime.includes("ogg")?"ogg":mime.includes("wav")?"wav":"webm";
    const fd=new FormData(); fd.append("audio", blob, "voice."+ext);
    const r=await api("/transcribe",{method:"POST",body:fd});
    const d=await r.json().catch(()=>({}));
    const st=S.voiceRec[conv]; delete S.voiceRec[conv];
    const here=S.conv===conv;   // 转写完成时是否还停留在发起录音的那个会话
    if(r.ok && d.text){
      if(here && st && st.bubble){
        // 还在原会话:文字回填占位气泡,再复用它自动发给 Claude(不重复冒泡)
        st.bubble.classList.remove("voicebub"); st.bubble.textContent=d.text;
        await send(d.text, null, {reuseBubble:true, forceSend:true});
      }else{
        // 已切到别的会话:占位气泡早被清空,直接发到后台会话,靠历史/SSE 缓冲在切回时补出来;
        // 若该会话还是未转正的本地新会话(local-xxx),后端不认识这个前缀,得先去掉
        const realConv = String(conv).replace(/^local-/,"");
        const payload={conv:realConv, text:d.text, images:[]};
        await api("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
        if(realConv!==conv){ const c=S.convs.find(x=>x.conv===conv); if(c) c.conv=realConv; }
        loadConvs();
      }
    } else if(here && st && st.bubble){ voiceFail(st.bubble, d.error); }
  }catch(e){
    const st=S.voiceRec[conv]; delete S.voiceRec[conv];
    if(S.conv===conv && st && st.bubble) voiceFail(st.bubble, "转写失败:"+e.message);
  }
  REC.state="idle"; setRecUI();
}
// 转写没识别到内容:占位气泡改成"没听清"+重录按钮,绝不把空内容误发给 Claude
function voiceFail(b, msg){
  b.classList.remove("voicebub"); b.innerHTML="";
  const t=el("span","vfailtxt"); t.textContent="🎤 "+(msg||"没识别到内容,再说一次");
  const rb=el("button"); rb.type="button"; rb.className="vretry"; rb.textContent="重录";
  rb.onclick=()=>{ const row=b.closest(".row"); if(row) row.remove(); startRec(); };
  b.append(t, rb);
}
function insertToInput(t){
  const ta=$("#ta");
  ta.value = ta.value.trim() ? (ta.value.replace(/\s+$/,"")+" "+t) : t;

}
