# vococo 服务器版编排(单机 VPS 起步形态,见 docs/design/server-edition-tech-plan.md §10)
# 用法:cp .env.server.example .env.server 填好 → docker compose up -d
services:
  vococo:
    build: .
    container_name: vococo-server
    restart: always           # 容器级守护,替代 deploy/run.sh 的 nohup 循环
    env_file: .env.server
    volumes:
      - vococo-data:/app/data # 平台库 + 全部租户数据,唯一必须备份的卷
    ports:
      - "127.0.0.1:8848:8848" # 只绑本机,TLS 终结交给 Caddy/CF,不直接暴露

  caddy:
    image: caddy:2-alpine
    container_name: vococo-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vococo

volumes:
  vococo-data:
  caddy-data:
  caddy-config:
