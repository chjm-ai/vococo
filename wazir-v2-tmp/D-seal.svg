<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#faf8f3"/>
  <g transform="translate(200,114)">
    <!-- 印玺实底方章：印泥红，微圆角 -->
    <rect x="-60" y="-60" width="120" height="120" rx="13" fill="#b91c1c"/>
    <!-- 双层印框：细留白线 -->
    <rect x="-46.5" y="-46.5" width="93" height="93" rx="7" fill="none" stroke="#faf8f3" stroke-width="2.2" opacity="0.92"/>
    <!-- 负空间篆意 W：三竖悬针，顶端齐平，中竖略短，谷底起伏读作 W -->
    <g fill="#faf8f3">
      <path d="M -30 -26 L -18.5 -26 L -12.5 19 L -18.75 31 L -25 19 Z"/>
      <path d="M -5.75 -26 L 5.75 -26 L 3 15 L 0 25 L -3 15 Z"/>
      <path d="M 18.5 -26 L 30 -26 L 25 19 L 18.75 31 L 12.5 19 Z"/>
    </g>
  </g>
  <text x="200" y="247" text-anchor="middle" fill="#1a1a2e"
        font-family="Georgia, 'Times New Roman', serif" font-size="37" letter-spacing="9">Wazir</text>
</svg>
